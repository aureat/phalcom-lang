[package]
name = "phalcom-semantic"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
default = []
perf-observability = ["dep:telos-observability"]
test-timings = ["perf-observability"]

[dependencies]
phalcom-ast = { path = "../phalcom-ast" }
phalcom-common = { path = "../phalcom-common" }
phalcom-diagnostics = { path = "../phalcom-diagnostics" }
phalcom-modules = { path = "../phalcom-modules" }
phalcom-native-meta = { path = "../phalcom-native-meta" }
phalcom-native-surface = { path = "../phalcom-native-surface" }
phalcom-type-meta = { path = "../phalcom-type-meta" }
phalcom-compiler-artifact = { path = "../phalcom-compiler-artifact" }
telos-observability = { path = "../telos-observability", optional = true }
thiserror = { workspace = true }
im = { workspace = true }
num-bigint = { workspace = true }
#serde = { workspace = true }
#indexmap = { workspace = true }


[dev-dependencies]
tempfile = "3.17"
phalcom-modules = { path = "../phalcom-modules", features = ["test-support"] }
telos-observability = { path = "../telos-observability" }

[[test]]
name = "semantic"
path = "tests/semantic.rs"
