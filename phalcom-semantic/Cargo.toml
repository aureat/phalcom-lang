[package]
name = "phalcom-semantic"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
default = []
allocation-diagnostics = []
perf-observability = ["dep:telos-observability"]
test-timings = ["perf-observability"]

[dependencies]
phalcom-ast = { path = "../phalcom-ast" }
phalcom-common = { path = "../phalcom-common" }
phalcom-diagnostics = { path = "../phalcom-diagnostics" }
phalcom-modules = { path = "../phalcom-modules" }
phalcom-native-meta = { path = "../phalcom-native-meta" }
phalcom-native-surface = { path = "../phalcom-native-surface" }
phalcom-type-meta = { path = "../phalcom-type-meta" }
phalcom-compiler-artifact = { path = "../phalcom-compiler-artifact" }
telos-observability = { path = "../telos-observability", optional = true }
thiserror = { workspace = true }
im = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
#indexmap = { workspace = true }


[dev-dependencies]
tempfile = "3.17"
phalcom-modules = { path = "../phalcom-modules", features = ["test-support"] }
telos-observability = { path = "../telos-observability" }

[[test]]
name = "semantic"
path = "tests/semantic.rs"

[[test]]
name = "session-indexer-match"
path = "tests/session_indexer_match.rs"

[[test]]
name = "semantic-product-request"
path = "tests/semantic_product_request.rs"

[[test]]
name = "module-static-binding-fingerprint"
path = "tests/module_static_binding_fingerprint.rs"

# Keep the test-only global allocator isolated from the parallel semantic suite.
[[test]]
name = "artifact-allocation"
path = "tests/semantic/artifact_allocation.rs"

[[test]]
name = "semantic-artifact"
path = "tests/semantic_artifact_test.rs"

[[test]]
name = "artifact_query_import_test"
path = "tests/artifact_query_import_test.rs"
