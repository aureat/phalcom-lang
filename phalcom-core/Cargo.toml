[features]
default = []
# Per-opcode `tracing` instrumentation in the VM dispatch loop (`vm/dispatch.rs`):
# a `vm_opcode` span plus stack-state `debug!`s around every instruction.
#
# Off by default and compiled out entirely, because the cost is not avoidable at
# runtime: with every subscriber filtered to `LevelFilter::OFF` the callsites still
# cost a measured 18.2% of arith wall-clock (perf-log 003). Enable it to debug the
# dispatch loop; do not enable it for benchmarking or release use.
#
# This gates only the dispatch loop. `tracing` stays a hard dependency: the compiler
# and `vm/api.rs` instrument cold paths, where the same cost does not arise.
vm-trace = []
# Fiber stack/frame-buffer recycling pool (U-GC step 5). Measured net
# negative in A/B whole-process benchmarking (perf-log, 2026-07-14): pool
# bookkeeping cost exceeds the allocations it avoids. Off by default; kept
# as a flag only so the experiment can be re-run/re-measured later without
# reconstructing it from the stash.
fiber-pool = []
# Per-opcode execution counters in the VM dispatch loop (`opcode_stats`), dumped
# to stderr at process exit.
#
# Off by default: it is an increment per instruction, which is exactly the kind of
# per-opcode cost `vm-trace` was gated for (perf-log 003). It exists to answer
# "what does one instruction cost", which nothing else in the harness can — `sample`
# collapses every opcode arm into `run_until_inner`, so profiling attributes the
# whole dispatch loop to one frame and prices no opcode.
#
# **Counts are deterministic, so do not read timings from a build with this on.**
# The measurement protocol is two runs: counts from a `--features opcode-histogram`
# build, wall-clock from a default build, divided. That keeps the counter's own cost
# out of the number it produces. `benchmarks/vm/opcode-cost.py` does exactly this.
opcode-histogram = []
# Criterion is only used by `benches/vm_bench.rs`. Keep its sizable dependency
# graph out of ordinary test builds; opt in with `--features benchmarks`.
benchmarks = ["dep:criterion"]

[dependencies]
phalcom-ast = { path = "../phalcom-ast" }
phalcom-common = { path = "../phalcom-common" }
phalcom-type-syntax = { path = "../phalcom-type-syntax" }
phalcom-native-meta = { path = "../phalcom-native-meta" }
phalcom-native-macros = { path = "../phalcom-native-macros" }
phalcom-native-surface = { path = "../phalcom-native-surface" }
phalcom-modules = { path = "../phalcom-modules" }
phalcom-semantic = { path = "../phalcom-semantic" }
phalcom-diagnostics = { path = "../phalcom-diagnostics" }
phalcom-type-meta = { path = "../phalcom-type-meta" }
linkme = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.12"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lazy_static = "1.5.0"
rand = "0.9.2"
clap = { version = "4.5.41", features = ["derive"] }
anyhow = "1.0.98"
color-print = "0.3.7"
slotmap = "1"
unicode-width = { workspace = true }
num-bigint = { workspace = true }
num-traits = "0.2"
num-integer = "0.1"
ryu = "1"
criterion = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "vm_bench"
harness = false
required-features = ["benchmarks"]
