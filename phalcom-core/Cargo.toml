[package]
name = "phalcom-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "phalcom"
path = "bin/phalcom/main.rs"

[[bin]]
name = "gen-core-table"
path = "bin/gen-core-table/main.rs"

[features]
default = []
# Per-opcode `tracing` instrumentation in the VM dispatch loop (`vm/dispatch.rs`):
# a `vm_opcode` span plus stack-state `debug!`s around every instruction.
#
# Off by default and compiled out entirely, because the cost is not avoidable at
# runtime: with every subscriber filtered to `LevelFilter::OFF` the callsites still
# cost a measured 18.2% of arith wall-clock (perf-log 003). Enable it to debug the
# dispatch loop; do not enable it for benchmarking or release use.
#
# This gates only the dispatch loop. `tracing` stays a hard dependency: the compiler
# and `vm/api.rs` instrument cold paths, where the same cost does not arise.
vm-trace = []
# Fiber stack/frame-buffer recycling pool (U-GC step 5). Measured net
# negative in A/B whole-process benchmarking (perf-log, 2026-07-14): pool
# bookkeeping cost exceeds the allocations it avoids. Off by default; kept
# as a flag only so the experiment can be re-run/re-measured later without
# reconstructing it from the stash.
fiber-pool = []

[dependencies]
phalcom-ast = { path = "../phalcom-ast" }
phalcom-common = { path = "../phalcom-common" }
indexmap = { workspace = true }
thiserror = "2.0.12"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lazy_static = "1.5.0"
rand = "0.9.2"
clap = { version = "4.5.41", features = ["derive"] }
anyhow = "1.0.98"
color-print = "0.3.7"
slotmap = "1"

[dev-dependencies]
# Tier 0 instrumentation (U-BENCH, performance.md §4). Micro-benches only —
# whole-process Skynet is measured by benchmarks/vm/run.sh instead, since
# criterion's iteration/warmup model would mask whole-process cost
# (performance.md §2, "whole-process lifetime is the unit of measurement").
criterion = "0.5"

[[bench]]
name = "vm_bench"
harness = false
