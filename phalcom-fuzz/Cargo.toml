[package]
name = "phalcom-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
phalcom-ast = { path = "../phalcom-ast" }
phalcom-core = { path = "../phalcom-core" }

# Detach from the root workspace: cargo-fuzz builds this crate on its own with
# a nightly toolchain and sanitizer flags, so it must not be a workspace member.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vm"
path = "fuzz_targets/vm.rs"
test = false
doc = false
bench = false
