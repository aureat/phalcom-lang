name: C1 semantic lint autofix

on:
  push:
    branches: [c1-completion-audit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c1-completion-audit
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - name: Apply semantic cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "phalcom-semantic/src/checker/expression.rs",
              "                let Some(target_id) = target.as_ref() else {\n                    return None;\n                };",
              "                let target_id = target.as_ref()?;",
          )
          replace_once(
              "phalcom-semantic/src/session.rs",
              "                                if let Err(e) = refresh_cached_body_dependencies(&mut self.db, &query_key, &formal_inputs, Arc::make_mut(&mut self.store)) {\n                                    return Err(e);\n                                }",
              "                                refresh_cached_body_dependencies(&mut self.db, &query_key, &formal_inputs, Arc::make_mut(&mut self.store))?;",
          )
          PY
          cargo +nightly-2026-07-10 fmt --all
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git rm .github/workflows/c1-autofix3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-semantic/src/checker/expression.rs phalcom-semantic/src/session.rs
          git commit -m "fix(semantic): satisfy C1 release lints"
          git push origin HEAD:c1-completion-audit
