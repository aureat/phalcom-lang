name: Agent C4 P3 conditional witness bridge

on:
  push:
    branches:
      - agent/c4-p3-complex-closure-7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/c4-p3-complex-closure-7
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply staged bridge patch
        run: |
          python .github/scripts/c4_p3_conditional_bridge.py
          cargo fmt --all
          git diff --check
          git diff -- phalcom-core/src/compiler/lib/impl_decl.rs phalcom-core/src/compiler/lib/scope.rs phalcom-core/src/compiler/lib/associated.rs phalcom-core/src/vm/mod.rs phalcom-core/tests/core/language/traits.rs
      - name: Verify core builds
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' check -p phalcom-core
      - name: Conditional inherent witness runtime probe
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_default_uses_proven_conditional_inherent_witness -- --nocapture
      - name: Trait-only conformance bound-reference control
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_evidenced_bound_reference_executes_conformance_witness -- --nocapture
      - name: Specialized exact-target control
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::specialized_generic_targets_keep_distinct_trait_execution -- --nocapture
      - name: Commit patch and remove temporary files
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-c4-p3-fixture-normalization.yml .github/scripts/c4_p3_conditional_bridge.py
          git add phalcom-core/src/compiler/lib/impl_decl.rs phalcom-core/src/compiler/lib/scope.rs phalcom-core/src/compiler/lib/associated.rs phalcom-core/src/vm/mod.rs phalcom-core/tests/core/language/traits.rs
          git diff --cached --check
          git commit -m 'bridge conditional witnesses into trait execution'
          git push origin HEAD:agent/c4-p3-complex-closure-7
