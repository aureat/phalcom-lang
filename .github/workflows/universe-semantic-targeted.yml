name: Universe semantic targeted

on:
  push:
    branches: [fix/universe-semantic-source]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""
  RUSTC_WRAPPER: ""

jobs:
  semantic:
    name: Focused Universe semantic regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
      - name: Canonical Universe parse/link
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-modules --test builtin_provider
          canonical_universe_sources_parse_interfaces_and_link
          -- --exact --nocapture
      - name: Option typing regressions
        id: option
        continue-on-error: true
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-semantic --test semantic
          'semantic::integration::option_typing::'
          -- --nocapture
      - name: Result callback regressions
        id: result
        continue-on-error: true
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-semantic --test semantic
          'semantic::integration::result_callbacks::'
          -- --nocapture
      - name: Universe diagnostic regressions
        id: universe
        continue-on-error: true
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-semantic --test semantic
          'semantic::integration::universe_diagnostics::'
          -- --nocapture
      - name: Require all focused checks
        if: always()
        run: |
          test "${{ steps.option.outcome }}" = "success"
          test "${{ steps.result.outcome }}" = "success"
          test "${{ steps.universe.outcome }}" = "success"
