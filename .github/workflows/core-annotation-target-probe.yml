name: Core annotation target probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: core-annotation-target-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Publish compiler-owned type annotation targets
        run: |
          python3 .github/scripts/apply-core-annotation-target.py
          cargo +stable fmt --all
          git diff --check

      - name: Check semantic library
        run: cargo check -p phalcom-semantic --lib

      - name: Canonical annotation target regression
        run: cargo test -p phalcom-semantic --test semantic builtin_type_annotation_has_canonical_target -- --nocapture

      - name: Commit validated annotation target repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-semantic/src/source_index/builder.rs phalcom-semantic/src/source_index/occurrence.rs phalcom-semantic/src/source_index/mod.rs phalcom-semantic/src/session.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(semantic): publish canonical type annotation targets"
          git push origin HEAD:codex/lsp-single-world-retirement
