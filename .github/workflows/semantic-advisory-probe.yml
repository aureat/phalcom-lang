name: Semantic advisory probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: semantic-advisory-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Apply previously validated class-object root patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/semantic-constructor-probe.yml').read_text().splitlines()
          marker = '      - name: Apply class-object behavior root repair'
          start = source.index(marker)
          run_line = next(i for i in range(start + 1, len(source)) if source[i].startswith('        run: |'))
          end = next(i for i in range(run_line + 1, len(source)) if source[i].startswith('      - name:'))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[run_line + 1:end]) + '\n'
          Path('/tmp/apply-root.sh').write_text(script)
          PY
          bash /tmp/apply-root.sh

      - name: Apply formal-to-advisory callable projection
        run: |
          cat > phalcom-semantic/src/advisory/formal.rs <<'RS'
          //! Bounded formal-to-advisory projection.
          //!
          //! This helper reads canonical `TypeData` only. It does not synthesize
          //! declarations, diagnostics, or checker knowledge, and its depth bound makes
          //! pathological generic/union shapes fail closed to `Unknown`.

          use crate::types::evidence::TypeKnowledge;
          use crate::types::id::TypeId;
          use crate::types::parameter::SelfRole;
          use crate::types::store::{TypeData, TypeStore};

          use super::{AdvisoryFact, AdvisoryOrigin, ValueShape};

          pub const DEFAULT_FORMAL_PROJECTION_DEPTH: usize = 8;

          /// Projects one formal knowledge result into advisory runtime shape.
          pub fn advisory_fact_from_formal(store: &TypeStore, knowledge: &TypeKnowledge, origin: AdvisoryOrigin) -> AdvisoryFact {
              AdvisoryFact::interprocedural(advisory_shape_from_formal(store, knowledge), origin)
          }

          /// Projects formal knowledge to a bounded advisory shape without constructing
          /// advisory provenance.
          pub fn advisory_shape_from_formal(store: &TypeStore, knowledge: &TypeKnowledge) -> ValueShape {
              shape_from_knowledge(store, knowledge, None, DEFAULT_FORMAL_PROJECTION_DEPTH)
          }

          /// Projects formal callable knowledge relative to a concrete advisory receiver.
          /// Owner-relative `Self` is resolved from the receiver shape without mutating
          /// or re-running the formal checker.
          pub fn advisory_shape_from_formal_for_receiver(
              store: &TypeStore,
              knowledge: &TypeKnowledge,
              receiver: &ValueShape,
          ) -> ValueShape {
              shape_from_knowledge(store, knowledge, Some(receiver), DEFAULT_FORMAL_PROJECTION_DEPTH)
          }

          fn shape_from_knowledge(store: &TypeStore, knowledge: &TypeKnowledge, receiver: Option<&ValueShape>, depth: usize) -> ValueShape {
              match knowledge {
                  TypeKnowledge::Known(evidence) => shape_from_type(store, evidence.ty(), receiver, depth),
                  TypeKnowledge::Unknown(_) | TypeKnowledge::Dynamic(_) => ValueShape::Unknown,
              }
          }

          fn shape_from_type(store: &TypeStore, ty: TypeId, receiver: Option<&ValueShape>, depth: usize) -> ValueShape {
              if depth == 0 {
                  return ValueShape::Unknown;
              }
              match store.get(ty) {
                  TypeData::Never => ValueShape::Never,
                  TypeData::Unit => ValueShape::Unit,
                  TypeData::ClassObject { declaration } => ValueShape::ClassObject(declaration.clone()),
                  TypeData::Nominal { declaration } => ValueShape::Instance(declaration.clone()),
                  TypeData::Applied { origin, .. } => shape_from_type(store, *origin, receiver, depth - 1),
                  TypeData::Union(types) => ValueShape::bounded_union(types.iter().map(|ty| shape_from_type(store, *ty, receiver, depth - 1))),
                  TypeData::Tuple(elements) => ValueShape::Tuple(
                      elements
                          .iter()
                          .map(|element| shape_from_type(store, element.ty, receiver, depth - 1))
                          .collect::<Vec<_>>()
                          .into(),
                  ),
                  TypeData::SelfType(term) => match (term.role, receiver) {
                      (SelfRole::ReceiverValue, Some(receiver)) => receiver.clone(),
                      (SelfRole::InstanceType, Some(receiver)) => self_instance_shape(receiver),
                      (_, None) => ValueShape::Unknown,
                  },
                  TypeData::Record(_) | TypeData::Callable(_) | TypeData::Parameter(_) | TypeData::Lambda(_) => ValueShape::Unknown,
              }
          }

          fn self_instance_shape(receiver: &ValueShape) -> ValueShape {
              match receiver {
                  ValueShape::ClassObject(declaration) | ValueShape::Instance(declaration) => ValueShape::Instance(declaration.clone()),
                  ValueShape::Union(members) => ValueShape::bounded_union(members.iter().map(self_instance_shape)),
                  _ => ValueShape::Unknown,
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, count))

          # Re-export receiver-relative projection.
          replace(
              'phalcom-semantic/src/advisory/mod.rs',
              'pub use formal::{advisory_fact_from_formal, advisory_shape_from_formal};',
              'pub use formal::{advisory_fact_from_formal, advisory_shape_from_formal, advisory_shape_from_formal_for_receiver};',
          )

          analyzer = 'phalcom-semantic/src/advisory/analyzer.rs'
          replace(
              analyzer,
              '''    pub resolve_callable_for_shape: Option<&'a dyn Fn(&ValueShape, &str, &[PackItem]) -> Option<CallableId>>,\n    /// Resolves a member of a compiler-linked module shape.''',
              '''    pub resolve_callable_for_shape: Option<&'a dyn Fn(&ValueShape, &str, &[PackItem]) -> Option<CallableId>>,\n    /// Projects a canonical callable's formal return against an optional\n    /// advisory receiver. Known formal contracts take precedence over summaries.\n    pub resolve_callable_result: Option<&'a dyn Fn(&CallableId, Option<&ValueShape>) -> Option<ValueShape>>,\n    /// Maps the public callable identity to the callable summary used for\n    /// advisory transfer. Constructors map to their generated initializer by\n    /// compiler metadata, never selector spelling.\n    pub advisory_summary_target: Option<&'a dyn Fn(&CallableId) -> CallableId>,\n    /// Resolves a member of a compiler-linked module shape.''',
          )

          old_calls = '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range).map(advisory_callable_id) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, arguments, context);\n    context\n        .callable_returns\n        .get(&callable)\n        .cloned()\n        .map(|fact| fact.derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(callable)))\n        .unwrap_or_else(AdvisoryFact::unknown)\n}\n\nfn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    receiver: &ValueShape,\n    name: &str,\n    args: &[PackItem],\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    if let Some(callable) = (context.resolved_callable_for_range)(range) {\n        let callable = advisory_callable_id(callable);\n        observe_call(callable.clone(), range, arguments, context);\n        return callable_fact(callable, context);\n    }\n    let Some(resolve) = context.resolve_callable_for_shape else {\n        return unknown_at(context, range);\n    };\n    let Some(callable) = resolve(receiver, name, args) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, arguments, context);\n    callable_fact(callable, context)\n}\n\n/// Source occurrence indexing retains constructor declarations on the class\n/// dispatch side, while advisory callable summaries model the generated\n/// instance initializer. Normalize that boundary before querying summaries.\nfn advisory_callable_id(callable: CallableId) -> CallableId {\n    if callable.side == DispatchSide::Class\n        && callable.selector.kind == phalcom_common::selector::SelectorKind::Method\n        && matches!(&callable.selector.base, phalcom_common::selector::SelectorBase::Named(name) if name == "new")\n    {\n        CallableId::new(callable.owner, callable.selector, DispatchSide::Instance)\n    } else {\n        callable\n    }\n}\n\nfn observe_call(target: CallableId, range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) {\n    if let Some(observer) = context.call_observer {\n        observer(AdvisoryCallObservation {\n            target,\n            range,\n            arguments: arguments.to_vec(),\n        });\n    }\n}\n\nfn callable_fact(callable: CallableId, context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    context\n        .callable_returns\n        .get(&callable)\n        .cloned()\n        .map(|fact| fact.derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(callable)))\n        .unwrap_or_else(AdvisoryFact::unknown)\n}\n'''
          new_calls = '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range) else {\n        return unknown_at(context, range);\n    };\n    let summary_target = summary_target_for(&callable, context);\n    observe_call(summary_target.clone(), range, arguments, context);\n    callable_fact(&callable, None, &summary_target, range, context)\n}\n\nfn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    receiver: &ValueShape,\n    name: &str,\n    args: &[PackItem],\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    let callable = if let Some(callable) = (context.resolved_callable_for_range)(range) {\n        callable\n    } else {\n        let Some(resolve) = context.resolve_callable_for_shape else {\n            return unknown_at(context, range);\n        };\n        let Some(callable) = resolve(receiver, name, args) else {\n            return unknown_at(context, range);\n        };\n        callable\n    };\n    let summary_target = summary_target_for(&callable, context);\n    observe_call(summary_target.clone(), range, arguments, context);\n    callable_fact(&callable, Some(receiver), &summary_target, range, context)\n}\n\nfn summary_target_for(callable: &CallableId, context: &AdvisoryExpressionContext<'_>) -> CallableId {\n    context\n        .advisory_summary_target\n        .map(|resolve| resolve(callable))\n        .unwrap_or_else(|| callable.clone())\n}\n\nfn observe_call(target: CallableId, range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) {\n    if let Some(observer) = context.call_observer {\n        observer(AdvisoryCallObservation {\n            target,\n            range,\n            arguments: arguments.to_vec(),\n        });\n    }\n}\n\nfn callable_fact(\n    callable: &CallableId,\n    receiver: Option<&ValueShape>,\n    summary_target: &CallableId,\n    range: SourceRange,\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    if let Some(resolve) = context.resolve_callable_result\n        && let Some(shape) = resolve(callable, receiver)\n        && !matches!(shape, ValueShape::Unknown)\n    {\n        return compiler_shape_fact(context, shape, range);\n    }\n    context\n        .callable_returns\n        .get(summary_target)\n        .cloned()\n        .map(|fact| fact.derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(callable.clone())))\n        .unwrap_or_else(AdvisoryFact::unknown)\n}\n'''
          replace(analyzer, old_calls, new_calls)

          flow = 'phalcom-semantic/src/advisory/flow.rs'
          replace(
              flow,
              '''    pub resolve_callable_for_shape: Option<&'a dyn Fn(&ValueShape, &str, &[phalcom_ast::ast::PackItem]) -> Option<CallableId>>,\n    pub resolve_module_member:''',
              '''    pub resolve_callable_for_shape: Option<&'a dyn Fn(&ValueShape, &str, &[phalcom_ast::ast::PackItem]) -> Option<CallableId>>,\n    pub resolve_callable_result: Option<&'a dyn Fn(&CallableId, Option<&ValueShape>) -> Option<ValueShape>>,\n    pub advisory_summary_target: Option<&'a dyn Fn(&CallableId) -> CallableId>,\n    pub resolve_module_member:''',
          )
          replace(
              flow,
              '''        resolve_callable_for_shape: context.resolve_callable_for_shape,\n        resolve_module_member: context.resolve_module_member,''',
              '''        resolve_callable_for_shape: context.resolve_callable_for_shape,\n        resolve_callable_result: context.resolve_callable_result,\n        advisory_summary_target: context.advisory_summary_target,\n        resolve_module_member: context.resolve_module_member,''',
          )

          session = 'phalcom-semantic/src/session.rs'
          replace(
              session,
              '''    advisory_fact_from_formal, analyze_expr, analyze_statements,\n''',
              '''    advisory_fact_from_formal, advisory_shape_from_formal, advisory_shape_from_formal_for_receiver, analyze_expr, analyze_statements,\n''',
          )

          old_resolver = '''        let resolved = dispatch.resolve_callable_id(hierarchy, owner, side, &selector).or_else(|| {\n            (side == DispatchSide::Class)\n                .then(|| dispatch.resolve_callable_id(hierarchy, owner, DispatchSide::Instance, &selector))\n                .flatten()\n        });\n        resolved.map(|callable| {\n            if callable.side == DispatchSide::Class\n                && callable.selector.kind == phalcom_common::selector::SelectorKind::Method\n                && matches!(&callable.selector.base, phalcom_common::selector::SelectorBase::Named(name) if name == "new")\n            {\n                CallableId::new(callable.owner, callable.selector, DispatchSide::Instance)\n            } else {\n                callable\n            }\n        })\n    };\n'''
          new_resolver = '''        dispatch.resolve_callable_id(hierarchy, owner, side, &selector)\n    };\n    let resolve_callable_result = |callable: &CallableId, receiver: Option<&crate::advisory::ValueShape>| {\n        let signature = dispatch.get_surface(&callable.owner)?.get_callable(callable.side, &callable.selector)?;\n        let shape = receiver.map_or_else(\n            || advisory_shape_from_formal(store, &signature.return_type),\n            |receiver| advisory_shape_from_formal_for_receiver(store, &signature.return_type, receiver),\n        );\n        (!matches!(shape, crate::advisory::ValueShape::Unknown)).then_some(shape)\n    };\n    let advisory_summary_target = |callable: &CallableId| {\n        let is_constructor = dispatch\n            .get_surface(&callable.owner)\n            .and_then(|surface| surface.get_callable(callable.side, &callable.selector))\n            .is_some_and(|signature| matches!(signature.kind, crate::dispatch::CallableSemanticKind::Constructor));\n        if is_constructor && callable.side == DispatchSide::Class {\n            CallableId::new(callable.owner.clone(), callable.selector.clone(), DispatchSide::Instance)\n        } else {\n            callable.clone()\n        }\n    };\n'''
          replace(session, old_resolver, new_resolver)

          replace(
              session,
              '''        formal_returns.insert(analysis.callable.clone(), advisory_return_fact(store, analysis));\n''',
              '''        formal_returns.insert(analysis.callable.clone(), advisory_return_fact(store, dispatch, analysis));\n''',
          )

          # Pass canonical callable-result/summary adapters through field and flow contexts.
          replace(
              session,
              '''                Some(&resolve_callable_for_shape),\n                Some(&resolve_module_member),\n                Some(&resolve_method_family),\n''',
              '''                Some(&resolve_callable_for_shape),\n                Some(&resolve_callable_result),\n                Some(&advisory_summary_target),\n                Some(&resolve_module_member),\n                Some(&resolve_method_family),\n''',
          )
          replace(
              session,
              '''                    resolve_callable_for_shape: Some(&resolve_callable_for_shape),\n                    resolve_module_member: Some(&resolve_module_member),''',
              '''                    resolve_callable_for_shape: Some(&resolve_callable_for_shape),\n                    resolve_callable_result: Some(&resolve_callable_result),\n                    advisory_summary_target: Some(&advisory_summary_target),\n                    resolve_module_member: Some(&resolve_module_member),''',
          )
          replace(
              session,
              '''                resolve_callable_for_shape: Some(&resolve_callable_for_shape),\n                resolve_module_member: Some(&resolve_module_member),''',
              '''                resolve_callable_for_shape: Some(&resolve_callable_for_shape),\n                resolve_callable_result: Some(&resolve_callable_result),\n                advisory_summary_target: Some(&advisory_summary_target),\n                resolve_module_member: Some(&resolve_module_member),''',
          )

          # Extend field-default analysis plumbing.
          replace(
              session,
              '''    resolve_callable_for_shape: Option<&dyn Fn(&crate::advisory::ValueShape, &str, &[PackItem]) -> Option<CallableId>>,\n    resolve_module_member:''',
              '''    resolve_callable_for_shape: Option<&dyn Fn(&crate::advisory::ValueShape, &str, &[PackItem]) -> Option<CallableId>>,\n    resolve_callable_result: Option<&dyn Fn(&CallableId, Option<&crate::advisory::ValueShape>) -> Option<crate::advisory::ValueShape>>,\n    advisory_summary_target: Option<&dyn Fn(&CallableId) -> CallableId>,\n    resolve_module_member:''',
          )
          replace(
              session,
              '''                    resolve_callable_for_shape,\n                    resolve_module_member,''',
              '''                    resolve_callable_for_shape,\n                    resolve_callable_result,\n                    advisory_summary_target,\n                    resolve_module_member,''',
          )

          old_return = '''fn advisory_return_fact(store: &TypeStore, analysis: &crate::checker::CallableAnalysis) -> AdvisoryFact {\n    if analysis.callable.selector.kind == phalcom_common::selector::SelectorKind::Method\n        && matches!(&analysis.callable.selector.base, phalcom_common::selector::SelectorBase::Named(name) if name == "new")\n    {\n        return AdvisoryFact::new(\n            crate::advisory::ValueShape::Instance(analysis.callable.owner.clone()),\n            AdvisoryConfidence::Interprocedural,\n        )\n        .derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(analysis.callable.clone()));\n    }\n'''
          new_return = '''fn advisory_return_fact(\n    store: &TypeStore,\n    dispatch: &SurfaceDispatchResolver,\n    analysis: &crate::checker::CallableAnalysis,\n) -> AdvisoryFact {\n    let public_factory = CallableId::new(analysis.callable.owner.clone(), analysis.callable.selector.clone(), DispatchSide::Class);\n    let is_constructor_initializer = analysis.callable.side == DispatchSide::Instance\n        && dispatch\n            .get_surface(&public_factory.owner)\n            .and_then(|surface| surface.get_callable(DispatchSide::Class, &public_factory.selector))\n            .is_some_and(|signature| matches!(signature.kind, crate::dispatch::CallableSemanticKind::Constructor));\n    if is_constructor_initializer {\n        return AdvisoryFact::new(\n            crate::advisory::ValueShape::Instance(analysis.callable.owner.clone()),\n            AdvisoryConfidence::Interprocedural,\n        )\n        .derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(public_factory));\n    }\n'''
          replace(session, old_return, new_return)

          # Constructor body mapping must recognize decorator form as well as normalized AST flag.
          replace(
              session,
              '''            let side = if method.is_constructor {\n                DispatchSide::Instance\n            } else {''',
              '''            let is_constructor = method.is_constructor || method.attributes.iter().any(|attribute| attribute.name == "constructor");\n            let side = if is_constructor {\n                DispatchSide::Instance\n            } else {''',
          )

          tests = 'phalcom-semantic/tests/semantic/integration/advisory_analyzer.rs'
          replace(
              tests,
              '''        resolve_callable_for_shape: None,\n        resolve_module_member: None,''',
              '''        resolve_callable_for_shape: None,\n        resolve_callable_result: None,\n        advisory_summary_target: None,\n        resolve_module_member: None,''',
              count=-1,
          )

          # Any remaining test/source literal contexts that use None should receive the new optional adapters.
          for path in Path('phalcom-semantic').rglob('*.rs'):
              text = path.read_text()
              old = 'resolve_callable_for_shape: None,\n'
              if old in text and 'resolve_callable_result:' not in text[text.find(old):text.find(old)+180]:
                  text = text.replace(old, old + '        resolve_callable_result: None,\n        advisory_summary_target: None,\n')
                  path.write_text(text)
          PY

          cargo +stable fmt --all
          git diff --check

      - name: Check semantic and LSP libraries
        run: |
          cargo check -p phalcom-semantic --lib
          cargo check -p phalcom-lsp --lib

      - name: Constructor and advisory snapshot regressions
        run: cargo test -p phalcom-semantic --test semantic constructor_factory_probe -- --nocapture

      - name: Advisory analyzer regressions
        run: cargo test -p phalcom-semantic --test semantic advisory_analyzer -- --nocapture

      - name: Editor query regressions
        run: cargo test -p phalcom-semantic --test semantic editor -- --nocapture

      - name: LSP default constructor inlay
        run: cargo test -p phalcom-lsp --test integration inlay_hints::stable_runtime_shapes_are_exposed_as_inlay_hints -- --nocapture

      - name: LSP explicit constructor factory composition
        run: cargo test -p phalcom-lsp --test integration composition1::constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture

      - name: Commit validated semantic repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            phalcom-semantic/src/core_surface/bootstrap.rs \
            phalcom-semantic/src/core_surface/mod.rs \
            phalcom-semantic/src/dispatch.rs \
            phalcom-semantic/src/editor.rs \
            phalcom-semantic/src/session.rs \
            phalcom-semantic/src/advisory/formal.rs \
            phalcom-semantic/src/advisory/mod.rs \
            phalcom-semantic/src/advisory/analyzer.rs \
            phalcom-semantic/src/advisory/flow.rs \
            phalcom-semantic/tests/semantic/integration/advisory_analyzer.rs
          git commit -m 'fix(semantic): project canonical callable returns into advisory facts'
          git pull --rebase origin codex/lsp-single-world-retirement
          git push origin HEAD:codex/lsp-single-world-retirement
