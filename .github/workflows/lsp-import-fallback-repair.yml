name: LSP import fallback repair

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical definition-site repair
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path("phalcom-semantic/src/editor.rs")
          text = editor.read_text()
          start_marker = "    fn sites_for_target(&self, target: &SemanticTargetId, definitions: bool) -> Vec<SourceSiteId> {\n"
          end_marker = "    /// Returns lexical access context from the canonical source owner.\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("missing editor definition-site classification anchors")
          replacement = '''    fn sites_for_target(&self, target: &SemanticTargetId, definitions: bool) -> Vec<SourceSiteId> {
              let mut sites = self
                  .snapshot
                  .occurrences_for_target(target)
                  .into_iter()
                  .flatten()
                  .filter(|site| self.is_definition_site(target, site) == definitions)
                  .cloned()
                  .collect::<Vec<_>>();
              sites.sort();
              sites.dedup();
              sites
          }

          fn is_definition_site(&self, target: &SemanticTargetId, site: &SourceSiteId) -> bool {
              let Some(module) = self.snapshot.source_index.module_for_site(site) else {
                  return false;
              };
              let Some(source_site) = module.structure.sites.get(site) else {
                  return false;
              };
              match (target, &source_site.kind) {
                  (SemanticTargetId::Binding(expected), crate::source_index::SourceSiteKind::BindingDeclaration) => expected == site,
                  (SemanticTargetId::Declaration(expected), crate::source_index::SourceSiteKind::Declaration(actual)) => expected == actual,
                  (SemanticTargetId::Callable(expected), crate::source_index::SourceSiteKind::Callable(actual)) => expected == actual,
                  (SemanticTargetId::Field(expected), crate::source_index::SourceSiteKind::Field(actual)) => expected == actual,
                  (SemanticTargetId::Module(expected), crate::source_index::SourceSiteKind::Module) => {
                      matches!(&site.owner, SourceOwner::Module(actual) if actual == expected)
                  }
                  _ => false,
              }
          }

          '''
          editor.write_text(text[:start] + replacement + text[end:])

          regression = Path("phalcom-semantic/tests/semantic/integration/imported_resolution.rs")
          text = regression.read_text()
          test_name = "editor_definition_sites_exclude_local_import_declaration_for_external_target"
          if test_name not in text:
              text += r'''

          #[test]
          fn editor_definition_sites_exclude_local_import_declaration_for_external_target() {
              let root = tempfile::tempdir().unwrap();
              let main_path = root.path().join("main.ph");
              let shapes_path = root.path().join("shapes.ph");
              let location = |path: &std::path::Path| phalcom_modules::SourceLocation {
                  source_id: phalcom_modules::SourceId(path.to_string_lossy().into()),
                  display_path: path.to_path_buf(),
              };
              let main_text = "from .shapes import Circle\nCircle\n";

              let mut session = phalcom_semantic::SemanticWorkspaceSession::new();
              let publication = session
                  .apply_module_mutations([
                      phalcom_modules::WorkspaceSourceBatchMutation::SetOverlay {
                          source: location(&main_path),
                          text: Arc::from(main_text),
                          revision: phalcom_modules::SourceRevision(1),
                          recovered_program: None,
                      },
                      phalcom_modules::WorkspaceSourceBatchMutation::SetOverlay {
                          source: location(&shapes_path),
                          text: Arc::from("class Circle {}\nexport Circle\n"),
                          revision: phalcom_modules::SourceRevision(1),
                          recovered_program: None,
                      },
                  ])
                  .expect("workspace publication should succeed");

              let queries = publication.snapshot.module_queries();
              let main_module = queries
                  .module_for_display_path(&main_path)
                  .cloned()
                  .expect("main source must map to a canonical module");
              let shapes_module = queries
                  .module_for_display_path(&shapes_path)
                  .cloned()
                  .expect("shapes source must map to a canonical module");
              let circle = SemanticTargetId::Declaration(DeclarationId::new(shapes_module.clone(), "Circle".into()));
              let editor = publication.snapshot.editor();
              let import_offset = main_text.find("Circle").expect("imported Circle token") + 1;

              assert_eq!(editor.target_at(&main_module, import_offset), Some(circle.clone()));

              let definitions = editor.definition_sites(&circle);
              assert_eq!(definitions.len(), 1, "only the exported class declaration is a canonical definition");
              assert!(
                  matches!(&definitions[0].owner, phalcom_semantic::SourceOwner::Module(module) if module == &shapes_module),
                  "the local import declaration must not masquerade as the external class definition"
              );

              let references = editor.reference_sites(&circle);
              assert!(
                  references
                      .iter()
                      .any(|site| matches!(&site.owner, phalcom_semantic::SourceOwner::Module(module) if module == &main_module)),
                  "the import declaration/use must remain references to the external target"
              );
          }
          '''
              regression.write_text(text)

          backend = Path("phalcom-lsp/src/backend.rs")
          text = backend.read_text()
          start_marker = "        if let Some(range) = import_binding_declaration_at_offset(&request, offset) {\n"
          next_marker = "        if let Some(location) = compiler_import_definition_location(&request, position) {\n"
          start = text.find(start_marker)
          if start >= 0:
              end = text.find(next_marker, start)
              if end < 0:
                  raise SystemExit("missing canonical import definition branch after local fallback")
              text = text[:start] + text[end:]
          backend.write_text(text)

          navigation = Path("phalcom-lsp/tests/module_navigation.rs")
          text = navigation.read_text()
          old_assert = '    assert_eq!(locs[0]["uri"].as_str(), Some(main_uri.as_str()));\n'
          count = text.count(old_assert)
          if count not in (0, 2):
              raise SystemExit(f"expected zero or two stale imported Circle assertions, found {count}")
          if count == 2:
              text = text.replace(old_assert, '    assert_eq!(locs[0]["uri"].as_str(), Some(shapes_uri.as_str()));\n')
          navigation.write_text(text)
          PY
      - name: Format and run focused regressions
        run: |
          cargo +stable fmt --all
          git diff --check
          cargo test -p phalcom-semantic --test semantic imported_resolution -- --nocapture
          cargo test -p phalcom-lsp --test imported_binding_resolution -- --nocapture
          cargo test -p phalcom-lsp --test module_navigation goto_definition_on_relative_import_path_and_selective_export -- --nocapture
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            phalcom-semantic/src/editor.rs \
            phalcom-semantic/tests/semantic/integration/imported_resolution.rs \
            phalcom-lsp/src/backend.rs \
            phalcom-lsp/tests/module_navigation.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(semantic): distinguish import references from definitions'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
