name: LSP import fallback repair

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove local import definition fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path("phalcom-lsp/src/backend.rs")
          text = backend.read_text()
          start_marker = "        if let Some(range) = import_binding_declaration_at_offset(&request, offset) {\n"
          next_marker = "        if let Some(location) = compiler_import_definition_location(&request, position) {\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("missing goto-definition local import fallback start")
          end = text.find(next_marker, start)
          if end < 0:
              raise SystemExit("missing canonical import definition branch after local fallback")
          backend.write_text(text[:start] + text[end:])

          navigation = Path("phalcom-lsp/tests/module_navigation.rs")
          text = navigation.read_text()
          old_assert = '    assert_eq!(locs[0]["uri"].as_str(), Some(main_uri.as_str()));\n'
          count = text.count(old_assert)
          if count != 2:
              raise SystemExit(f"expected exactly two stale imported Circle assertions, found {count}")
          navigation.write_text(text.replace(old_assert, '    assert_eq!(locs[0]["uri"].as_str(), Some(shapes_uri.as_str()));\n'))
          PY
      - name: Format and run focused regressions
        run: |
          cargo +stable fmt --all
          git diff --check
          cargo test -p phalcom-lsp --test imported_binding_resolution -- --nocapture
          cargo test -p phalcom-lsp --test module_navigation goto_definition_on_relative_import_path_and_selective_export -- --nocapture
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-lsp/src/backend.rs phalcom-lsp/tests/module_navigation.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lsp): fail closed until canonical import target is ready'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
