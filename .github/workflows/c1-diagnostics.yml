name: C1 diagnostics

on:
  push:
    branches: [c1-completion-audit]

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: clippy,rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
      - name: Capture Clippy diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: cargo +nightly-2026-07-10 clippy --workspace --all-targets -- -D warnings > c1-clippy.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: c1-clippy-log
          path: c1-clippy.log
      - name: Preserve Clippy status
        if: steps.clippy.outcome == 'failure'
        run: exit 1

  test-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' build --workspace --all-targets
      - name: Capture workspace test diagnostics
        id: tests
        continue-on-error: true
        shell: bash
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test --workspace --all-targets > c1-test.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: c1-test-log
          path: c1-test.log
      - name: Preserve test status
        if: steps.tests.outcome == 'failure'
        run: exit 1
