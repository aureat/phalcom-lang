name: LSP reference fallback retirement

on:
  push:
    branches:
      - codex/lsp-single-world-retirement

permissions:
  contents: write

jobs:
  retire:
    if: "${{ github.event.head_commit.message == 'chore(lsp): fix structural reference fallback retirement' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove syntax-owned reference fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('phalcom-lsp/src/backend.rs')
          source = path.read_text()

          helper_start = source.index('fn import_binding_declaration_at_offset(')
          helper_end = source.index('fn compiler_import_definition_location(', helper_start)
          source = source[:helper_start] + source[helper_end:]

          fallback_start = source.index('        if let Some(range) = import_binding_declaration_at_offset(&request, offset) {')
          fallback_end = source.index('        Ok(None)', fallback_start)
          source = source[:fallback_start] + source[fallback_end:]

          if 'import_binding_declaration_at_offset' in source:
              raise SystemExit('fallback symbol still present after structural edit')

          path.write_text(source)
          PY
      - name: Focused verification
        run: |
          cargo +stable fmt --all -- --check
          cargo test -p phalcom-lsp --test imported_binding_resolution -- --nocapture
          cargo test -p phalcom-lsp --test semantic_boundary -- --nocapture
      - name: Commit validated retirement
        run: |
          rm .github/workflows/lsp-reference-fallback-retirement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-lsp/src/backend.rs .github/workflows/lsp-reference-fallback-retirement.yml
          git commit -m 'refactor(lsp): remove syntax-owned reference fallback'
          git push origin HEAD:codex/lsp-single-world-retirement
