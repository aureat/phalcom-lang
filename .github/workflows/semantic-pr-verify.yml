name: Semantic PR Verify

on:
  push:
    branches:
      - fix/semantic-plan1-corrections

jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run canonical semantic integration target
        run: cargo test -p phalcom-semantic --test semantic
