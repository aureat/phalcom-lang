name: LSP retirement debug

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lsp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply class-object root and advisory target probe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          dispatch = 'phalcom-semantic/src/dispatch.rs'
          replace(dispatch,
              '''pub struct SurfaceDispatchResolver {\n    surfaces: HashMap<DeclarationId, DeclarationSurface>,\n    type_declarations: HashMap<TypeId, DeclarationId>,\n}\n''',
              '''pub struct SurfaceDispatchResolver {\n    surfaces: HashMap<DeclarationId, DeclarationSurface>,\n    type_declarations: HashMap<TypeId, DeclarationId>,\n    class_object_behavior_root: Option<DeclarationId>,\n}\n''')
          replace(dispatch,
              '''    pub fn register_type(&mut self, ty: TypeId, decl: DeclarationId) {\n        self.type_declarations.insert(ty, decl);\n    }\n\n    pub fn get_surface(&self, decl: &DeclarationId) -> Option<&DeclarationSurface> {\n''',
              '''    pub fn register_type(&mut self, ty: TypeId, decl: DeclarationId) {\n        self.type_declarations.insert(ty, decl);\n    }\n\n    /// Sets the canonical behavior root used after a class-side hierarchy is exhausted.\n    /// This mirrors the runtime parallel metaclass tower without introducing semantic metaclass objects.\n    pub fn set_class_object_behavior_root(&mut self, decl: DeclarationId) {\n        self.class_object_behavior_root = Some(decl);\n    }\n\n    pub fn get_surface(&self, decl: &DeclarationId) -> Option<&DeclarationSurface> {\n''')
          replace(dispatch,
              '''        while let Some(decl) = curr {\n            visited.push(decl.clone());\n            if let Some(surface) = self.surfaces.get(decl) {\n                if let Some(sig) = surface.get_callable(side, selector) {\n                    let callable_id = surface\n                        .get_callable_id(side, selector)\n                        .cloned()\n                        .unwrap_or_else(|| CallableId::new(decl.clone(), selector.clone(), side));\n                    return ResolvedDispatchResult::Found(ResolvedDispatch {\n                        callable: callable_id,\n                        signature: sig.clone(),\n                        visited_owners: visited.into_boxed_slice(),\n                    });\n                }\n            }\n            curr = hierarchy.superclass(decl);\n        }\n        ResolvedDispatchResult::Missing {\n            visited_owners: visited.into_boxed_slice(),\n        }\n''',
              '''        while let Some(decl) = curr {\n            visited.push(decl.clone());\n            if let Some(surface) = self.surfaces.get(decl) {\n                if let Some(sig) = surface.get_callable(side, selector) {\n                    let callable_id = surface\n                        .get_callable_id(side, selector)\n                        .cloned()\n                        .unwrap_or_else(|| CallableId::new(decl.clone(), selector.clone(), side));\n                    return ResolvedDispatchResult::Found(ResolvedDispatch {\n                        callable: callable_id,\n                        signature: sig.clone(),\n                        visited_owners: visited.into_boxed_slice(),\n                    });\n                }\n            }\n            curr = hierarchy.superclass(decl);\n        }\n        if side == DispatchSide::Class\n            && let Some(root) = self.class_object_behavior_root.as_ref()\n        {\n            let mut curr = Some(root);\n            while let Some(decl) = curr {\n                if !visited.contains(decl) {\n                    visited.push(decl.clone());\n                }\n                if let Some(surface) = self.surfaces.get(decl)\n                    && let Some(sig) = surface.get_callable(DispatchSide::Instance, selector)\n                {\n                    let callable_id = surface\n                        .get_callable_id(DispatchSide::Instance, selector)\n                        .cloned()\n                        .unwrap_or_else(|| CallableId::new(decl.clone(), selector.clone(), DispatchSide::Instance));\n                    return ResolvedDispatchResult::Found(ResolvedDispatch {\n                        callable: callable_id,\n                        signature: sig.clone(),\n                        visited_owners: visited.into_boxed_slice(),\n                    });\n                }\n                curr = hierarchy.superclass(decl);\n            }\n        }\n        ResolvedDispatchResult::Missing {\n            visited_owners: visited.into_boxed_slice(),\n        }\n''')
          replace(dispatch,
              '''        while let Some(decl) = curr {\n            if let Some(surface) = self.surfaces.get(decl) {\n                if let Some(id) = surface.get_callable_id(side, selector) {\n                    return Some(id.clone());\n                }\n            }\n            curr = hierarchy.superclass(decl);\n        }\n        None\n''',
              '''        while let Some(decl) = curr {\n            if let Some(surface) = self.surfaces.get(decl) {\n                if let Some(id) = surface.get_callable_id(side, selector) {\n                    return Some(id.clone());\n                }\n            }\n            curr = hierarchy.superclass(decl);\n        }\n        if side == DispatchSide::Class\n            && let Some(root) = self.class_object_behavior_root.as_ref()\n        {\n            let mut curr = Some(root);\n            while let Some(decl) = curr {\n                if let Some(surface) = self.surfaces.get(decl)\n                    && let Some(id) = surface.get_callable_id(DispatchSide::Instance, selector)\n                {\n                    return Some(id.clone());\n                }\n                curr = hierarchy.superclass(decl);\n            }\n        }\n        None\n''')

          session = 'phalcom-semantic/src/session.rs'
          replace(session,
              '''use crate::dispatch::SurfaceDispatchResolver;\n''',
              '''use crate::dispatch::{CallableSignature, SurfaceDispatchResolver};\n''')
          replace(session,
              '''use crate::types::evidence::TypeKnowledge;\n''',
              '''use crate::types::evidence::{EvidenceOrigin, TypeKnowledge};\n''')
          replace(session,
              '''use crate::types::parameter::TypeParameterOwner;\n''',
              '''use crate::types::parameter::{SelfRole, SelfTypeTerm, TypeParameterOwner};\n''')
          replace(session,
              '''        crate::checker::context::ensure_core_object_type_tests(&mut store, &base_declarations, &mut base_dispatch);\n\n        let mut base_callable_signatures = CallableSignatureTable::new();\n''',
              '''        crate::checker::context::ensure_core_object_type_tests(&mut store, &base_declarations, &mut base_dispatch);\n\n        // Class-object sends first search the declaration's parallel class-side\n        // hierarchy, then continue through the canonical Class/Behavior root.\n        // Bootstrap the source-defined Class >> new() contract here because\n        // canonical core source is presentation-only today while semantic core\n        // products are owned by this session.\n        let class_decl = DeclarationId::new(ModuleId::core(), "Class".into());\n        base_dispatch.set_class_object_behavior_root(class_decl.clone());\n        let default_new_selector = Selector::method("new", Vec::new()).expect("canonical default new selector");\n        let default_new_self = SelfTypeTerm {\n            owner: class_decl.clone(),\n            side: DispatchSide::Instance,\n            role: SelfRole::InstanceType,\n        };\n        let default_new_type = store.self_type(default_new_self);\n        let default_new_signature = CallableSignature::new(\n            default_new_selector,\n            Vec::new(),\n            TypeKnowledge::established(default_new_type, EvidenceOrigin::DeclarationSemantics),\n        );\n        base_dispatch\n            .get_surface_mut(&class_decl)\n            .expect("canonical Class native surface must exist")\n            .add_callable(DispatchSide::Instance, default_new_signature);\n\n        let mut base_callable_signatures = CallableSignatureTable::new();\n''')

          analyzer = 'phalcom-semantic/src/advisory/analyzer.rs'
          replace(analyzer,
              '''    /// Exact call expression range.\n    pub range: SourceRange,\n    /// Arguments evaluated in source order.\n''',
              '''    /// Exact call expression range.\n    pub range: SourceRange,\n    /// Selector/name token range used to publish an editor-visible target.\n    pub target_range: Option<SourceRange>,\n    /// Arguments evaluated in source order.\n''')
          replace(analyzer,
              '''            resolved_call_or_unknown_with_shape(call.range, &receiver.shape, &call.method, &call.args, &arguments, context)\n''',
              '''            resolved_call_or_unknown_with_shape(call.range, call.method_range, &receiver.shape, &call.method, &call.args, &arguments, context)\n''')
          replace(analyzer,
              '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range).map(advisory_callable_id) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, arguments, context);\n    context\n        .callable_returns\n        .get(&callable)\n        .cloned()\n        .map(|fact| fact.derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(callable)))\n        .unwrap_or_else(AdvisoryFact::unknown)\n}\n''',
              '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, None, arguments, context);\n    callable_result_fact(&callable, range, context)\n}\n''')
          replace(analyzer,
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    receiver: &ValueShape,\n    name: &str,\n    args: &[PackItem],\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    if let Some(callable) = (context.resolved_callable_for_range)(range) {\n        let callable = advisory_callable_id(callable);\n        observe_call(callable.clone(), range, arguments, context);\n        return callable_fact(callable, context);\n    }\n    let Some(resolve) = context.resolve_callable_for_shape else {\n        return unknown_at(context, range);\n    };\n    let Some(callable) = resolve(receiver, name, args) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, arguments, context);\n    callable_fact(callable, context)\n}\n''',
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    receiver: &ValueShape,\n    name: &str,\n    args: &[PackItem],\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    if let Some(callable) = (context.resolved_callable_for_range)(range) {\n        observe_call(callable.clone(), range, target_range, arguments, context);\n        if is_default_class_new(&callable)\n            && let ValueShape::ClassObject(owner) = receiver\n        {\n            return compiler_shape_fact(context, ValueShape::Instance(owner.clone()), range);\n        }\n        return callable_result_fact(&callable, range, context);\n    }\n    let Some(resolve) = context.resolve_callable_for_shape else {\n        return unknown_at(context, range);\n    };\n    let Some(callable) = resolve(receiver, name, args) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, target_range, arguments, context);\n    if is_default_class_new(&callable)\n        && let ValueShape::ClassObject(owner) = receiver\n    {\n        return compiler_shape_fact(context, ValueShape::Instance(owner.clone()), range);\n    }\n    callable_result_fact(&callable, range, context)\n}\n''')
          replace(analyzer,
              '''fn observe_call(target: CallableId, range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) {\n    if let Some(observer) = context.call_observer {\n        observer(AdvisoryCallObservation {\n            target,\n            range,\n            arguments: arguments.to_vec(),\n        });\n    }\n}\n\nfn callable_fact(callable: CallableId, context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n''',
              '''fn observe_call(\n    target: CallableId,\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) {\n    if let Some(observer) = context.call_observer {\n        observer(AdvisoryCallObservation {\n            target,\n            range,\n            target_range,\n            arguments: arguments.to_vec(),\n        });\n    }\n}\n\nfn callable_result_fact(callable: &CallableId, range: SourceRange, context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    if callable.side == DispatchSide::Class\n        && callable.selector.kind == phalcom_common::selector::SelectorKind::Method\n        && matches!(&callable.selector.base, phalcom_common::selector::SelectorBase::Named(name) if name == "new")\n    {\n        return compiler_shape_fact(context, ValueShape::Instance(callable.owner.clone()), range);\n    }\n    callable_fact(advisory_callable_id(callable.clone()), context)\n}\n\nfn is_default_class_new(callable: &CallableId) -> bool {\n    callable.owner.module == crate::identity::ModuleId::core()\n        && callable.owner.name.as_ref() == "Class"\n        && callable.side == DispatchSide::Instance\n        && callable.selector.kind == phalcom_common::selector::SelectorKind::Method\n        && callable.selector.slots.is_empty()\n        && matches!(&callable.selector.base, phalcom_common::selector::SelectorBase::Named(name) if name == "new")\n}\n\nfn callable_fact(callable: CallableId, context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n''')

          flow = 'phalcom-semantic/src/advisory/flow.rs'
          replace(flow,
              '''    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,\n''',
              '''    /// Canonical source call targets resolved from advisory receiver evidence, keyed by selector token range.\n    pub call_targets: Vec<(SourceRange, CallableId)>,\n    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,\n''')
          replace(flow,
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    let mut positional = 0;\n''',
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    if let Some(range) = call.target_range {\n        product.call_targets.push((range, call.target.clone()));\n    }\n    let mut positional = 0;\n''')

          # Preserve source/editor target identity while the existing advisory\n          # transfer path still normalizes explicit new constructors internally.
          callable_merge = '''                for (range, callable) in &flow.call_targets {\n                    let Some(occurrence) = module_index.occurrences.occurrence_at(range.start) else { continue };\n                    if occurrence.occurrence.range != *range || occurrence.occurrence.role != crate::source_index::OccurrenceRole::Call {\n                        continue;\n                    }\n                    let site = occurrence.occurrence.site.clone();\n                    targets.entry(site.clone()).or_insert_with(|| AdvisoryTargetResolution {\n                        target: SemanticTargetId::Callable(callable.clone()),\n                        confidence: AdvisoryConfidence::Interprocedural,\n                        provenance: vec![AdvisoryOrigin::CallSite(site)],\n                    });\n                }\n'''
          replace(session,
              '''                let flow = analyze_statements(body, &context, seed_bindings);\n                for (field, fact) in &flow.field_writes {\n''',
              '''                let flow = analyze_statements(body, &context, seed_bindings);\n''' + callable_merge + '''                for (field, fact) in &flow.field_writes {\n''')
          top_merge = '''            for (range, callable) in &top_level.call_targets {\n                let Some(occurrence) = module_index.occurrences.occurrence_at(range.start) else { continue };\n                if occurrence.occurrence.range != *range || occurrence.occurrence.role != crate::source_index::OccurrenceRole::Call {\n                    continue;\n                }\n                let site = occurrence.occurrence.site.clone();\n                targets.entry(site.clone()).or_insert_with(|| AdvisoryTargetResolution {\n                    target: SemanticTargetId::Callable(callable.clone()),\n                    confidence: AdvisoryConfidence::Interprocedural,\n                    provenance: vec![AdvisoryOrigin::CallSite(site)],\n                });\n            }\n'''
          replace(session,
              '''            let top_level = analyze_statements(&source.program.statements, &top_level_context, BTreeMap::new());\n            parameter_contributions.replace_source(\n''',
              '''            let top_level = analyze_statements(&source.program.statements, &top_level_context, BTreeMap::new());\n''' + top_merge + '''            parameter_contributions.replace_source(\n''')
          PY
          cargo +stable fmt --all
          git diff --check
      - name: Check semantic and LSP libraries
        run: |
          cargo check -p phalcom-semantic --lib
          cargo check -p phalcom-lsp --lib
      - name: Constructor-less class inherits Class.new
        run: cargo test -p phalcom-lsp --test integration inlay_hints::stable_runtime_shapes_are_exposed_as_inlay_hints -- --nocapture
      - name: Explicit constructor factory composition
        run: cargo test -p phalcom-lsp --test integration composition1::constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture
      - name: Inherited target keeps defining owner
        run: cargo test -p phalcom-lsp --test integration workspace_semantics::inherited_hover_reports_the_defining_owner_not_the_receiver_class -- --nocapture
      - name: Cross-file receiver hover
        run: cargo test -p phalcom-lsp --test integration stage4_hover::cross_file_hover_resolves_the_doc_from_the_declaring_file -- --nocapture
      - name: Cross-file receiver definition
        run: cargo test -p phalcom-lsp --test integration stage2_index::goto_definition_and_workspace_symbol_resolve_across_files -- --nocapture
