name: LSP retirement debug

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lsp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply constructor and advisory target repair
        run: |
          if grep -q 'pub target_range: Option<SourceRange>' phalcom-semantic/src/advisory/analyzer.rs; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          analyzer = 'phalcom-semantic/src/advisory/analyzer.rs'
          replace(analyzer,
              '''    /// Exact call expression range.\n    pub range: SourceRange,\n    /// Arguments evaluated in source order.\n''',
              '''    /// Exact call expression range.\n    pub range: SourceRange,\n    /// Selector/name token range used to publish an editor-visible target.\n    pub target_range: Option<SourceRange>,\n    /// Arguments evaluated in source order.\n''')
          replace(analyzer,
              '''            resolved_call_or_unknown_with_shape(call.range, &receiver.shape, &call.method, &call.args, &arguments, context)\n''',
              '''            resolved_call_or_unknown_with_shape(call.range, call.method_range, &receiver.shape, &call.method, &call.args, &arguments, context)\n''')
          replace(analyzer,
              '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range).map(advisory_callable_id) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, arguments, context);\n    context\n        .callable_returns\n        .get(&callable)\n        .cloned()\n        .map(|fact| fact.derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(callable)))\n        .unwrap_or_else(AdvisoryFact::unknown)\n}\n''',
              '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, None, arguments, context);\n    callable_result_fact(&callable, range, context)\n}\n''')
          replace(analyzer,
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    receiver: &ValueShape,\n    name: &str,\n    args: &[PackItem],\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    if let Some(callable) = (context.resolved_callable_for_range)(range) {\n        let callable = advisory_callable_id(callable);\n        observe_call(callable.clone(), range, arguments, context);\n        return callable_fact(callable, context);\n    }\n    let Some(resolve) = context.resolve_callable_for_shape else {\n        return unknown_at(context, range);\n    };\n    let Some(callable) = resolve(receiver, name, args) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, arguments, context);\n    callable_fact(callable, context)\n}\n''',
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    receiver: &ValueShape,\n    name: &str,\n    args: &[PackItem],\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    if let Some(callable) = (context.resolved_callable_for_range)(range) {\n        observe_call(callable.clone(), range, target_range, arguments, context);\n        return callable_result_fact(&callable, range, context);\n    }\n    let Some(resolve) = context.resolve_callable_for_shape else {\n        return unknown_at(context, range);\n    };\n    let Some(callable) = resolve(receiver, name, args) else {\n        return unknown_at(context, range);\n    };\n    observe_call(callable.clone(), range, target_range, arguments, context);\n    callable_result_fact(&callable, range, context)\n}\n''')
          replace(analyzer,
              '''/// Source occurrence indexing retains constructor declarations on the class\n/// dispatch side, while advisory callable summaries model the generated\n/// instance initializer. Normalize that boundary before querying summaries.\nfn advisory_callable_id(callable: CallableId) -> CallableId {\n''',
              '''/// Source occurrence indexing retains constructor declarations on the class\n/// dispatch side, while advisory callable summaries model the generated\n/// instance initializer. Normalize only the summary/transfer identity; editor\n/// targets retain the source callable identity.\npub(super) fn advisory_summary_callable_id(callable: CallableId) -> CallableId {\n''')
          replace(analyzer,
              '''fn observe_call(target: CallableId, range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) {\n    if let Some(observer) = context.call_observer {\n        observer(AdvisoryCallObservation {\n            target,\n            range,\n            arguments: arguments.to_vec(),\n        });\n    }\n}\n\nfn callable_fact(callable: CallableId, context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n''',
              '''fn observe_call(\n    target: CallableId,\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) {\n    if let Some(observer) = context.call_observer {\n        observer(AdvisoryCallObservation {\n            target,\n            range,\n            target_range,\n            arguments: arguments.to_vec(),\n        });\n    }\n}\n\nfn callable_result_fact(callable: &CallableId, range: SourceRange, context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    if callable.side == DispatchSide::Class\n        && callable.selector.kind == phalcom_common::selector::SelectorKind::Method\n        && matches!(&callable.selector.base, phalcom_common::selector::SelectorBase::Named(name) if name == "new")\n    {\n        return compiler_shape_fact(context, ValueShape::Instance(callable.owner.clone()), range);\n    }\n    callable_fact(advisory_summary_callable_id(callable.clone()), context)\n}\n\nfn callable_fact(callable: CallableId, context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n''')

          flow = 'phalcom-semantic/src/advisory/flow.rs'
          replace(flow,
              '''use super::analyzer::{AdvisoryBuiltins, AdvisoryCallObservation, AdvisoryExpressionContext, analyze_expr};\n''',
              '''use super::analyzer::{AdvisoryBuiltins, AdvisoryCallObservation, AdvisoryExpressionContext, advisory_summary_callable_id, analyze_expr};\n''')
          replace(flow,
              '''    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,\n''',
              '''    /// Canonical source call targets resolved from advisory receiver evidence, keyed by selector token range.\n    pub call_targets: Vec<(SourceRange, CallableId)>,\n    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,\n''')
          replace(flow,
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    let mut positional = 0;\n    for argument in call.arguments {\n        let index = if let Some(label) = argument.label.as_deref() {\n            call.target\n                .selector\n                .slots\n                .iter()\n                .position(|slot| matches!(slot, SelectorSlot::Label(candidate) if candidate == label))\n        } else {\n            let index = call\n                .target\n                .selector\n                .slots\n                .iter()\n                .enumerate()\n                .filter(|(_, slot)| matches!(slot, SelectorSlot::Positional))\n                .nth(positional)\n                .map(|(index, _)| index);\n            positional += 1;\n            index\n        };\n        let Some(index) = index else { continue };\n        if matches!(argument.fact.shape, ValueShape::Unknown) {\n            continue;\n        }\n        let fact = if let Some(site) = (context.source_site_for_range)(call.range) {\n            argument.fact.derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::CallSite(site))\n        } else {\n            argument\n                .fact\n                .derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(call.target.clone()))\n        };\n        let slot = AdvisoryParameterSlot::new(call.target.clone(), index as u32);\n        product\n            .parameter_contributions\n            .entry(slot)\n            .and_modify(|old| *old = old.join(&fact))\n            .or_insert(fact);\n    }\n}\n''',
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    if let Some(range) = call.target_range {\n        product.call_targets.push((range, call.target.clone()));\n    }\n    let transfer_target = advisory_summary_callable_id(call.target.clone());\n    let mut positional = 0;\n    for argument in call.arguments {\n        let index = if let Some(label) = argument.label.as_deref() {\n            transfer_target\n                .selector\n                .slots\n                .iter()\n                .position(|slot| matches!(slot, SelectorSlot::Label(candidate) if candidate == label))\n        } else {\n            let index = transfer_target\n                .selector\n                .slots\n                .iter()\n                .enumerate()\n                .filter(|(_, slot)| matches!(slot, SelectorSlot::Positional))\n                .nth(positional)\n                .map(|(index, _)| index);\n            positional += 1;\n            index\n        };\n        let Some(index) = index else { continue };\n        if matches!(argument.fact.shape, ValueShape::Unknown) {\n            continue;\n        }\n        let fact = if let Some(site) = (context.source_site_for_range)(call.range) {\n            argument.fact.derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::CallSite(site))\n        } else {\n            argument\n                .fact\n                .derive(AdvisoryConfidence::Interprocedural, AdvisoryOrigin::Callable(call.target.clone()))\n        };\n        let slot = AdvisoryParameterSlot::new(transfer_target.clone(), index as u32);\n        product\n            .parameter_contributions\n            .entry(slot)\n            .and_modify(|old| *old = old.join(&fact))\n            .or_insert(fact);\n    }\n}\n''')

          session = 'phalcom-semantic/src/session.rs'
          callable_merge = '''                for (range, callable) in &flow.call_targets {\n                    let Some(occurrence) = module_index.occurrences.occurrence_at(range.start) else { continue };\n                    if occurrence.occurrence.range != *range || occurrence.occurrence.role != crate::source_index::OccurrenceRole::Call {\n                        continue;\n                    }\n                    let site = occurrence.occurrence.site.clone();\n                    targets.entry(site.clone()).or_insert_with(|| AdvisoryTargetResolution {\n                        target: SemanticTargetId::Callable(callable.clone()),\n                        confidence: AdvisoryConfidence::Interprocedural,\n                        provenance: vec![AdvisoryOrigin::CallSite(site)],\n                    });\n                }\n'''
          replace(session,
              '''                let flow = analyze_statements(body, &context, seed_bindings);\n                for (field, fact) in &flow.field_writes {\n''',
              '''                let flow = analyze_statements(body, &context, seed_bindings);\n''' + callable_merge + '''                for (field, fact) in &flow.field_writes {\n''')
          top_merge = '''            for (range, callable) in &top_level.call_targets {\n                let Some(occurrence) = module_index.occurrences.occurrence_at(range.start) else { continue };\n                if occurrence.occurrence.range != *range || occurrence.occurrence.role != crate::source_index::OccurrenceRole::Call {\n                    continue;\n                }\n                let site = occurrence.occurrence.site.clone();\n                targets.entry(site.clone()).or_insert_with(|| AdvisoryTargetResolution {\n                    target: SemanticTargetId::Callable(callable.clone()),\n                    confidence: AdvisoryConfidence::Interprocedural,\n                    provenance: vec![AdvisoryOrigin::CallSite(site)],\n                });\n            }\n'''
          replace(session,
              '''            let top_level = analyze_statements(&source.program.statements, &top_level_context, BTreeMap::new());\n            parameter_contributions.replace_source(\n''',
              '''            let top_level = analyze_statements(&source.program.statements, &top_level_context, BTreeMap::new());\n''' + top_merge + '''            parameter_contributions.replace_source(\n''')
          PY
          cargo +stable fmt --all
          git diff --check
      - name: Check LSP library
        run: cargo check -p phalcom-lsp --lib
      - name: Constructor result inlay
        run: cargo test -p phalcom-lsp --test integration inlay_hints::stable_runtime_shapes_are_exposed_as_inlay_hints -- --nocapture
      - name: Constructor factory composition
        run: cargo test -p phalcom-lsp --test integration composition1::constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture
      - name: Inherited target keeps defining owner
        run: cargo test -p phalcom-lsp --test integration workspace_semantics::inherited_hover_reports_the_defining_owner_not_the_receiver_class -- --nocapture
      - name: Cross-file receiver hover
        run: cargo test -p phalcom-lsp --test integration stage4_hover::cross_file_hover_resolves_the_doc_from_the_declaring_file -- --nocapture
      - name: Cross-file receiver definition
        run: cargo test -p phalcom-lsp --test integration stage2_index::goto_definition_and_workspace_symbol_resolve_across_files -- --nocapture
      - name: Commit validated semantic repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phalcom-semantic/src/advisory/analyzer.rs phalcom-semantic/src/advisory/flow.rs phalcom-semantic/src/session.rs
          git commit -m 'fix(semantic): separate constructor results from initializer summaries'
          git push origin HEAD:codex/lsp-single-world-retirement
