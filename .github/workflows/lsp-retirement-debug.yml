name: LSP retirement debug

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  apply-semantic-target-patch:
    if: github.event.head_commit.message == 'ci: apply semantic target patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - name: Retain compiler-resolved advisory call targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          analyzer = 'phalcom-semantic/src/advisory/analyzer.rs'
          replace(analyzer,
              '''    /// Exact call expression range.\n    pub range: SourceRange,\n    /// Arguments evaluated in source order.\n''',
              '''    /// Exact call expression range.\n    pub range: SourceRange,\n    /// Selector/name token range used to publish an editor-visible target.\n    pub target_range: Option<SourceRange>,\n    /// Arguments evaluated in source order.\n''')
          replace(analyzer,
              '''            resolved_call_or_unknown_with_shape(call.range, &receiver.shape, &call.method, &call.args, &arguments, context)\n''',
              '''            resolved_call_or_unknown_with_shape(call.range, call.method_range, &receiver.shape, &call.method, &call.args, &arguments, context)\n''')
          replace(analyzer,
              '''    observe_call(callable.clone(), range, arguments, context);\n    context\n''',
              '''    observe_call(callable.clone(), range, None, arguments, context);\n    context\n''')
          replace(analyzer,
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    receiver: &ValueShape,\n''',
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    receiver: &ValueShape,\n''')
          replace(analyzer,
              '''        observe_call(callable.clone(), range, arguments, context);\n        return callable_fact(callable, context);\n''',
              '''        observe_call(callable.clone(), range, target_range, arguments, context);\n        return callable_fact(callable, context);\n''')
          replace(analyzer,
              '''    observe_call(callable.clone(), range, arguments, context);\n    callable_fact(callable, context)\n''',
              '''    observe_call(callable.clone(), range, target_range, arguments, context);\n    callable_fact(callable, context)\n''')
          replace(analyzer,
              '''fn observe_call(target: CallableId, range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) {\n''',
              '''fn observe_call(\n    target: CallableId,\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) {\n''')
          replace(analyzer,
              '''            target,\n            range,\n            arguments: arguments.to_vec(),\n''',
              '''            target,\n            range,\n            target_range,\n            arguments: arguments.to_vec(),\n''')

          flow = 'phalcom-semantic/src/advisory/flow.rs'
          replace(flow,
              '''    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,\n''',
              '''    /// Canonical call targets resolved from advisory receiver evidence, keyed by selector token range.\n    pub call_targets: Vec<(SourceRange, CallableId)>,\n    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,\n''')
          replace(flow,
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    let mut positional = 0;\n''',
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    if let Some(range) = call.target_range {\n        product.call_targets.push((range, call.target.clone()));\n    }\n    let mut positional = 0;\n''')

          session = 'phalcom-semantic/src/session.rs'
          merge = '''                for (range, callable) in &flow.call_targets {\n                    let mut candidates = module_index\n                        .occurrences\n                        .all()\n                        .iter()\n                        .filter(|occurrence| occurrence.range == *range)\n                        .map(|occurrence| occurrence.site.clone());\n                    let Some(site) = candidates.next() else { continue };\n                    if candidates.next().is_some() {\n                        continue;\n                    }\n                    targets.entry(site.clone()).or_insert_with(|| AdvisoryTargetResolution {\n                        target: SemanticTargetId::Callable(callable.clone()),\n                        confidence: AdvisoryConfidence::Interprocedural,\n                        provenance: vec![AdvisoryOrigin::CallSite(site)],\n                    });\n                }\n'''
          replace(session,
              '''                let flow = analyze_statements(body, &context, seed_bindings);\n                for (field, fact) in &flow.field_writes {\n''',
              '''                let flow = analyze_statements(body, &context, seed_bindings);\n''' + merge + '''                for (field, fact) in &flow.field_writes {\n''')
          top_merge = merge.replace('                ', '            ', 1)
          replace(session,
              '''            let top_level = analyze_statements(&source.program.statements, &top_level_context, BTreeMap::new());\n            parameter_contributions.replace_source(\n''',
              '''            let top_level = analyze_statements(&source.program.statements, &top_level_context, BTreeMap::new());\n''' + top_merge.replace('&flow.call_targets', '&top_level.call_targets') + '''            parameter_contributions.replace_source(\n''')
          PY
          cargo fmt --all -- --check || cargo fmt --all
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phalcom-semantic/src/advisory/analyzer.rs phalcom-semantic/src/advisory/flow.rs phalcom-semantic/src/session.rs
          git commit -m 'fix(semantic): publish advisory call targets [auto-patch]'
          git push origin HEAD:codex/lsp-single-world-retirement

  lsp-integration:
    if: github.event.head_commit.message != 'ci: apply semantic target patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check LSP library
        run: cargo check -p phalcom-lsp --lib
      - name: Run LSP integration suite
        run: cargo test -p phalcom-lsp --test integration -- --nocapture
