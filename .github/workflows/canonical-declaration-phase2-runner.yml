name: Canonical Declaration Phase 2 Runner

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  parameter-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add RED regression from staged driver
        shell: python
        run: |
          from pathlib import Path
          text = Path('.github/workflows/canonical-declaration-phase2.yml').read_text()
          section = text.split('      - name: Add parameter identity regression\n', 1)[1].split('      - name: Verify RED\n', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(script, {'__name__': '__main__'})
      - name: Verify RED
        env:
          RUSTFLAGS: ""
        run: |
          set +e
          cargo +stable test -p phalcom-semantic --test semantic semantic::integration::parameter_identity::callable_parameter_identity_connects_signature_binding_and_source_site -- --exact > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "parameter identity regression unexpectedly passed before implementation"
            exit 1
          fi
          grep -Eq 'no field `parameter`|no field `parameter_sites`|unknown field' /tmp/red.log
      - name: Apply implementation from staged driver
        shell: python
        run: |
          from pathlib import Path
          text = Path('.github/workflows/canonical-declaration-phase2.yml').read_text()
          section = text.split('      - name: Implement canonical parameter identity bridge\n', 1)[1].split('      - name: Format implementation\n', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(script, {'__name__': '__main__'})
      - name: Format implementation
        run: cargo +stable fmt --all
      - name: Focused parameter identity regression
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic --test semantic semantic::integration::parameter_identity::callable_parameter_identity_connects_signature_binding_and_source_site -- --exact
      - name: Full semantic gate
        env:
          RUSTFLAGS: ""
        run: |
          cargo +stable fmt --all -- --check
          git diff --check
          cargo +stable check -p phalcom-semantic
          cargo +stable test -p phalcom-semantic
      - name: Commit phase 2
        run: |
          rm -f .github/workflows/canonical-declaration-phase2.yml .github/workflows/canonical-declaration-phase2-runner.yml
          git config user.name "phalcom-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(semantic): connect parameter declaration and source identity"
          git push origin HEAD:codex/canonical-declaration-knowledge
