name: Module lifecycle probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: module-lifecycle-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical import path provenance repair
        run: python .github/apply-module-query-path-provenance.py
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Compile modules and semantic
        run: |
          cargo check -p phalcom-modules
          cargo check -p phalcom-semantic
      - name: Validate module lifecycle and query provenance
        run: |
          cargo test -p phalcom-modules --test standalone_incremental_imports -- --nocapture
          cargo test -p phalcom-semantic --test semantic module_query_probe -- --nocapture
      - name: Commit validated provenance repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-modules/src/session.rs phalcom-semantic/src/session.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(semantic): publish canonical import path provenance'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
