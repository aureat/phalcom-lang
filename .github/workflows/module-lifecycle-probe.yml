name: Module lifecycle probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: module-lifecycle-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply valid module navigation fixture
        run: python .github/fix-module-navigation-fixture.py
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Validate semantic import provenance
        run: cargo test -p phalcom-semantic --test semantic module_query_probe -- --nocapture
      - name: Validate module navigation
        run: cargo test -p phalcom-lsp --test module_navigation goto_definition_on_relative_import_path_and_selective_export -- --nocapture
      - name: Commit valid navigation fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-lsp/tests/module_navigation.rs
          if ! git diff --cached --quiet; then
            git commit -m 'test(lsp): align module navigation fixture with explicit exports'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
