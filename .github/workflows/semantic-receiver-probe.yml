name: Semantic receiver probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: semantic-receiver-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Apply validated constructor and advisory patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def extract(path, marker, output):
              lines = Path(path).read_text().splitlines()
              start = lines.index(f'      - name: {marker}')
              run_line = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('        run: |'))
              end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name:'))
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[run_line + 1:end]) + '\n'
              Path(output).write_text(script)

          extract('.github/workflows/semantic-constructor-probe.yml', 'Apply class-object behavior root repair', '/tmp/apply-root.sh')
          extract('.github/workflows/semantic-advisory-probe.yml', 'Apply formal-to-advisory callable projection', '/tmp/apply-advisory.sh')
          PY
          bash /tmp/apply-root.sh
          bash /tmp/apply-advisory.sh

      - name: RED receiver query must expose masked binding fact
        run: |
          set +e
          cargo test -p phalcom-semantic --test semantic receiver_query_falls_back_to_authoritative_binding_fact -- --nocapture > /tmp/receiver-red.log 2>&1
          status=$?
          set -e
          cat /tmp/receiver-red.log
          if [ "$status" -eq 0 ]; then
            echo "expected receiver regression to fail before the query repair"
            exit 1
          fi
          grep -q "binding receiver must resolve from compiler-owned facts" /tmp/receiver-red.log

      - name: Repair receiver fact precedence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('phalcom-semantic/src/editor.rs')
          text = path.read_text()
          old = '''        let fact_site = expression_site.as_ref().or(target_site).or(occurrence_site.as_ref());
        let shape = constructor_receiver.or_else(|| {
            expression_site
                .as_ref()
                .and_then(|site| self.formal_shape_for_site(site))
                .or_else(|| {
                    fact_site
                        .and_then(|site| self.snapshot.advisory_fact(site))
                        .filter(|fact| !matches!(fact.shape, ValueShape::Unknown))
                        .map(|fact| fact.shape.clone())
                })
                .or_else(|| target_site.and_then(|site| self.formal_shape_for_site(site)))
                .or_else(|| self.formal_shape_at(module, range.start))
                .or_else(|| match target.as_ref() {
                    Some(SemanticTargetId::Module(module)) => Some(ValueShape::Module(module.clone())),
                    Some(SemanticTargetId::Declaration(declaration)) => Some(ValueShape::ClassObject(declaration.clone())),
                    _ => None,
                })
        });
'''
          new = '''        let advisory_shape_for_site = |site: &SourceSiteId| {
            self.snapshot
                .advisory_fact(site)
                .filter(|fact| !matches!(fact.shape, ValueShape::Unknown))
                .map(|fact| fact.shape.clone())
        };
        let shape = constructor_receiver.or_else(|| {
            // Proven facts always outrank advisory evidence. Within each
            // evidence class, prefer the exact receiver expression, then its
            // canonical binding target, then the occurrence site.
            expression_site
                .as_ref()
                .and_then(|site| self.formal_shape_for_site(site))
                .or_else(|| target_site.and_then(|site| self.formal_shape_for_site(site)))
                .or_else(|| self.formal_shape_at(module, range.start))
                .or_else(|| expression_site.as_ref().and_then(advisory_shape_for_site))
                .or_else(|| target_site.and_then(advisory_shape_for_site))
                .or_else(|| occurrence_site.as_ref().and_then(advisory_shape_for_site))
                .or_else(|| match target.as_ref() {
                    Some(SemanticTargetId::Module(module)) => Some(ValueShape::Module(module.clone())),
                    Some(SemanticTargetId::Declaration(declaration)) => Some(ValueShape::ClassObject(declaration.clone())),
                    _ => None,
                })
        });
'''
          if old not in text:
              raise SystemExit('receiver fact precedence patch anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +stable fmt --all
          git diff --check

      - name: GREEN receiver query regression
        run: cargo test -p phalcom-semantic --test semantic receiver_query_falls_back_to_authoritative_binding_fact -- --nocapture

      - name: Constructor semantic regressions
        run: cargo test -p phalcom-semantic --test semantic constructor_factory_probe -- --nocapture

      - name: Editor query regressions
        run: cargo test -p phalcom-semantic --test semantic editor -- --nocapture

      - name: LSP default constructor inlay
        run: cargo test -p phalcom-lsp --test integration inlay_hints::stable_runtime_shapes_are_exposed_as_inlay_hints -- --nocapture

      - name: LSP constructor factory composition
        run: cargo test -p phalcom-lsp --test integration composition1::constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture

      - name: Commit validated semantic repairs
        run: |
          git config user.name "Altun Hasanli"
          git config user.email "hasanlialtun@gmail.com"
          git add phalcom-semantic
          git diff --cached --check
          git commit -m "fix(semantic): preserve canonical receiver evidence"
          git push origin HEAD:codex/lsp-single-world-retirement
