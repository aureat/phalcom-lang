name: Canonical Native GREEN

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - name: Apply canonical-first native import
        run: python3 .github/scripts/canonical_native_apply.py
      - name: Format
        run: cargo +nightly-2026-07-10 fmt --all
      - name: Guard changed production surface
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^phalcom-semantic/src/types/native.rs$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Canonical ownership regression
        run: cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic semantic::incremental::declaration_authority::native_import_builds_canonical_signature_before_dispatch_projection -- --exact
      - name: Full semantic gate
        run: cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic
      - name: Diff integrity
        run: git diff --check
      - name: Commit native authority cut
        run: |
          if git diff --quiet -- phalcom-semantic/src/types/native.rs; then
            echo 'native authority cut already applied'
            exit 0
          fi
          git config user.name phalcom-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add phalcom-semantic/src/types/native.rs
          git commit -m 'refactor(semantic): build native signatures canonically'
          git push origin HEAD:codex/canonical-declaration-knowledge
