name: LSP retirement reference cleanup

on:
  push:
    branches:
      - codex/lsp-single-world-retirement

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'run final semantic retirement reference cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
          fetch-depth: 0
      - name: Replace retired architecture references
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('.agents/skills/phalcom-semantic-model/references/modules-and-incrementality.md')
          source = path.read_text()

          def decoded(value):
              return base64.b64decode(value).decode()

          def replace_section(text, start_heading, next_heading, replacement):
              start = text.index(start_heading)
              end = text.index(next_heading, start)
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          section3 = decoded('')
          section6 = decoded('')

          source = replace_section(source, '## 3. CURRENT Phalcom publication architecture', '## 4. File revision versus semantic generation', section3)
          source = replace_section(source, '## 6. CURRENT module graph', '## 7. Unresolved dependencies are still dependencies', section6)

          if 'phalcom-lsp/src/semantic/snapshot.rs' in source:
              raise SystemExit('retired LSP semantic snapshot reference remains')

          path.write_text(source)
          PY
      - name: Verify documentation boundary
        run: |
          ! grep -R "phalcom-lsp/src/semantic/snapshot.rs" .agents/skills/phalcom-semantic-model/references
          ! grep -R "phalcom-lsp/.*current semantic engine" .agents/skills/phalcom-semantic-model/references
      - name: Commit cleanup and remove driver
        run: |
          rm .github/workflows/lsp-doc-retirement-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills/phalcom-semantic-model/references/modules-and-incrementality.md .github/workflows/lsp-doc-retirement-cleanup.yml
          git commit -m 'docs(semantic): remove final retired LSP architecture references'
          git push origin HEAD:codex/lsp-single-world-retirement
