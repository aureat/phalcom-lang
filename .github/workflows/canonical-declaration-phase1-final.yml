name: Canonical Declaration Phase 1 Final

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded repair
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/canonical-declaration-phase1.yml').read_text()
          section = workflow.split('      - name: Apply phase 1 authority repair\n', 1)[1].split('      - name: Format\n', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          exec(textwrap.dedent(script), {'__name__': '__main__'})

          mod_path = Path('phalcom-semantic/src/db/mod.rs')
          mod = mod_path.read_text()
          old = '    FormalQueryInputs, bootstrap_advisory_callable, query_advisory_callable, query_advisory_module, query_callable_body,\n    query_callable_body_with_formal_inputs, query_callable_signature,'
          new = '    FormalQueryInputs, bootstrap_advisory_callable, query_advisory_callable, query_advisory_module, query_callable_body,\n    query_callable_body_with_formal_inputs, query_callable_signature, query_signatureless_callable_body,'
          if old not in mod:
              raise SystemExit('db query re-export anchor missing')
          mod_path.write_text(mod.replace(old, new, 1))

          for path in [
              '.github/workflows/canonical-declaration-phase1-rerun.yml',
              '.github/workflows/canonical-declaration-phase1-final.yml',
          ]:
              p = Path(path)
              if p.exists():
                  p.unlink()
      - name: Format
        run: cargo +stable fmt --all
      - name: Focused authority tests
        env:
          RUSTFLAGS: ""
        run: |
          cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::db::base::callable_body_query_fails_closed_when_consumed_signature_product_is_missing -- --exact
          cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::callable_dependencies::case_i_unannotated_callable_uses_canonical_signature_dependency -- --exact
          cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::db::base::test_body_query_execution_and_invalidation -- --exact
      - name: Full semantic gate
        env:
          RUSTFLAGS: ""
        run: |
          cargo +stable fmt --all -- --check
          git diff --check
          cargo +stable check -p phalcom-semantic
          cargo +stable test -p phalcom-semantic
      - name: Commit repair
        run: |
          git config user.name "phalcom-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(semantic): close callable signature prerequisite authority"
          git push origin HEAD:codex/canonical-declaration-knowledge
