name: Canonical Declaration Phase 2 V4

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  parameter-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Recreate Phase 2 implementation and regression
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/canonical-declaration-phase2-v3.yml').read_text()
          recreate = workflow.split('      - name: Recreate parameter identity regression\n', 1)[1].split('      - name: Apply staged Phase 2 implementation\n', 1)[0]
          exec(textwrap.dedent(recreate.split('        run: |\n', 1)[1]), {'__name__': '__main__'})

          apply = workflow.split('      - name: Apply staged Phase 2 implementation\n', 1)[1].split('      - name: Format\n', 1)[0]
          exec(textwrap.dedent(apply.split('        run: |\n', 1)[1]), {'__name__': '__main__'})

          # Canonical parameter identity now fixes the constructor parameter
          # attachment that originally caused this incident. Retain the test's
          # real invariant by adding an ordinary constructor-local binding: its
          # body/source owner mismatch still produces a non-fatal attachment
          # incident, while expression products must continue to publish.
          path = Path('phalcom-semantic/tests/semantic/integration/advisory_analysis.rs')
          text = path.read_text()
          old = '    let source = "class CellNum { @constructor new(_ raw: Int) { raw } }\\nlet value = CellNum.new(1)\\n";'
          new = '    let source = "class CellNum { @constructor new(_ raw: Int) { let copy = raw\\ncopy } }\\nlet value = CellNum.new(1)\\n";'
          if old not in text:
              raise SystemExit('stale attachment incident fixture anchor missing')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo +stable fmt --all
      - name: Focused Phase 2 regressions
        env:
          RUSTFLAGS: ""
        run: |
          cargo +stable test -p phalcom-semantic --test semantic semantic::integration::parameter_identity::callable_parameter_identity_connects_signature_binding_and_source_site -- --exact
          cargo +stable test -p phalcom-semantic --test semantic semantic::integration::advisory::analysis::binding_attachment_incident_does_not_hide_expression_attachment -- --exact
      - name: Full semantic gate
        env:
          RUSTFLAGS: ""
        run: |
          cargo +stable fmt --all -- --check
          git diff --check
          cargo +stable check -p phalcom-semantic
          cargo +stable test -p phalcom-semantic
      - name: Commit Phase 2
        run: |
          rm -f .github/workflows/canonical-declaration-phase2.yml \
                .github/workflows/canonical-declaration-phase2-runner.yml \
                .github/workflows/canonical-declaration-phase2-v2.yml \
                .github/workflows/canonical-declaration-phase2-v3.yml \
                .github/workflows/canonical-declaration-phase2-v4.yml
          git config user.name "phalcom-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(semantic): connect parameter declaration and source identity"
          git push origin HEAD:codex/canonical-declaration-knowledge
