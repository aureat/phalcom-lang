name: Agent C4 P3 dispatch terminal preservation

on:
  push:
    branches:
      - agent/c4-p3-complex-closure-7

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/c4-p3-complex-closure-7
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Apply dispatch terminal patch
        run: |
          python .github/scripts/c4_p3_dispatch_terminal.py
          python .github/scripts/c4_p3_dispatch_terminal_consumers_v2.py
          cargo fmt --all
          git diff --check

      - name: Compile semantic crate
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' check -p phalcom-semantic

      - name: Terminal precedence unit regressions
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --lib trait_dispatch::tests -- --nocapture

      - name: Semantic impl lane
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test semantic impls -- --nocapture

      - name: Semantic trait capability lane
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test semantic capabilities::traits -- --nocapture

      - name: Semantic incremental lane
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test semantic incremental -- --nocapture

      - name: Commit patch and remove temporary machinery
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-c4-p3-dispatch-terminal.yml \
            .github/scripts/c4_p3_dispatch_terminal.py \
            .github/scripts/c4_p3_dispatch_terminal_consumers.py \
            .github/scripts/c4_p3_dispatch_terminal_consumers_v2.py
          git add phalcom-semantic/src/trait_dispatch.rs \
            phalcom-semantic/src/dispatch.rs \
            phalcom-semantic/src/checker/context.rs \
            phalcom-semantic/src/checker/call.rs \
            phalcom-semantic/src/checker/expression.rs \
            phalcom-semantic/src/checker/statement.rs
          git diff --cached --check
          git commit -m 'preserve trait dispatch terminal proof states'
          git push origin HEAD:agent/c4-p3-complex-closure-7
