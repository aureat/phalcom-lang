name: Semantic constructor probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: semantic-constructor-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply class-object behavior root repair
        run: |
          cat > /tmp/bootstrap.rs <<'RS'
          //! Canonical source-defined Core semantics that are not native primitives.
          //!
          //! The compatibility Core world is flattened into `ModuleId::core()` while
          //! the physical Universe source remains presentation input. This module
          //! supplies the small source-defined semantic contracts needed by the
          //! flattened bootstrap until Core source bodies are analyzed directly.

          use crate::dispatch::{CallableSignature, SurfaceDispatchResolver};
          use crate::identity::{CallableId, DeclarationId, DispatchSide, ModuleId};
          use crate::signature::CallableSemanticSignature;
          use crate::surface::DeclarationSurface;
          use crate::types::evidence::{EvidenceOrigin, TypeKnowledge};
          use crate::types::parameter::{SelfRole, SelfTypeTerm, TypeTerm};
          use crate::types::store::TypeStore;
          use phalcom_common::selector::Selector;

          /// Installs source-defined Core behavior into the canonical flattened
          /// semantic world and returns its canonical callable signatures.
          ///
          /// `Class >> new()` is an ordinary source method, not constructor magic.
          /// Class-object sends first search the declaration's parallel class-side
          /// hierarchy and then continue through this `Class` behavior root.
          pub fn register_core_source_semantics(
              store: &mut TypeStore,
              dispatch: &mut SurfaceDispatchResolver,
          ) -> Vec<CallableSemanticSignature> {
              let class = DeclarationId::new(ModuleId::core(), "Class".into());
              dispatch.set_class_object_behavior_root(class.clone());

              if dispatch.get_surface(&class).is_none() {
                  dispatch.register_surface(class.clone(), DeclarationSurface::new(Some(class.clone())));
              }

              let selector = Selector::method("new", Vec::new()).expect("canonical Class.new selector");
              let callable = CallableId::new(class.clone(), selector.clone(), DispatchSide::Instance);
              let self_term = SelfTypeTerm {
                  owner: class.clone(),
                  side: DispatchSide::Instance,
                  role: SelfRole::InstanceType,
              };
              let self_type = store.self_type(self_term.clone());
              let surface_signature = CallableSignature::new(
                  selector.clone(),
                  Vec::new(),
                  TypeKnowledge::established(self_type, EvidenceOrigin::DeclarationSemantics),
              );
              let surface = dispatch.get_surface_mut(&class).expect("Class surface installed");
              if surface.get_callable(DispatchSide::Instance, &selector).is_none() {
                  surface.add_callable(DispatchSide::Instance, surface_signature);
              }

              vec![CallableSemanticSignature {
                  callable,
                  owner: class,
                  side: DispatchSide::Instance,
                  selector,
                  generics: None,
                  parameters: Box::new([]),
                  return_type: TypeTerm::SelfType(self_term),
                  source: None,
                  implementation: phalcom_native_meta::ImplementationKind::Source,
                  native_id: None,
                  effects: phalcom_native_meta::EffectSpec::Unknown,
                  raises: phalcom_native_meta::RaisesSpec::Unknown,
                  flow: phalcom_native_meta::ReturnFlowSpec::Value,
                  lifecycle: phalcom_native_meta::NativeLifecycleSpec::UNKNOWN,
              }]
          }
          RS
          mv /tmp/bootstrap.rs phalcom-semantic/src/core_surface/bootstrap.rs

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'phalcom-semantic/src/core_surface/mod.rs',
              'pub mod conformance;\n',
              'pub mod bootstrap;\npub mod conformance;\n',
          )
          replace(
              'phalcom-semantic/src/core_surface/mod.rs',
              'pub use conformance::*;\n',
              'pub use bootstrap::*;\npub use conformance::*;\n',
          )

          replace(
              'phalcom-semantic/src/dispatch.rs',
              '''pub struct SurfaceDispatchResolver {\n    surfaces: HashMap<DeclarationId, DeclarationSurface>,\n    type_declarations: HashMap<TypeId, DeclarationId>,\n}\n''',
              '''pub struct SurfaceDispatchResolver {\n    surfaces: HashMap<DeclarationId, DeclarationSurface>,\n    type_declarations: HashMap<TypeId, DeclarationId>,\n    /// Canonical ordinary-behavior root reached after class-side lookup\n    /// exhausts the receiver declaration's parallel hierarchy.\n    class_object_behavior_root: Option<DeclarationId>,\n}\n''',
          )
          replace(
              'phalcom-semantic/src/dispatch.rs',
              '''    pub fn register_type(&mut self, ty: TypeId, decl: DeclarationId) {\n        self.type_declarations.insert(ty, decl);\n    }\n''',
              '''    pub fn register_type(&mut self, ty: TypeId, decl: DeclarationId) {\n        self.type_declarations.insert(ty, decl);\n    }\n\n    /// Sets the canonical ordinary behavior root for class-object sends.\n    pub fn set_class_object_behavior_root(&mut self, root: DeclarationId) {\n        self.class_object_behavior_root = Some(root);\n    }\n\n    /// Returns the canonical ordinary behavior root for class-object sends.\n    pub fn class_object_behavior_root(&self) -> Option<&DeclarationId> {\n        self.class_object_behavior_root.as_ref()\n    }\n''',
          )
          old_resolve = '''    pub fn resolve_dispatch_with_trace(\n        &self,\n        hierarchy: &dyn TypeHierarchy,\n        start_decl: &DeclarationId,\n        side: DispatchSide,\n        selector: &Selector,\n    ) -> ResolvedDispatchResult {\n        let mut visited = Vec::new();\n        let mut curr = Some(start_decl);\n        while let Some(decl) = curr {\n            visited.push(decl.clone());\n            if let Some(surface) = self.surfaces.get(decl) {\n                if let Some(sig) = surface.get_callable(side, selector) {\n                    let callable_id = surface\n                        .get_callable_id(side, selector)\n                        .cloned()\n                        .unwrap_or_else(|| CallableId::new(decl.clone(), selector.clone(), side));\n                    return ResolvedDispatchResult::Found(ResolvedDispatch {\n                        callable: callable_id,\n                        signature: sig.clone(),\n                        visited_owners: visited.into_boxed_slice(),\n                    });\n                }\n            }\n            curr = hierarchy.superclass(decl);\n        }\n        ResolvedDispatchResult::Missing {\n            visited_owners: visited.into_boxed_slice(),\n        }\n    }\n'''
          new_resolve = '''    pub fn resolve_dispatch_with_trace(\n        &self,\n        hierarchy: &dyn TypeHierarchy,\n        start_decl: &DeclarationId,\n        side: DispatchSide,\n        selector: &Selector,\n    ) -> ResolvedDispatchResult {\n        let mut visited = Vec::new();\n        if let Some(resolved) = self.resolve_dispatch_chain(hierarchy, start_decl, side, selector, &mut visited) {\n            return ResolvedDispatchResult::Found(resolved);\n        }\n        if side == DispatchSide::Class\n            && let Some(root) = self.class_object_behavior_root.as_ref()\n            && let Some(resolved) = self.resolve_dispatch_chain(\n                hierarchy,\n                root,\n                DispatchSide::Instance,\n                selector,\n                &mut visited,\n            )\n        {\n            return ResolvedDispatchResult::Found(resolved);\n        }\n        ResolvedDispatchResult::Missing {\n            visited_owners: visited.into_boxed_slice(),\n        }\n    }\n\n    fn resolve_dispatch_chain(\n        &self,\n        hierarchy: &dyn TypeHierarchy,\n        start_decl: &DeclarationId,\n        side: DispatchSide,\n        selector: &Selector,\n        visited: &mut Vec<DeclarationId>,\n    ) -> Option<ResolvedDispatch> {\n        let mut curr = Some(start_decl);\n        while let Some(decl) = curr {\n            visited.push(decl.clone());\n            if let Some(surface) = self.surfaces.get(decl)\n                && let Some(sig) = surface.get_callable(side, selector)\n            {\n                let callable_id = surface\n                    .get_callable_id(side, selector)\n                    .cloned()\n                    .unwrap_or_else(|| CallableId::new(decl.clone(), selector.clone(), side));\n                return Some(ResolvedDispatch {\n                    callable: callable_id,\n                    signature: sig.clone(),\n                    visited_owners: visited.clone().into_boxed_slice(),\n                });\n            }\n            curr = hierarchy.superclass(decl);\n        }\n        None\n    }\n'''
          replace('phalcom-semantic/src/dispatch.rs', old_resolve, new_resolve)
          old_callable = '''    pub fn resolve_callable_id(\n        &self,\n        hierarchy: &dyn TypeHierarchy,\n        start_decl: &DeclarationId,\n        side: DispatchSide,\n        selector: &Selector,\n    ) -> Option<CallableId> {\n        let mut curr = Some(start_decl);\n        while let Some(decl) = curr {\n            if let Some(surface) = self.surfaces.get(decl) {\n                if let Some(id) = surface.get_callable_id(side, selector) {\n                    return Some(id.clone());\n                }\n            }\n            curr = hierarchy.superclass(decl);\n        }\n        None\n    }\n'''
          new_callable = '''    pub fn resolve_callable_id(\n        &self,\n        hierarchy: &dyn TypeHierarchy,\n        start_decl: &DeclarationId,\n        side: DispatchSide,\n        selector: &Selector,\n    ) -> Option<CallableId> {\n        match self.resolve_dispatch_with_trace(hierarchy, start_decl, side, selector) {\n            ResolvedDispatchResult::Found(resolved) => Some(resolved.callable),\n            ResolvedDispatchResult::Ambiguous(_) | ResolvedDispatchResult::Missing { .. } | ResolvedDispatchResult::Dynamic => None,\n        }\n    }\n'''
          replace('phalcom-semantic/src/dispatch.rs', old_callable, new_callable)

          replace(
              'phalcom-semantic/src/session.rs',
              '''        crate::checker::context::ensure_core_object_type_tests(&mut store, &base_declarations, &mut base_dispatch);\n\n        let mut base_callable_signatures = CallableSignatureTable::new();\n        for (_, signature) in native_report.callable_signatures {\n            base_callable_signatures.insert(signature);\n        }\n''',
              '''        crate::checker::context::ensure_core_object_type_tests(&mut store, &base_declarations, &mut base_dispatch);\n        let core_source_signatures = crate::core_surface::register_core_source_semantics(&mut store, &mut base_dispatch);\n\n        let mut base_callable_signatures = CallableSignatureTable::new();\n        for (_, signature) in native_report.callable_signatures {\n            base_callable_signatures.insert(signature);\n        }\n        for signature in core_source_signatures {\n            base_callable_signatures.insert(signature);\n        }\n''',
          )

          old_members = '''    pub fn members_for_receiver(&self, receiver: &ResolvedReceiver, access: &AccessContext) -> Vec<EditorMember> {\n        let mut members = Vec::new();\n        for alternative in receiver.alternatives.iter() {\n            let mut declaration = Some(alternative.declaration.clone());\n            let mut visited = BTreeSet::new();\n            while let Some(current) = declaration {\n                if !visited.insert(current.clone()) {\n                    break;\n                }\n                if let Some(surface) = self.snapshot.surfaces.get(&current) {\n                    let member_surface = surface.surface(match alternative.mode {\n                        ReceiverMode::Instance => crate::identity::DispatchSide::Instance,\n                        ReceiverMode::Class => crate::identity::DispatchSide::Class,\n                    });\n                    for (selector, callable) in &member_surface.callables_by_selector {\n                        let visibility = member_surface.callable_visibility.get(selector).copied().unwrap_or_default();\n                        if is_visible(self.snapshot.hierarchy.as_ref(), &current, visibility, access) {\n                            members.push(EditorMember {\n                                target: EditorMemberTarget::Callable(callable.clone()),\n                                owner: current.clone(),\n                                visibility,\n                            });\n                        }\n                    }\n                    for (name, field) in &member_surface.fields_by_name {\n                        let visibility = member_surface.field_visibility.get(name).copied().unwrap_or_default();\n                        if is_visible(self.snapshot.hierarchy.as_ref(), &current, visibility, access) {\n                            members.push(EditorMember {\n                                target: EditorMemberTarget::Field(field.clone()),\n                                owner: current.clone(),\n                                visibility,\n                            });\n                        }\n                    }\n                }\n                declaration = self.snapshot.hierarchy.superclass(&current).cloned();\n            }\n        }\n        members.sort_by(|left, right| member_sort_key(left).cmp(&member_sort_key(right)));\n        members.dedup_by(|left, right| left.target == right.target);\n        members\n    }\n'''
          new_members = '''    pub fn members_for_receiver(&self, receiver: &ResolvedReceiver, access: &AccessContext) -> Vec<EditorMember> {\n        let mut members = Vec::new();\n        for alternative in receiver.alternatives.iter() {\n            let primary_side = match alternative.mode {\n                ReceiverMode::Instance => crate::identity::DispatchSide::Instance,\n                ReceiverMode::Class => crate::identity::DispatchSide::Class,\n            };\n            let mut chains = vec![(alternative.declaration.clone(), primary_side)];\n            if alternative.mode == ReceiverMode::Class\n                && let Some(root) = self.snapshot.dispatch.class_object_behavior_root()\n            {\n                chains.push((root.clone(), crate::identity::DispatchSide::Instance));\n            }\n            let mut visited = BTreeSet::new();\n            for (start, side) in chains {\n                let mut declaration = Some(start);\n                while let Some(current) = declaration {\n                    if !visited.insert((current.clone(), side)) {\n                        break;\n                    }\n                    if let Some(surface) = self.snapshot.surfaces.get(&current) {\n                        let member_surface = surface.surface(side);\n                        for (selector, callable) in &member_surface.callables_by_selector {\n                            let visibility = member_surface.callable_visibility.get(selector).copied().unwrap_or_default();\n                            if is_visible(self.snapshot.hierarchy.as_ref(), &current, visibility, access) {\n                                members.push(EditorMember {\n                                    target: EditorMemberTarget::Callable(callable.clone()),\n                                    owner: current.clone(),\n                                    visibility,\n                                });\n                            }\n                        }\n                        for (name, field) in &member_surface.fields_by_name {\n                            let visibility = member_surface.field_visibility.get(name).copied().unwrap_or_default();\n                            if is_visible(self.snapshot.hierarchy.as_ref(), &current, visibility, access) {\n                                members.push(EditorMember {\n                                    target: EditorMemberTarget::Field(field.clone()),\n                                    owner: current.clone(),\n                                    visibility,\n                                });\n                            }\n                        }\n                    }\n                    declaration = self.snapshot.hierarchy.superclass(&current).cloned();\n                }\n            }\n        }\n        members.sort_by(|left, right| member_sort_key(left).cmp(&member_sort_key(right)));\n        members.dedup_by(|left, right| left.target == right.target);\n        members\n    }\n'''
          replace('phalcom-semantic/src/editor.rs', old_members, new_members)
          PY
          cargo +stable fmt --all
          git diff --check
      - name: Check semantic library
        run: cargo check -p phalcom-semantic --lib
      - name: Semantic constructor models
        run: cargo test -p phalcom-semantic --test semantic constructor_factory_probe -- --nocapture
      - name: Editor query regressions
        run: cargo test -p phalcom-semantic --test semantic editor -- --nocapture
      - name: LSP default constructor inlay
        run: cargo test -p phalcom-lsp --test integration inlay_hints::stable_runtime_shapes_are_exposed_as_inlay_hints -- --nocapture
      - name: LSP factory composition
        run: cargo test -p phalcom-lsp --test integration composition1::constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phalcom-semantic/src/core_surface/bootstrap.rs phalcom-semantic/src/core_surface/mod.rs phalcom-semantic/src/dispatch.rs phalcom-semantic/src/editor.rs phalcom-semantic/src/session.rs
          git commit -m 'fix(semantic): model class-object behavior root'
          git push origin HEAD:codex/lsp-single-world-retirement
