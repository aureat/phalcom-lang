name: LSP core presentation probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-core-presentation-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Apply core definition coordinate repair
        run: |
          python3 .github/scripts/apply-lsp-core-definition-coordinate.py
          cargo +stable fmt --all
          git diff --check

      - name: Check LSP library
        run: cargo check -p phalcom-lsp --lib

      - name: Core presentation request coherence
        run: cargo test -p phalcom-lsp --lib compiler_core_presentation_text_is_an_exact_source -- --nocapture

      - name: Core presentation source transport
        run: cargo test -p phalcom-lsp --test integration core_source_text_matches_compiler_presentation_publication -- --nocapture

      - name: Core presentation definition coordinates
        run: cargo test -p phalcom-lsp --test integration builtin_definition_range_indexes_the_compiler_core_presentation -- --nocapture

      - name: Commit validated core definition coordinate repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-lsp/src/backend.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(lsp): map semantic sites in compiler source coordinates"
          git push origin HEAD:codex/lsp-single-world-retirement
