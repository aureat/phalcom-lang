name: Canonical Fields GREEN

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical field authority cutover
        run: python3 .github/scripts/canonical_fields_apply.py
      - name: Format
        run: RUSTFLAGS="" cargo +stable fmt --all
      - name: Guard changed surface
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(phalcom-semantic/src/(checker/(context.rs|body.rs)|db/query.rs|session.rs)|phalcom-semantic/tests/semantic/incremental/query_ownership.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Canonical field authority regression
        run: RUSTFLAGS="" cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::declaration_authority::formal_field_lookup_never_reads_type_from_dispatch_surface -- --exact
      - name: Semantic check
        run: RUSTFLAGS="" cargo +stable check -p phalcom-semantic
      - name: Full semantic gate
        run: RUSTFLAGS="" cargo +stable test -p phalcom-semantic
      - name: Diff integrity
        run: git diff --check
      - name: Commit canonical field authority
        run: |
          paths=(
            phalcom-semantic/src/checker/context.rs
            phalcom-semantic/src/checker/body.rs
            phalcom-semantic/src/db/query.rs
            phalcom-semantic/src/session.rs
            phalcom-semantic/tests/semantic/incremental/query_ownership.rs
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'canonical field authority already applied'
            exit 0
          fi
          git config user.name phalcom-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add "${paths[@]}"
          git commit -m 'refactor(semantic): consume canonical field signatures'
          git push origin HEAD:codex/canonical-declaration-knowledge
