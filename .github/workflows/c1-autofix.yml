name: C1 completion autofix

on:
  push:
    branches: [c1-completion-audit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c1-completion-audit
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - name: Apply audited C1 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "phalcom-core/src/primitive/object.rs",
              "    let lhs_is_data = lhs_singleton.is_some() || lhs_obj.map_or(false, |id| vm.heap.as_data(id).is_some());\n    let rhs_is_data = rhs_singleton.is_some() || rhs_obj.map_or(false, |id| vm.heap.as_data(id).is_some());",
              "    let lhs_is_data = lhs_singleton.is_some() || lhs_obj.is_some_and(|id| vm.heap.as_data(id).is_some());\n    let rhs_is_data = rhs_singleton.is_some() || rhs_obj.is_some_and(|id| vm.heap.as_data(id).is_some());",
          )

          replace_once(
              "phalcom-core/src/modules/semantic_lowering.rs",
              "    #[error(\"open or unrepresentable data construction type {result_type:?} for {constructor:?}\")]\n    OpenDataConstructionType { constructor: DataConstructorId, result_type: TypeId },",
              "    #[error(\"open or unrepresentable data construction type {result_type:?} for {constructor:?}\")]\n    OpenDataConstructionType { constructor: DataConstructorId, result_type: TypeId },\n    #[error(\"data constructor {constructor:?} carried non-callable semantic type {callable_type:?}\")]\n    InvalidDataConstructorCallableType { constructor: DataConstructorId, callable_type: TypeId },",
          )

          replace_once(
              "phalcom-core/src/modules/semantic_lowering.rs",
              "        TypeData::Callable(call) => call.parameters.iter().any(|p| contains_exact_case(store, p.ty)) || contains_exact_case(store, call.return_type),\n        _ => false,",
              "        TypeData::Callable(call) => call.parameters.iter().any(|p| contains_exact_case(store, p.ty)) || contains_exact_case(store, call.return_type),\n        TypeData::Family(family_id) => store.get_family(*family_id).members.iter().any(|member| contains_exact_case(store, member.ty)),\n        _ => false,",
          )

          replace_once(
              "phalcom-core/src/modules/semantic_lowering.rs",
              "    let (result_type, arity) = match snapshot.store.get(callable_type) {\n        TypeData::Callable(call) => (call.return_type, call.parameters.len()),\n        _ => {\n            let info = snapshot\n                .data_semantics\n                .data_info(&constructor.owner)\n                .ok_or_else(|| ProjectionError::MissingDataMetadata(constructor.owner.clone()))?;\n            (info.constructor.result_type_template, info.components.len())\n        }\n    };",
              "    let TypeData::Callable(call) = snapshot.store.get(callable_type) else {\n        return Err(ProjectionError::InvalidDataConstructorCallableType {\n            constructor: constructor.clone(),\n            callable_type,\n        });\n    };\n    let (result_type, arity) = (call.return_type, call.parameters.len());",
          )
          PY
          cargo +nightly-2026-07-10 fmt --all
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git rm .github/workflows/c1-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-core/src/primitive/object.rs phalcom-core/src/modules/semantic_lowering.rs
          git commit -m "fix(data): close C1 lowering release gaps"
          git push origin HEAD:c1-completion-audit
