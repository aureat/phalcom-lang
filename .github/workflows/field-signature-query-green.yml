name: Field Signature Query GREEN

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply field signature query ownership
        run: python3 .github/scripts/field_signature_query_apply.py
      - name: Format
        run: RUSTFLAGS="" cargo +stable fmt --all
      - name: Guard changed production surface
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^phalcom-semantic/src/(db/(key.rs|product.rs|fingerprint.rs|query.rs)|checker/(analysis.rs|context.rs|declaration_signature.rs)|session.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Field query ownership regression
        run: RUSTFLAGS="" cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::declaration_authority::field_signature_is_a_first_class_incremental_product -- --exact
      - name: Field annotation incrementality
        run: RUSTFLAGS="" cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::callable_dependencies::case_c_field_annotation_change_recomputes_reader -- --exact
      - name: Semantic check
        run: RUSTFLAGS="" cargo +stable check -p phalcom-semantic
      - name: Full semantic gate
        run: RUSTFLAGS="" cargo +stable test -p phalcom-semantic
      - name: Diff integrity
        run: git diff --check
      - name: Commit field query ownership
        run: |
          paths=(
            phalcom-semantic/src/db/key.rs
            phalcom-semantic/src/db/product.rs
            phalcom-semantic/src/db/fingerprint.rs
            phalcom-semantic/src/db/query.rs
            phalcom-semantic/src/checker/analysis.rs
            phalcom-semantic/src/checker/context.rs
            phalcom-semantic/src/checker/declaration_signature.rs
            phalcom-semantic/src/session.rs
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'field signature query ownership already applied'
            exit 0
          fi
          git config user.name phalcom-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add "${paths[@]}"
          git commit -m 'refactor(semantic): own field signatures in query DB'
          git push origin HEAD:codex/canonical-declaration-knowledge
