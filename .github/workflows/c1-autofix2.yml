name: C1 clippy autofix

on:
  push:
    branches: [c1-completion-audit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c1-completion-audit
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt,clippy
      - name: Normalize data equality control flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('phalcom-core/src/primitive/object.rs')
          text = p.read_text()
          old = '''    if let (Some(did), Some(ob)) = (lhs_singleton, rhs_obj) {
        if let Some(db) = vm.heap.as_data(ob) {
            return Ok(Some(did == db.descriptor));
        }
        return Ok(Some(false));
    }

    if let (Some(oa), Some(did)) = (lhs_obj, rhs_singleton) {
        if let Some(da) = vm.heap.as_data(oa) {
            return Ok(Some(did == da.descriptor));
        }
        return Ok(Some(false));
    }

    if let (Some(oa), Some(ob)) = (lhs_obj, rhs_obj) {
        if let (Some(da), Some(db)) = (vm.heap.as_data(oa), vm.heap.as_data(ob)) {
            if da.descriptor != db.descriptor {
                return Ok(Some(false));
            }
            let layout_id = da.storage.layout;
            let layout = vm
                .heap
                .product_layouts
                .get(layout_id)
                .ok_or_else(|| RuntimeError::Internal("missing data layout".into()))?;
            let values_a = layout
                .components
                .iter()
                .map(|component| da.storage.load_component(layout, component.logical_index))
                .collect::<Result<Vec<_>, _>>()
                .map_err(|e| RuntimeError::Internal(e.into()))?;
            let values_b = layout
                .components
                .iter()
                .map(|component| db.storage.load_component(layout, component.logical_index))
                .collect::<Result<Vec<_>, _>>()
                .map_err(|e| RuntimeError::Internal(e.into()))?;
            for (va, vb) in values_a.into_iter().zip(values_b) {
                if !crate::primitive::send_eq(vm, va, vb)? {
                    return Ok(Some(false));
                }
            }
            return Ok(Some(true));
        }
    }
'''
          new = '''    if let (Some(did), Some(ob)) = (lhs_singleton, rhs_obj) {
        return Ok(Some(vm.heap.as_data(ob).is_some_and(|db| did == db.descriptor)));
    }

    if let (Some(oa), Some(did)) = (lhs_obj, rhs_singleton) {
        return Ok(Some(vm.heap.as_data(oa).is_some_and(|da| did == da.descriptor)));
    }

    if let (Some(oa), Some(ob)) = (lhs_obj, rhs_obj)
        && let (Some(da), Some(db)) = (vm.heap.as_data(oa), vm.heap.as_data(ob))
    {
        if da.descriptor != db.descriptor {
            return Ok(Some(false));
        }
        let layout_id = da.storage.layout;
        let layout = vm
            .heap
            .product_layouts
            .get(layout_id)
            .ok_or_else(|| RuntimeError::Internal("missing data layout".into()))?;
        let values_a = layout
            .components
            .iter()
            .map(|component| da.storage.load_component(layout, component.logical_index))
            .collect::<Result<Vec<_>, _>>()
            .map_err(|e| RuntimeError::Internal(e.into()))?;
        let values_b = layout
            .components
            .iter()
            .map(|component| db.storage.load_component(layout, component.logical_index))
            .collect::<Result<Vec<_>, _>>()
            .map_err(|e| RuntimeError::Internal(e.into()))?;
        for (va, vb) in values_a.into_iter().zip(values_b) {
            if !crate::primitive::send_eq(vm, va, vb)? {
                return Ok(Some(false));
            }
        }
        return Ok(Some(true));
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one data_eq block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo +nightly-2026-07-10 fmt --all
          git diff --check
      - name: Verify Clippy
        run: cargo +nightly-2026-07-10 clippy --workspace --all-targets -- -D warnings
      - name: Commit repair
        shell: bash
        run: |
          git rm .github/workflows/c1-autofix2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-core/src/primitive/object.rs
          git commit -m "fix(data): normalize equality control flow"
          git push origin HEAD:c1-completion-audit
