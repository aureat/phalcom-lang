name: C1 audit lint patch

on:
  push:
    branches: [audit/lang005-c1-completion]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/lang005-c1-completion
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - name: Apply strict lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} copies of replacement target, found {count}')
              p.write_text(text.replace(old, new))

          replace(
              'phalcom-semantic/tests/semantic/capabilities/time.rs',
              'assert_source_contract(&fixture.binding(run, "clock"), fixture.ty("Clock"));',
              'assert_source_contract(fixture.binding(run, "clock"), fixture.ty("Clock"));',
          )
          replace(
              'phalcom-semantic/tests/semantic/capabilities/time.rs',
              'assert_source_contract(&fixture.binding(run, "instant"), fixture.ty("Instant"));',
              'assert_source_contract(fixture.binding(run, "instant"), fixture.ty("Instant"));',
          )
          replace(
              'phalcom-semantic/tests/semantic/capabilities/time.rs',
              'assert_source_contract(&fixture.binding(run, "elapsed"), fixture.ty("Duration"));',
              'assert_source_contract(fixture.binding(run, "elapsed"), fixture.ty("Duration"));',
          )

          replace(
              'phalcom-core/src/compiler/lib/expr.rs',
              '''                if let Some(spec) = self.lowering().and_then(|l| {\n                    l.associated\n                        .iter()\n                        .find(|(site, _)| site.range == get_prop.range && site.kind == LoweringSiteKind::AssociatedLookup)\n                        .map(|(_, spec)| spec.clone())\n                }) {\n                    if let AssociatedLoweringSpec::GetDataComponent { logical_index, .. } = spec {\n                        self.compile_expr(get_prop.object)?;\n                        self.emit(Bytecode::GetDataComponent(logical_index as u16), get_prop.range);\n                        return Ok(());\n                    }\n                }''',
              '''                if let Some(AssociatedLoweringSpec::GetDataComponent { logical_index, .. }) = self.lowering().and_then(|l| {\n                    l.associated\n                        .iter()\n                        .find(|(site, _)| site.range == get_prop.range && site.kind == LoweringSiteKind::AssociatedLookup)\n                        .map(|(_, spec)| spec.clone())\n                }) {\n                    self.compile_expr(get_prop.object)?;\n                    self.emit(Bytecode::GetDataComponent(logical_index as u16), get_prop.range);\n                    return Ok(());\n                }''',
          )

          replace(
              'phalcom-core/src/modules/semantic_lowering.rs',
              '''        match snapshot.store.get(ty) {\n            TypeData::Nominal { declaration } => {\n                if declaration == &core_ids.int {\n                    // Int includes heap-backed arbitrary-precision values; only a range proof permits Int64.\n                    return crate::product::ProductSlotRepr::Value;\n                } else if declaration == &core_ids.float {\n                    return crate::product::ProductSlotRepr::Float64;\n                } else if declaration == &core_ids.bool_ {\n                    return crate::product::ProductSlotRepr::Bool;\n                } else if declaration == &core_ids.symbol {\n                    return crate::product::ProductSlotRepr::Symbol;\n                }\n            }\n            _ => {}\n        }''',
              '''        if let TypeData::Nominal { declaration } = snapshot.store.get(ty) {\n            if declaration == &core_ids.int {\n                // Int includes heap-backed arbitrary-precision values; only a range proof permits Int64.\n                return crate::product::ProductSlotRepr::Value;\n            } else if declaration == &core_ids.float {\n                return crate::product::ProductSlotRepr::Float64;\n            } else if declaration == &core_ids.bool_ {\n                return crate::product::ProductSlotRepr::Bool;\n            } else if declaration == &core_ids.symbol {\n                return crate::product::ProductSlotRepr::Symbol;\n            }\n        }''',
          )

          replace(
              'phalcom-core/src/primitive/object.rs',
              'lhs_obj.map_or(false, |id| vm.heap.as_data(id).is_some())',
              'lhs_obj.is_some_and(|id| vm.heap.as_data(id).is_some())',
          )
          replace(
              'phalcom-core/src/primitive/object.rs',
              'rhs_obj.map_or(false, |id| vm.heap.as_data(id).is_some())',
              'rhs_obj.is_some_and(|id| vm.heap.as_data(id).is_some())',
          )

          replace(
              'phalcom-core/src/product/layout.rs',
              '''            for j in (i + 1)..sorted.len() {\n                let b = &sorted[j];\n                let b_end = b.word_offset + b.repr.word_size();''',
              '''            for b in sorted.iter().skip(i + 1) {\n                let b_end = b.word_offset + b.repr.word_size();''',
          )

          replace('phalcom-core/src/product/mod.rs', 'Value::float(3.14)', 'Value::float(3.125)', expected=2)

          replace(
              'phalcom-core/src/vm/dispatch.rs',
              'self.adt_registry.variant_by_semantic(&variant)',
              'self.adt_registry.variant_by_semantic(variant)',
              expected=2,
          )
          replace(
              'phalcom-core/src/vm/dispatch.rs',
              '''                        crate::modules::semantic_lowering::ExecutableFamilyTarget::Behavioral { target } => {\n                            let resolved = self.bind_behavioral_associated_target(&target)?;''',
              '''                        crate::modules::semantic_lowering::ExecutableFamilyTarget::Behavioral { target } => {\n                            let resolved = self.bind_behavioral_associated_target(target)?;''',
          )
          replace(
              'phalcom-core/src/vm/dispatch.rs',
              'self.construct_data_from_spec(&construction, args)?',
              'self.construct_data_from_spec(construction, args)?',
          )
          PY
          cargo +nightly-2026-07-10 fmt --all
      - name: Commit patch and remove staging workflow
        run: |
          git config user.name 'OpenAI audit agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/c1-audit-fix.yml
          git add phalcom-semantic/tests/semantic/capabilities/time.rs phalcom-core/src/compiler/lib/expr.rs phalcom-core/src/modules/semantic_lowering.rs phalcom-core/src/primitive/object.rs phalcom-core/src/product/layout.rs phalcom-core/src/product/mod.rs phalcom-core/src/vm/dispatch.rs
          git commit -m 'fix(data): satisfy strict workspace lint gates'
          git push origin HEAD:audit/lang005-c1-completion
