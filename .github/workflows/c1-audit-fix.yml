name: C1 audit patch

on:
  push:
    branches: [audit/lang005-c1-completion]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/lang005-c1-completion
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - name: Apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('phalcom-semantic/src/checker/expression.rs'): [
                  (
                      '''                let Some(target_id) = target.as_ref() else {\n                    return None;\n                };''',
                      '''                let target_id = target.as_ref()?;''',
                  ),
              ],
              Path('phalcom-semantic/src/session.rs'): [
                  (
                      '''                                if let Err(e) = refresh_cached_body_dependencies(&mut self.db, &query_key, &formal_inputs, Arc::make_mut(&mut self.store)) {\n                                    return Err(e);\n                                }''',
                      '''                                refresh_cached_body_dependencies(\n                                    &mut self.db,\n                                    &query_key,\n                                    &formal_inputs,\n                                    Arc::make_mut(&mut self.store),\n                                )?;''',
                  ),
              ],
              Path('phalcom-semantic/tests/semantic/incremental/adts.rs'): [
                  (
                      '''let source_a = "enum Expr<T> { @variant Int(_ value: Int) -> Expr<Int> @variant Bool(_ value: Bool) -> Expr<Bool> }\\nclass Test { run(_ value: Expr<Int>) { match value { Expr::Int(x) => x } }\\n";''',
                      '''let source_a = "enum Expr<T> { @variant Int(_ value: Int) -> Expr<Int> @variant Bool(_ value: Bool) -> Expr<Bool> }\\nclass Test { run(_ value: Expr<Int>) { match value { Expr::Int(x) => x } } }\\n";''',
                  ),
                  (
                      '''let source_b = "enum Expr<T> { @variant Int(_ value: Int) -> Expr<Int> @variant Bool(_ value: Bool) -> Expr<Bool> }\\nclass Test { run(_ value: Expr<Bool>) { match value { Expr::Bool(x) => x } }\\n";''',
                      '''let source_b = "enum Expr<T> { @variant Int(_ value: Int) -> Expr<Int> @variant Bool(_ value: Bool) -> Expr<Bool> }\\nclass Test { run(_ value: Expr<Bool>) { match value { Expr::Bool(x) => x } } }\\n";''',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          cargo +nightly-2026-07-10 fmt --all
      - name: Commit patch and remove staging workflow
        run: |
          git config user.name 'OpenAI audit agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/c1-audit-fix.yml
          git add phalcom-semantic/src/checker/expression.rs phalcom-semantic/src/session.rs phalcom-semantic/tests/semantic/incremental/adts.rs
          git commit -m 'fix(data): close C1 semantic completion gates'
          git push origin HEAD:audit/lang005-c1-completion
