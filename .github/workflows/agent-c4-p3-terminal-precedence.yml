name: Agent C4 P3 terminal precedence

on:
  push:
    branches:
      - agent/c4-p3-complex-closure-7

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/c4-p3-complex-closure-7
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Apply terminal precedence patch
        run: |
          python .github/scripts/c4_p3_terminal_precedence.py
          cargo fmt --all
          git diff --check
          git diff -- phalcom-semantic/src/trait_dispatch.rs

      - name: Unit regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --lib trait_dispatch::tests -- --nocapture

      - name: Semantic impl lane
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test semantic impls -- --nocapture

      - name: Semantic build
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' check -p phalcom-semantic

      - name: Commit patch and remove temporary machinery
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-c4-p3-terminal-precedence.yml .github/scripts/c4_p3_terminal_precedence.py
          git add phalcom-semantic/src/trait_dispatch.rs
          git diff --cached --check
          git commit -m 'fix trait dispatch terminal precedence'
          git push origin HEAD:agent/c4-p3-complex-closure-7
