name: Canonical Declaration Phase 2 V3

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  parameter-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Recreate parameter identity regression
        shell: python
        run: |
          from pathlib import Path
          test = '''use std::sync::Arc;

          use phalcom_common::selector::{Selector, SelectorSlot};
          use phalcom_modules::identity::ModuleId;
          use phalcom_semantic::{CallableId, CallableParameterId, DeclarationId, DispatchSide, analyze_single_module};

          #[test]
          fn callable_parameter_identity_connects_signature_binding_and_source_site() {
              let module = ModuleId::core();
              let source: Arc<str> = Arc::from(
                  r#"\nclass ParameterProbe {\n    run(value: Int) -> Int {\n        value\n    }\n}\n"#,
              );
              let parsed = phalcom_ast::parse(&source, 0);
              assert!(parsed.errors.is_empty(), "fixture must parse: {:#?}", parsed.errors);
              let result = analyze_single_module(module.clone(), source, Arc::new(parsed.program));
              let owner = DeclarationId::new(module.clone(), "ParameterProbe".into());
              let callable = CallableId::new(
                  owner,
                  Selector::method("run", [SelectorSlot::Label("value".into())]).expect("selector"),
                  DispatchSide::Instance,
              );
              let signature = result.snapshot.callable_signatures.get(&callable).expect("canonical callable signature");
              let parameter = signature.parameters.first().expect("parameter");
              assert_eq!(parameter.id, CallableParameterId::new(callable.clone(), 0));
              let analysis = result.snapshot.callable_analyses.get(&callable).expect("callable analysis");
              let binding = analysis
                  .bindings
                  .values()
                  .find(|binding| binding.parameter.as_ref() == Some(&parameter.id))
                  .expect("checker binding keeps canonical parameter identity");
              let module_index = result.snapshot.source_index.modules.get(&module).expect("module source index");
              let source_info = module_index.structure.callable_sources.get(&callable).expect("callable source info");
              let parameter_site = source_info.parameter_sites.get(&parameter.id).expect("canonical parameter source site");
              assert_eq!(binding.range, module_index.structure.site(parameter_site).expect("parameter site").range);
              let attachment = module_index.attachments.get(&callable).expect("formal source attachment");
              assert_eq!(attachment.source_site_for_binding(binding.binding), Some(parameter_site));
          }
          '''
          # Remove workflow indentation embedded in the literal.
          import textwrap
          Path('phalcom-semantic/tests/semantic/integration/parameter_identity.rs').write_text(textwrap.dedent(test))
          mod = Path('phalcom-semantic/tests/semantic/integration/mod.rs')
          content = mod.read_text()
          if 'mod parameter_identity;' not in content:
              content = content.replace('mod imported_resolution;\n', 'mod imported_resolution;\nmod parameter_identity;\n', 1)
          mod.write_text(content)
      - name: Apply staged Phase 2 implementation
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/canonical-declaration-phase2-v2.yml').read_text()
          section = workflow.split('      - name: Implement parameter identity bridge\n', 1)[1].split('      - name: Format\n', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          exec(textwrap.dedent(script), {'__name__': '__main__'})

          # The generic seed migration must not overwrite the identity-aware seed.
          context = Path('phalcom-semantic/src/checker/context.rs')
          text = context.read_text()
          duplicate = '''            parameter: None,
              name: name.into(),
              parameter,
          '''
          if duplicate not in text:
              duplicate = '''            parameter: None,
                  name: name.into(),
                  parameter,
              '''
          if duplicate not in text:
              raise SystemExit('identity-aware duplicate parameter anchor missing')
          text = text.replace(duplicate, duplicate.replace('            parameter: None,\n', '', 1), 1)
          context.write_text(text)
      - name: Format
        run: cargo +stable fmt --all
      - name: Focused parameter identity test
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic --test semantic semantic::integration::parameter_identity::callable_parameter_identity_connects_signature_binding_and_source_site -- --exact
      - name: Full semantic gate
        env:
          RUSTFLAGS: ""
        run: |
          cargo +stable fmt --all -- --check
          git diff --check
          cargo +stable check -p phalcom-semantic
          cargo +stable test -p phalcom-semantic
      - name: Commit Phase 2
        run: |
          rm -f .github/workflows/canonical-declaration-phase2.yml \
                .github/workflows/canonical-declaration-phase2-runner.yml \
                .github/workflows/canonical-declaration-phase2-v2.yml \
                .github/workflows/canonical-declaration-phase2-v3.yml
          git config user.name "phalcom-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(semantic): connect parameter declaration and source identity"
          git push origin HEAD:codex/canonical-declaration-knowledge
