name: P4 complete-pack focused semantic selectors

on:
  push:
    branches:
      - codex/c3-p4-complete-pack-canonicalization

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""
  RUSTC_WRAPPER: ""

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - name: Confirm only the two focused selectors are selected
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --lib complete_pack_reassembles_only_its_own_intrinsic_lanes -- --list | tee /tmp/store-tests.txt
          grep -F 'complete_pack_reassembles_only_its_own_intrinsic_lanes: test' /tmp/store-tests.txt
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test semantic source_visible_complete_pack_lane_projections_keep_canonical_member_declarations -- --list | tee /tmp/source-tests.txt
          grep -F 'source_visible_complete_pack_lane_projections_keep_canonical_member_declarations: test' /tmp/source-tests.txt
      - name: Run the focused selectors
        run: |
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --lib complete_pack_reassembles_only_its_own_intrinsic_lanes
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test semantic source_visible_complete_pack_lane_projections_keep_canonical_member_declarations
