name: CI

on:
  push:
    branches: [main, feat/adts]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""

jobs:
  part-5-1-orchestration:
    name: Part 5.1 orchestration repair
    if: github.ref == 'refs/heads/feat/adts'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply ordered match orchestration
        run: python3 .github/scripts/apply_part_5_1_orchestration.py
      - name: Format
        run: cargo +stable fmt --all
      - name: Verify patch
        run: git diff --check
      - name: Verify match regressions
        run: cargo +stable test -p phalcom-semantic --test semantic match_regressions::
      - name: Commit semantic changes
        run: |
          git config user.name 'phalcom-ci'
          git config user.email 'phalcom-ci@users.noreply.github.com'
          git add phalcom-semantic/src/checker/expression.rs phalcom-semantic/src/checker/exhaustiveness.rs phalcom-semantic/tests/semantic/adts/match_regressions.rs
          if git diff --cached --quiet; then
            echo 'No semantic changes required.'
            exit 0
          fi
          git commit -m 'fix: analyze only reachable match arms'
          git push origin HEAD:feat/adts

  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo +stable build --workspace --all-targets
      - name: Test
        run: cargo +stable test --workspace --all-targets

  vsphalcom:
    name: VS Code extension E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vsphalcom/package-lock.json
      - name: Build language server
        run: cargo +stable build -p phalcom-lsp
      - name: Install extension dependencies
        run: npm ci --prefix tools/vsphalcom
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run VS Code extension-host tests
        run: xvfb-run -a npm --prefix tools/vsphalcom test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo +stable fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable clippy --workspace --all-targets -- -D warnings

  miri:
    name: Miri (phalcom-ast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p phalcom-ast
