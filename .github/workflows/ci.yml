name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""
  RUSTC_WRAPPER: ""

jobs:
  either:
    name: Either generic conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Force LLVM in verification checkout
        run: sed -i 's/codegen-backend = "cranelift"/codegen-backend = "llvm"/g' Cargo.toml
      - name: Format package Rust files
        run: rustfmt +nightly-2026-07-10 --edition 2024 --check phalcom-test-support/tests/either/*.rs
      - name: Clippy package test target
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          clippy -p phalcom-test-support --test either -- -D warnings
      - name: Test package
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-test-support --test either -- --nocapture
