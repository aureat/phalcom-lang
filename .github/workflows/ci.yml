name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets

  vsphalcom:
    name: VS Code extension E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/vsphalcom/package-lock.json
      - name: Build language server
        run: cargo build -p phalcom-lsp
      - name: Install extension dependencies
        run: npm ci --prefix tools/vsphalcom
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run VS Code extension-host tests
        run: xvfb-run -a npm --prefix tools/vsphalcom test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    # SOFT-LAUNCH: the tree is not yet fully rustfmt-clean. This job annotates
    # drift without failing CI. Once `cargo fmt --all` has been run on a clean
    # tree, delete this `continue-on-error` line to make formatting mandatory.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # SOFT-LAUNCH: there is an existing backlog of clippy warnings. This job
    # reports them without failing CI. After the backlog is cleared, delete this
    # `continue-on-error` line so new warnings block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  miri:
    name: Miri (phalcom-ast)
    runs-on: ubuntu-latest
    # Mirrors `scripts/verify.sh --miri`: lexer/parser UB check only.
    # phalcom-core is NOT run here — its `invariants` suite bootstraps the
    # full core.ph object model under miri and does not finish inside a CI
    # timeout (docs/forge/perf-log/011-attack-on-010.md §11: 51 min, 8/42
    # tests, still incomplete). Scope stays phalcom-ast until that lane is
    # made CI-shaped.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p phalcom-ast
