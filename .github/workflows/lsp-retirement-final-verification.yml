name: LSP retirement final verification

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: read

concurrency:
  group: lsp-retirement-final-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  main-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Main callable language control
        continue-on-error: true
        run: cargo test -p phalcom-core language_tests::run_language_tests -- --nocapture
      - name: Main error-language control
        continue-on-error: true
        run: cargo test -p phalcom-core language_tests::error_tests_match_expected -- --nocapture
