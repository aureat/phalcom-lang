name: LSP retirement final verification

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: read

concurrency:
  group: lsp-retirement-final-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  determinism-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Branch functions stress
        run: |
          for i in $(seq 1 10); do
            echo "branch functions run $i"
            cargo test -p phalcom-core --test lang functions -- --exact
            cargo test -p phalcom-core --test lang functions_negative -- --exact
          done
      - name: Branch serialized workspace
        run: cargo test --workspace --all-targets -j 1
      - name: Checkout main
        run: git fetch origin main --depth=1 && git checkout --detach origin/main
      - name: Main functions stress
        run: |
          for i in $(seq 1 10); do
            echo "main functions run $i"
            cargo test -p phalcom-core --test lang functions -- --exact
            cargo test -p phalcom-core --test lang functions_negative -- --exact
          done
