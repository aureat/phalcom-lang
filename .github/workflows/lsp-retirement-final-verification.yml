name: LSP retirement final verification

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: read

concurrency:
  group: lsp-retirement-final-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  language-concurrency-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Branch full language suite parallel
        continue-on-error: true
        run: cargo test -p phalcom-core --test lang -- --nocapture
      - name: Branch full language suite serial
        continue-on-error: true
        run: cargo test -p phalcom-core --test lang -- --test-threads=1 --nocapture
      - name: Checkout main
        run: git fetch origin main --depth=1 && git checkout --detach origin/main
      - name: Main full language suite parallel
        continue-on-error: true
        run: cargo test -p phalcom-core --test lang -- --nocapture
      - name: Main full language suite serial
        continue-on-error: true
        run: cargo test -p phalcom-core --test lang -- --test-threads=1 --nocapture
