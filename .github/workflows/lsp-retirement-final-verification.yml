name: LSP retirement final verification

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: /tmp/phalcom-lsp-retirement-final

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply structural nominal call repair
        run: python .github/scripts/apply-structural-nominal-call-repair.py
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Compile semantic and LSP
        run: |
          cargo check -p phalcom-semantic
          cargo check -p phalcom-lsp --lib
      - name: Validate structural callable language surface
        run: cargo test -p phalcom-core --test lang functions -- --exact
      - name: Validate semantic retirement regressions
        run: cargo test -p phalcom-semantic --test semantic constructor_factory_probe -- --nocapture
      - name: Validate complete LSP integration suite
        run: cargo test -p phalcom-lsp --test integration -- --nocapture
      - name: Validate semantic authority boundary
        run: cargo test -p phalcom-lsp --test semantic_boundary -- --nocapture
      - name: Commit validated structural callable repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-semantic/src/checker/expression.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(semantic): dispatch direct nominal callable values'
            git pull --rebase origin codex/lsp-single-world-retirement
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
