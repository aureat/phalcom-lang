name: LSP retirement final verification

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  structural-call-bisect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre-retirement
            ref: 9b30ec324d4361128f285154fe236e25746df750
          - label: initial-retirement
            ref: ec6b90ecd97347becba6c67043d80268a3b8c311
          - label: pre-dispatch-unification
            ref: 36bd12ebb0dc0a1e1fcf777d3583dde2b2e90c39
          - label: dispatch-unification
            ref: c22c9e8d36c579e383d728705a6120f9a2d36430
          - label: lsp-green-milestone
            ref: 5b7d3c7633fac9c09dd48056f06367a9f4902748
          - label: current
            ref: aa57aaf6f37de616384fd28e43b25cc596e8b9db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test structural callable surface
        shell: bash
        run: |
          set +e
          cargo test -p phalcom-core --test lang functions -- --exact >/tmp/functions.log 2>&1
          status=$?
          cat /tmp/functions.log
          echo "BISECT_RESULT label=${{ matrix.label }} ref=${{ matrix.ref }} status=$status"
          exit 0
