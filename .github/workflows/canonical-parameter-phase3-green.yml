name: Canonical Parameter Phase 3 GREEN

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical parameter routing
        run: python3 .github/scripts/canonical_parameter_phase3.py
      - name: Format
        run: cargo +stable fmt --all
      - name: Focused canonical parameter regressions
        run: |
          cargo test -p phalcom-semantic --test semantic canonical_parameter_advisory::advisory_parameter_contributions_use_canonical_parameter_identity -- --exact
          cargo test -p phalcom-semantic --test semantic canonical_parameter_advisory::constructor_argument_transfer_uses_public_canonical_parameter_identity -- --exact
      - name: Full semantic gate
        run: cargo test -p phalcom-semantic --test semantic
      - name: Diff integrity
        run: git diff --check
      - name: Commit Phase 3 routing
        run: |
          if git diff --quiet -- phalcom-semantic/src/advisory/flow.rs phalcom-semantic/src/session.rs; then
            echo 'Phase 3 routing already applied'
            exit 0
          fi
          git config user.name phalcom-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add phalcom-semantic/src/advisory/flow.rs phalcom-semantic/src/session.rs
          git commit -m 'refactor(semantic): route advisory parameters by canonical identity'
          git push origin HEAD:codex/canonical-declaration-knowledge
