name: Canonical Parameter Phase 3 GREEN

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical parameter routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flow_path = Path('phalcom-semantic/src/advisory/flow.rs')
          flow = flow_path.read_text()
          flow_old_import = 'use crate::identity::{CallableId, DeclarationId, DispatchSide, FieldId, SourceSiteId};'
          flow_new_import = 'use crate::identity::{CallableId, CallableParameterId, DeclarationId, DispatchSide, FieldId, SourceSiteId};'
          if flow_old_import in flow:
              flow = flow.replace(flow_old_import, flow_new_import, 1)
          elif flow_new_import not in flow:
              raise SystemExit('flow identity import shape changed')

          flow = flow.replace('call.transfer_target\n                .selector\n                .slots', 'call.target\n                .selector\n                .slots')
          flow = flow.replace('call\n                .transfer_target\n                .selector\n                .slots', 'call\n                .target\n                .selector\n                .slots')
          old_slot = 'let slot = AdvisoryParameterSlot::new(call.transfer_target.clone(), index as u32);'
          new_slot = 'let slot = CallableParameterId::new(call.target.clone(), index as u32);'
          if old_slot in flow:
              flow = flow.replace(old_slot, new_slot, 1)
          elif new_slot not in flow:
              raise SystemExit('call contribution slot construction shape changed')
          if 'call.transfer_target\n                .selector\n                .slots' in flow or 'call\n                .transfer_target\n                .selector\n                .slots' in flow:
              raise SystemExit('transfer-target selector reconstruction remains')
          flow_path.write_text(flow)

          session_path = Path('phalcom-semantic/src/session.rs')
          session = session_path.read_text()

          old_seed = '''                let mut seed_bindings = BTreeMap::new();
                for binding in callable_parameter_bindings(scope_index, &analysis.callable) {
                    let index = seed_bindings.len() as u32;
                    let slot = AdvisoryParameterSlot::new(analysis.callable.clone(), index);
                    let fact = parameter_facts
                        .get(&slot)
                        .cloned()
                        .unwrap_or_else(|| AdvisoryFact::unknown().derive(AdvisoryConfidence::Flow, AdvisoryOrigin::Binding(binding.declaration_site.clone())));
                    seed_bindings.insert(binding.declaration_site.clone(), fact);
                }
'''
          new_seed = '''                let mut seed_bindings = BTreeMap::new();
                for (parameter, binding) in callable_parameter_bindings(scope_index, analysis) {
                    let fact = parameter_facts
                        .get(parameter)
                        .cloned()
                        .unwrap_or_else(|| AdvisoryFact::unknown().derive(AdvisoryConfidence::Flow, AdvisoryOrigin::Binding(binding.declaration_site.clone())));
                    seed_bindings.insert(binding.declaration_site.clone(), fact);
                }
'''
          if old_seed in session:
              session = session.replace(old_seed, new_seed, 1)
          elif new_seed not in session:
              raise SystemExit('seed parameter reconstruction shape changed')

          old_summary = '''                let mut summary_parameters = Vec::new();
                for (index, binding) in callable_parameter_bindings(scope_index, &analysis.callable).into_iter().enumerate() {
                    let slot = AdvisoryParameterSlot::new(analysis.callable.clone(), index as u32);
                    let fact = parameter_facts
                        .get(&slot)
                        .cloned()
                        .or_else(|| bindings.get(&binding.declaration_site).cloned())
                        .unwrap_or_else(AdvisoryFact::unknown);
                    parameters.insert(slot.clone(), fact.clone());
                    summary_parameters.push((slot, fact));
                }
'''
          new_summary = '''                let mut summary_parameters = Vec::new();
                for (parameter, binding) in callable_parameter_bindings(scope_index, analysis) {
                    let fact = parameter_facts
                        .get(parameter)
                        .cloned()
                        .or_else(|| bindings.get(&binding.declaration_site).cloned())
                        .unwrap_or_else(AdvisoryFact::unknown);
                    parameters.insert(parameter.clone(), fact.clone());
                    summary_parameters.push((parameter.clone(), fact));
                }
'''
          if old_summary in session:
              session = session.replace(old_summary, new_summary, 1)
          elif new_summary not in session:
              raise SystemExit('summary parameter reconstruction shape changed')

          old_solver = '''            let own_parameters = next_parameter_facts
                .iter()
                .filter(|(slot, _)| slot.callable == *callable)
                .map(|(slot, fact)| (slot.clone(), fact.clone()))
                .collect::<BTreeMap<_, _>>();
'''
          new_solver = '''            let own_parameter_ids = summary.parameters.iter().map(|(parameter, _)| parameter.clone()).collect::<BTreeSet<_>>();
            let own_parameters = next_parameter_facts
                .iter()
                .filter(|(parameter, _)| own_parameter_ids.contains(*parameter))
                .map(|(parameter, fact)| (parameter.clone(), fact.clone()))
                .collect::<BTreeMap<_, _>>();
'''
          if old_solver in session:
              session = session.replace(old_solver, new_solver, 1)
          elif new_solver not in session:
              raise SystemExit('solver parameter ownership shape changed')

          old_helper = '''fn callable_parameter_bindings<'a>(
    scope_index: &'a crate::source_index::SourceScopeIndex,
    callable: &CallableId,
) -> Vec<&'a crate::source_index::SourceBindingInfo> {
    let mut bindings = scope_index
        .bindings
        .values()
        .filter(|binding| {
            binding.declaration_site.owner == SourceOwner::Callable(callable.clone())
                && matches!(
                    binding.kind,
                    crate::source_index::SourceBindingKind::MethodParameter
                        | crate::source_index::SourceBindingKind::SetterParameter
                        | crate::source_index::SourceBindingKind::IndexParameter
                )
        })
        .collect::<Vec<_>>();
    bindings.sort_by_key(|binding| (binding.declaration_range.start, binding.declaration_range.end));
    bindings
}
'''
          new_helper = '''fn callable_parameter_bindings<'a>(
    scope_index: &'a crate::source_index::SourceScopeIndex,
    analysis: &'a crate::checker::CallableAnalysis,
) -> Vec<(&'a crate::identity::CallableParameterId, &'a crate::source_index::SourceBindingInfo)> {
    let mut bindings = analysis
        .bindings
        .values()
        .filter_map(|binding| {
            let parameter = binding.parameter.as_ref()?;
            let callable_source = scope_index.callable_sources.get(&parameter.callable)?;
            let site = callable_source.parameter_sites.get(parameter)?;
            let source_binding = scope_index.bindings.get(site)?;
            Some((parameter, source_binding))
        })
        .collect::<Vec<_>>();
    bindings.sort_by_key(|(parameter, _)| parameter.index);
    bindings
}
'''
          if old_helper in session:
              session = session.replace(old_helper, new_helper, 1)
          elif new_helper not in session:
              raise SystemExit('callable parameter helper shape changed')

          forbidden = [
              'callable_parameter_bindings(scope_index, &analysis.callable)',
              'bindings.sort_by_key(|binding| (binding.declaration_range.start, binding.declaration_range.end))',
              'AdvisoryParameterSlot::new(analysis.callable.clone()',
          ]
          for needle in forbidden:
              if needle in session:
                  raise SystemExit(f'transitional parameter reconstruction remains: {needle}')
          session_path.write_text(session)
          PY
      - name: Format
        run: cargo +stable fmt --all
      - name: Focused canonical parameter regressions
        run: |
          cargo test -p phalcom-semantic --test semantic canonical_parameter_advisory::advisory_parameter_contributions_use_canonical_parameter_identity -- --exact
          cargo test -p phalcom-semantic --test semantic canonical_parameter_advisory::constructor_argument_transfer_uses_public_canonical_parameter_identity -- --exact
      - name: Full semantic gate
        run: cargo test -p phalcom-semantic --test semantic
      - name: Diff integrity
        run: git diff --check
      - name: Commit Phase 3 routing
        run: |
          if git diff --quiet -- phalcom-semantic/src/advisory/flow.rs phalcom-semantic/src/session.rs; then
            echo 'Phase 3 routing already applied'
            exit 0
          fi
          git config user.name phalcom-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add phalcom-semantic/src/advisory/flow.rs phalcom-semantic/src/session.rs
          git commit -m 'refactor(semantic): route advisory parameters by canonical identity'
          git push origin HEAD:codex/canonical-declaration-knowledge
