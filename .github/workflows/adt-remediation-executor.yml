name: ADT Remediation Executor

on:
  push:
    branches:
      - fix/adt-remediation-completion

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/adt-remediation-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused ADT tests
        shell: bash
        run: |
          mkdir -p .adt-debug
          {
            rustc +stable --version --verbose
            cargo +stable --version --verbose
            printf 'RUSTFLAGS=%q\n' "$RUSTFLAGS"
          } 2>&1 | tee .adt-debug/environment.txt

          set +e
          cargo +stable test -p phalcom-core --test core adt -- --list 2>&1 | tee .adt-debug/core-adt-list.txt
          list_status=${PIPESTATUS[0]}
          cargo +stable test -p phalcom-core --test core adt 2>&1 | tee .adt-debug/core-adt.txt
          status=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$list_status" > .adt-debug/core-adt-list.status
          printf '%s\n' "$status" > .adt-debug/core-adt.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .adt-debug
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture focused ADT diagnostics"
            git push origin HEAD:fix/adt-remediation-completion
          fi
          exit "$status"
