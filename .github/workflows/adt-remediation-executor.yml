name: ADT Remediation Executor

on:
  push:
    branches:
      - fix/adt-remediation-completion

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adt-remediation-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused ADT tests
        shell: bash
        run: |
          mkdir -p .adt-debug
          set +e
          cargo +stable test -p phalcom-core --test core adt > .adt-debug/core-adt.txt 2>&1
          status=$?
          set -e
          cat .adt-debug/core-adt.txt
          printf '%s\n' "$status" > .adt-debug/core-adt.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .adt-debug/core-adt.txt .adt-debug/core-adt.status
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture focused ADT test failure"
            git push origin HEAD:fix/adt-remediation-completion
          fi
          exit "$status"
