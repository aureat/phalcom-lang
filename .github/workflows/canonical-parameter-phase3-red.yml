name: Canonical Parameter Phase 3 RED

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge-phase3-red

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run canonical parameter advisory regression
        run: cargo test -p phalcom-semantic --test semantic canonical_parameter_advisory::advisory_parameter_contributions_use_canonical_parameter_identity -- --exact
