name: Branch Cleanup Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded branches
        run: |
          set -euo pipefail
          for branch in \
            codex/canonical-declaration-knowledge \
            codex/canonical-declaration-knowledge-phase3-constructor-red \
            codex/canonical-declaration-knowledge-phase3-red \
            codex/canonical-declaration-knowledge-phase4-red \
            codex/lsp-single-world-retirement
          do
            git push origin --delete "$branch"
          done
      - name: Verify cleanup
        run: |
          set -euo pipefail
          remaining="$(git ls-remote --heads origin 'refs/heads/codex/*')"
          test -z "$remaining" || { echo "$remaining"; exit 1; }
