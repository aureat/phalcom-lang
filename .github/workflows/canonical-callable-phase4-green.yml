name: Canonical Callable Phase 4 GREEN

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - name: Repair Phase 4 transformation guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/canonical_callable_phase4.py')
          text = path.read_text()
          old = '''if text.count("callable_signatures.get_for_body") < 4:
              raise SystemExit("canonical body-signature lookup not installed at all intended authority sites")
          '''
          new = '''required_after = {
              "field lifecycle constructor authority": "callable_signatures\\n                                                            .get_for_body(&analysis.callable)",
              "advisory formal return authority": "let fact = callable_signatures\\n            .get_for_body(&analysis.callable)",
              "inferred return authority": "let signature = callable_signatures.get_for_body(callable)?;",
              "body recheck authority": "let declared_signature = callable_signatures\\n                        .get_for_body(&callable)",
          }
          for label, snippet in required_after.items():
              if snippet not in text:
                  raise SystemExit(f"missing canonical authority site: {label}")
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Phase 4 transformation guard shape changed')
          path.write_text(text)
          PY
      - name: Apply canonical callable authority cut
        run: python3 .github/scripts/canonical_callable_phase4.py
      - name: Canonicalize synthetic core constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"{label} shape changed")

          sig_path = Path('phalcom-semantic/src/checker/declaration_signature.rs')
          sig = sig_path.read_text()
          anchor = '''pub(crate) fn semantic_signature_for_member(ctx: &mut CheckingContext<'_>, owner: &DeclarationId, member: &ClassMember) -> Option<CallableSemanticSignature> {
          '''
          helper = '''/// Canonical declaration for the root `Class.new()` allocator behavior.
          ///
          /// The member is inherited by class objects through ordinary instance-side
          /// dispatch on `Class`; its constructor result is receiver-specialized `Self`.
          /// Standalone checker contexts project this declaration into dispatch, while
          /// workspace sessions also retain it in `CallableSignatureTable`.
          pub(crate) fn canonical_core_class_new_signature(store: &mut crate::types::store::TypeStore) -> CallableSemanticSignature {
              let owner = DeclarationId::new(crate::identity::ModuleId::core(), "Class".into());
              let selector = Selector::method("new", Vec::new()).expect("root Class.new selector must be valid");
              let callable = CallableId::new(owner.clone(), selector.clone(), DispatchSide::Instance);
              let self_type = store.self_type(crate::types::parameter::SelfTypeTerm {
                  owner: owner.clone(),
                  side: DispatchSide::Instance,
                  role: crate::types::parameter::SelfRole::InstanceType,
              });
              let knowledge = TypeKnowledge::established(self_type, EvidenceOrigin::ConstructorSemantics);
              CallableSemanticSignature {
                  callable,
                  owner,
                  side: DispatchSide::Instance,
                  selector,
                  generics: None,
                  parameters: Vec::<CallableParameterSemantic>::new().into_boxed_slice(),
                  declared_return: DeclaredTypeFact::from_knowledge_with_basis(&knowledge, DeclaredTypeBasis::ConstructorSemantics),
                  inferred_return: None,
                  source: None,
                  implementation: phalcom_native_meta::ImplementationKind::Generated,
                  native_id: None,
                  effects: phalcom_native_meta::EffectSpec::Unknown,
                  raises: phalcom_native_meta::RaisesSpec::Unknown,
                  flow: phalcom_native_meta::ReturnFlowSpec::Value,
                  lifecycle: phalcom_native_meta::NativeLifecycleSpec::UNKNOWN,
              }
          }

          ''' + anchor
          sig = replace_once(sig, anchor, helper, 'core Class.new canonical helper')
          sig_path.write_text(sig)

          ctx_path = Path('phalcom-semantic/src/checker/context.rs')
          ctx = ctx_path.read_text()
          old = '''    if let Ok(selector) = Selector::method("new", Vec::new())
              && class_surface.instance.get_callable(&selector).is_none()
          {
              let self_type = store.self_type(SelfTypeTerm {
                  owner: class.clone(),
                  side: DispatchSide::Instance,
                  role: SelfRole::InstanceType,
              });
              let signature = CallableSignature::new(
                  selector,
                  Vec::new(),
                  TypeKnowledge::established(self_type, EvidenceOrigin::ConstructorSemantics),
              )
              .with_kind(CallableSemanticKind::Constructor);
              class_surface.add_callable(DispatchSide::Instance, signature);
          }
          '''
          # The source is rustfmt-formatted; preserve its continuation indentation exactly.
          old = old.replace('              &&', '        &&').replace('          {', '    {').replace('              let', '        let').replace('                  owner', '            owner').replace('                  side', '            side').replace('                  role', '            role').replace('              });', '        });').replace('                  selector', '            selector').replace('                  Vec::new()', '            Vec::new()').replace('                  TypeKnowledge', '            TypeKnowledge').replace('              )', '        )').replace('              .with_kind', '        .with_kind').replace('              class_surface', '        class_surface').replace('          }', '    }')
          new = '''    let canonical_new = crate::checker::declaration_signature::canonical_core_class_new_signature(store);
          if class_surface.instance.get_callable(&canonical_new.selector).is_none() {
              class_surface.add_callable(
                  DispatchSide::Instance,
                  crate::checker::declaration_signature::project_semantic_signature(&canonical_new),
              );
          }
          '''
          new = new.replace('          if', '    if').replace('              class_surface', '        class_surface').replace('                  DispatchSide', '            DispatchSide').replace('                  crate::checker', '            crate::checker').replace('              );', '        );').replace('          }', '    }')
          ctx = replace_once(ctx, old, new, 'core Class.new dispatch projection')
          ctx_path.write_text(ctx)

          session_path = Path('phalcom-semantic/src/session.rs')
          session = session_path.read_text()
          old = '''        let mut base_callable_signatures = CallableSignatureTable::new();
          for (_, signature) in native_report.callable_signatures {
              base_callable_signatures.insert(signature);
          }
          '''
          old = old.replace('          for', '        for').replace('              base', '            base').replace('          }', '        }')
          new = '''        let mut base_callable_signatures = CallableSignatureTable::new();
          for (_, signature) in native_report.callable_signatures {
              base_callable_signatures.insert(signature);
          }
          let core_class_new = crate::checker::declaration_signature::canonical_core_class_new_signature(&mut store);
          if base_callable_signatures.get(&core_class_new.callable).is_none() {
              base_callable_signatures.insert(core_class_new);
          }
          '''
          new = new.replace('          for', '        for').replace('              base_callable_signatures.insert(signature)', '            base_callable_signatures.insert(signature)').replace('          }', '        }').replace('          let core', '        let core').replace('          if base', '        if base').replace('              base_callable_signatures.insert(core', '            base_callable_signatures.insert(core')
          session = replace_once(session, old, new, 'workspace core Class.new canonical seed')
          session = session.replace(', advisory_fact_from_formal,', ',')
          session = session.replace('use crate::types::evidence::TypeKnowledge;\n', '')
          session_path.write_text(session)
          PY
      - name: Format
        run: cargo +nightly-2026-07-10 fmt --all
      - name: Guard changed production surface
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(phalcom-semantic/src/(session.rs|checker/(context.rs|declaration_signature.rs))|\.github/scripts/canonical_callable_phase4.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Focused callable authority regression
        run: cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic semantic::incremental::declaration_authority::advisory_and_return_refresh_read_canonical_signatures_not_dispatch_surfaces -- --exact
      - name: Preserve constructor parameter routing
        run: cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic canonical_parameter_advisory::constructor_argument_transfer_uses_public_canonical_parameter_identity -- --exact
      - name: Preserve inherited root constructor advisory shape
        run: |
          cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic constructor_factory_probe::constructorless_class_inherits_canonical_class_new -- --exact
          cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic constructor_factory_probe::constructorless_class_inherits_core_class_new_from_resolved_module -- --exact
          cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic constructor_factory_probe::advisory_inherited_call_publishes_defining_callable_target -- --exact
      - name: Full semantic gate
        run: cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic
      - name: Diff integrity
        run: git diff --check
      - name: Commit Phase 4 authority cut
        run: |
          if git diff --quiet -- phalcom-semantic/src/session.rs phalcom-semantic/src/checker/context.rs phalcom-semantic/src/checker/declaration_signature.rs .github/scripts/canonical_callable_phase4.py; then
            echo 'Phase 4 authority cut already applied'
            exit 0
          fi
          git config user.name phalcom-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add phalcom-semantic/src/session.rs phalcom-semantic/src/checker/context.rs phalcom-semantic/src/checker/declaration_signature.rs .github/scripts/canonical_callable_phase4.py
          git commit -m 'refactor(semantic): make callable signatures authoritative'
          git push origin HEAD:codex/canonical-declaration-knowledge
