name: Core presentation provenance probe

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: core-presentation-provenance-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Publish compiler-owned core presentation provenance
        run: |
          python3 .github/scripts/apply-core-presentation-provenance.py
          cargo +stable fmt --all
          git diff --check

      - name: Check semantic library
        run: cargo check -p phalcom-semantic --lib

      - name: Canonical annotation target stays green
        run: cargo test -p phalcom-semantic --test semantic builtin_type_annotation_has_canonical_target -- --nocapture

      - name: Canonical builtin definition provenance
        run: cargo test -p phalcom-semantic --test semantic builtin_declaration_has_canonical_definition_site -- --nocapture

      - name: Commit validated core presentation provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-semantic/src/core_surface/presentation.rs phalcom-semantic/src/snapshot.rs phalcom-semantic/src/session.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(semantic): publish core presentation provenance"
          git push origin HEAD:codex/lsp-single-world-retirement
