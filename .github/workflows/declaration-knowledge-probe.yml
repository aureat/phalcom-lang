name: Declaration Knowledge Probe

on:
  push:
    branches: [codex/canonical-declaration-knowledge]

permissions:
  contents: write

jobs:
  semantic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply declaration authority patch
        run: python .github/apply-declaration-knowledge-phase-a.py
      - name: Format
        run: cargo +stable fmt --all
      - name: Check semantic crate
        env:
          RUSTFLAGS: ""
        run: cargo +stable check -p phalcom-semantic
      - name: Focused declaration knowledge regression
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic --test semantic semantic::integration::declaration_knowledge::partial_callable_signature_survives_unknown_return -- --exact --nocapture
      - name: Commit validated phase
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-semantic
          git commit -m "feat(semantic): represent partial declaration knowledge"
          git push origin HEAD:codex/canonical-declaration-knowledge
