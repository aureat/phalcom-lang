name: C4 P3 Focused

on:
  push:
    branches:
      - agent/c4-p3-complex-closure-7

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""
  RUSTC_WRAPPER: ""

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
      - name: Existing data lowering control
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::data_e2e::data_labeled_tuple_construction_and_access -- --nocapture
      - name: Trait data witness regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_default_executes_abstract_getter_satisfied_by_data_component -- --nocapture
      - name: Nested trait default environment regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::nested_trait_defaults_preserve_conformance_environment -- --nocapture
      - name: Inherent trait witness regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_default_executes_abstract_getter_satisfied_by_inherent_member -- --nocapture
      - name: Inherited trait witness regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_default_executes_abstract_getter_satisfied_by_inherited_member -- --nocapture
      - name: Generic trait default regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::generic_trait_default_dispatches_nested_abstract_method_calls -- --nocapture
