name: Editor Type Hints RED

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
      - uses: dtolnay/rust-toolchain@stable
      - name: Semantic ownership RED
        run: RUSTFLAGS="" cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::declaration_authority::editor_type_hint_eligibility_is_compiler_owned -- --exact
      - name: LSP boundary RED
        if: always()
        run: RUSTFLAGS="" cargo +stable test -p phalcom-lsp --test semantic_boundary inlay_hints_do_not_reimplement_annotation_semantics -- --exact
