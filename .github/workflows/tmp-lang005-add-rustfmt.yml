name: LANG005 staging harness repair

on:
  push:
    branches:
      - audit/lang005-c1-completion

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/lang005-c1-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt
      - name: Apply stored narrow completion patch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; import re,base64; s=Path(".github/workflows/tmp-lang005-c1-source-index-fix.yml").read_text(); m=re.search(r"run: echo '\''([^'\'']+)'\'' \\| base64 -d \\| python3", s); assert m; exec(compile(base64.b64decode(m.group(1)), "<lang005-patch>", "exec"))'
      - name: Format
        run: cargo +nightly-2026-07-10 fmt --all
      - name: Verify focused semantic regression
        run: cargo +nightly-2026-07-10 test -p phalcom-semantic --test semantic data_component_projection_uses_canonical_component_target -- --nocapture
      - name: Verify REPL alias regression
        run: cargo +nightly-2026-07-10 test -p phalcom-repl --test repl_imports repl_si_02_selective_import_alias_rebinds -- --nocapture
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phalcom-repl/tests/repl_imports.rs phalcom-semantic/src/source_index/mod.rs phalcom-semantic/tests/semantic/integration/source_index.rs
          git commit -m "fix(semantic): project data component source identity"
          for attempt in 1 2 3; do
            if git push origin HEAD:audit/lang005-c1-completion; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
