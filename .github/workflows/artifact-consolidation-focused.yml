name: Artifact consolidation focused verification

on:
  push:
    branches:
      - feat/artifact-universe-consolidation
    paths:
      - "phalcom-semantic/**"
      - "phalcom-compiler-artifact/**"
      - "phalcom-modules/**"
      - "phalcom-core/**"
      - "packages/universe/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/artifact-consolidation-focused.yml"

permissions:
  contents: read

concurrency:
  group: artifact-consolidation-focused-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""
  RUSTC_WRAPPER: ""

jobs:
  semantic-session:
    name: Semantic image/session boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
      - name: Check semantic library
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          check -p phalcom-semantic --lib
      - name: Check semantic integration target
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          check -p phalcom-semantic --test semantic
      - name: Imported-image local-overlay regression
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-semantic --test semantic
          ordinary_image_session
          -- --nocapture
      - name: Image-backed rollback and fail-closed unit gates
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-semantic --lib
          session::publication_tests::image_backed
          -- --nocapture
      - name: Canonical query root policy and closure gates
        run: |
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --lib artifact::query_policy::tests -- --nocapture
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --lib artifact::export::query_export_required_root_tests -- --nocapture
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --lib canonical_image::tests::required_query_profile_roots_are_canonical_immutable_leaves -- --exact --nocapture
      - name: Semantic artifact gates
        run: |
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test semantic-artifact
          cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-semantic --test artifact_query_import_test
      - name: Compiler artifact round trips
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          test -p phalcom-compiler-artifact --test round_trip_test


  universe-cli-smoke:
    name: Bounded migrated-Universe CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build phalcom CLI
        run: >-
          cargo +nightly-2026-07-10
          --config 'build.rustc-wrapper=""'
          build -p phalcom-core --bin phalcom
      - name: Run migrated Universe under hard memory and wall-clock bounds
        shell: bash
        run: |
          cat > /tmp/phalcom-universe-smoke.ph <<'EOF'
          let r = Some(3).map(|x| x + 1)
          print(r)
          EOF

          # The historical regression rose from baseline (~1.8 GiB) to >5 GiB.
          # Cap address space before launching the CLI so a recurrence fails closed.
          ulimit -v 4194304
          set +e
          /usr/bin/time -v /usr/bin/timeout --kill-after=5s 300s \
            target/debug/phalcom /tmp/phalcom-universe-smoke.ph \
            > /tmp/phalcom-universe-smoke.stdout \
            2> /tmp/phalcom-universe-smoke.stderr
          status=$?
          set -e

          cat /tmp/phalcom-universe-smoke.stderr
          test "$status" -eq 70
          grep -F "undefined variable 'print'" /tmp/phalcom-universe-smoke.stderr
