name: Semantic authority target

on:
  pull_request:
    paths:
      - "phalcom-semantic/**"
      - ".github/workflows/semantic-authority-target.yml"

jobs:
  semantic-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run semantic authority composition tests
        run: cargo test -p phalcom-semantic --test semantic_authority_composition -- --nocapture
