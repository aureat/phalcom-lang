name: Editor Type Hints GREEN

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply candidate
        run: |
          python3 .github/scripts/editor_type_hints_apply.py
          python3 .github/scripts/editor_type_hints_fix.py
      - name: Format candidate
        run: cargo +stable fmt --all
      - name: Semantic ownership regression
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic --test semantic semantic::incremental::declaration_authority::editor_type_hint_eligibility_is_compiler_owned -- --exact
      - name: Source annotation metadata
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic --test semantic semantic::integration::editor_type_hints::source_index_retains_explicit_annotation_truth -- --exact
      - name: Compiler editor hint behavior
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic --test semantic semantic::integration::editor_type_hints::editor_type_hints_suppress_explicit_local_annotations -- --exact
      - name: Check semantic crate
        env:
          RUSTFLAGS: ""
        run: cargo +stable check -p phalcom-semantic
      - name: LSP architecture boundary
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-lsp --test semantic_boundary inlay_hints_do_not_reimplement_annotation_semantics -- --exact
      - name: Check LSP crate
        env:
          RUSTFLAGS: ""
        run: cargo +stable check -p phalcom-lsp
      - name: Focused LSP inlay tests
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-lsp --test integration inlay_hints:: -- --nocapture
      - name: Full semantic suite
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic
      - name: Full LSP integration suite
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-lsp --test integration
      - name: Diff check
        run: git diff --check
