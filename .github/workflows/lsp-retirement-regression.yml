name: LSP retirement regression

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/phalcom-lsp-retirement-target

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source-identity callable hover repair
        run: python .github/scripts/apply-optional-callable-hover-signature.py
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Compile semantic and LSP
        run: |
          cargo check -p phalcom-semantic
          cargo check -p phalcom-lsp --lib
      - name: Validate untyped source callable hover
        run: |
          cargo test -p phalcom-lsp --test integration stage4_hover::selector_hover_sets_range_to_the_resolved_selector_span -- --nocapture
          cargo test -p phalcom-lsp --test integration stage4_hover::phaldoc_adjacency_attaches_and_blank_line_breaks_it -- --nocapture
          cargo test -p phalcom-lsp --test integration stage4_hover::selector_keying_gives_each_arity_its_own_doc -- --nocapture
          cargo test -p phalcom-lsp --test integration stage4_hover::cross_file_hover_resolves_the_doc_from_the_declaring_file -- --nocapture
      - name: Revalidate authoritative hover targets
        run: |
          cargo test -p phalcom-lsp --test integration inherited_hover_reports_the_defining_owner_not_the_receiver_class -- --nocapture
          cargo test -p phalcom-lsp --test integration receiver_qualified_hover_selects_one_of_repeated_new_members -- --nocapture
      - name: Commit validated source-identity hover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-lsp/src/backend.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lsp): render source callables without proven signatures'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
