name: LSP retirement regression

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: read

concurrency:
  group: lsp-retirement-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check semantic library
        run: cargo check -p phalcom-semantic --lib
      - name: Check LSP library
        run: cargo check -p phalcom-lsp --lib
      - name: Inherited allocator semantic regression
        run: cargo test -p phalcom-semantic --test constructor_factory_probe constructorless_class_inherits_core_class_new_from_resolved_module -- --nocapture
      - name: Inherited allocator inlay regression
        run: cargo test -p phalcom-lsp --test integration stable_runtime_shapes_are_exposed_as_inlay_hints -- --nocapture
