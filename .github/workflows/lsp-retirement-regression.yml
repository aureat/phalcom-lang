name: LSP retirement regression

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply advisory target publication candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          analyzer = 'phalcom-semantic/src/advisory/analyzer.rs'
          replace_once(
              analyzer,
              '    /// Exact call expression range.\n    pub range: SourceRange,',
              '    /// Exact source range of the written selector/name token, when present.\n    pub target_range: Option<SourceRange>,\n    /// Exact call expression range.\n    pub range: SourceRange,',
          )
          replace_once(
              analyzer,
              '            resolved_call_or_unknown_with_shape(call.range, &receiver.shape, &call.method, &call.args, &arguments, context)',
              '            resolved_call_or_unknown_with_shape(\n                call.range,\n                call.method_range,\n                &receiver.shape,\n                &call.method,\n                &call.args,\n                &arguments,\n                context,\n            )',
          )
          replace_once(
              analyzer,
              '            resolved_call_or_unknown_with_arguments(call.range, &arguments, context)',
              '            resolved_call_or_unknown_with_arguments_at(call.range, call.name_range, &arguments, context)',
          )
          replace_once(
              analyzer,
              '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range) else {\n        return unknown_at(context, range);\n    };\n    resolved_callable_fact(callable, None, range, arguments, context)\n}\n''',
              '''fn resolved_call_or_unknown_with_arguments(range: SourceRange, arguments: &[AdvisoryCallArgument], context: &AdvisoryExpressionContext<'_>) -> AdvisoryFact {\n    resolved_call_or_unknown_with_arguments_at(range, None, arguments, context)\n}\n\nfn resolved_call_or_unknown_with_arguments_at(\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    arguments: &[AdvisoryCallArgument],\n    context: &AdvisoryExpressionContext<'_>,\n) -> AdvisoryFact {\n    let Some(callable) = (context.resolved_callable_for_range)(range) else {\n        return unknown_at(context, range);\n    };\n    resolved_callable_fact(callable, None, range, target_range, arguments, context)\n}\n''',
          )
          replace_once(
              analyzer,
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    receiver: &ValueShape,''',
              '''fn resolved_call_or_unknown_with_shape(\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    receiver: &ValueShape,''',
          )
          replace_once(
              analyzer,
              '    resolved_callable_fact(callable, Some(receiver), range, arguments, context)',
              '    resolved_callable_fact(callable, Some(receiver), range, target_range, arguments, context)',
          )
          replace_once(
              analyzer,
              '''fn resolved_callable_fact(\n    callable: CallableId,\n    receiver: Option<&ValueShape>,\n    range: SourceRange,\n    arguments: &[AdvisoryCallArgument],''',
              '''fn resolved_callable_fact(\n    callable: CallableId,\n    receiver: Option<&ValueShape>,\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    arguments: &[AdvisoryCallArgument],''',
          )
          replace_once(
              analyzer,
              '    observe_call(callable.clone(), transfer_target.clone(), range, arguments, context);',
              '    observe_call(callable.clone(), transfer_target.clone(), range, target_range, arguments, context);',
          )
          replace_once(
              analyzer,
              '''fn observe_call(\n    target: CallableId,\n    transfer_target: CallableId,\n    range: SourceRange,\n    arguments: &[AdvisoryCallArgument],''',
              '''fn observe_call(\n    target: CallableId,\n    transfer_target: CallableId,\n    range: SourceRange,\n    target_range: Option<SourceRange>,\n    arguments: &[AdvisoryCallArgument],''',
          )
          replace_once(
              analyzer,
              '''        observer(AdvisoryCallObservation {\n            target,\n            transfer_target,\n            range,''',
              '''        observer(AdvisoryCallObservation {\n            target,\n            transfer_target,\n            target_range,\n            range,''',
          )

          flow = 'phalcom-semantic/src/advisory/flow.rs'
          replace_once(
              flow,
              '    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,',
              '    /// Canonical call targets keyed by the exact selector/name source range.\n    pub call_targets: Vec<(SourceRange, CallableId)>,\n    /// Parameter facts contributed by resolved call sites in this traversal.\n    pub parameter_contributions: BTreeMap<AdvisoryParameterSlot, AdvisoryFact>,',
          )
          replace_once(
              flow,
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    let mut positional = 0;''',
              '''fn record_call_contributions(product: &mut AdvisoryFlowProduct, context: &AdvisoryFlowContext<'_>, call: AdvisoryCallObservation) {\n    if let Some(range) = call.target_range {\n        product.call_targets.push((range, call.target.clone()));\n    }\n    let mut positional = 0;''',
          )

          session = 'phalcom-semantic/src/session.rs'
          replace_once(
              session,
              '''            let mut member_bodies = BTreeMap::new();''',
              '''            let target_site_for_range = |range: SourceRange| {\n                let candidates = module_index\n                    .occurrences\n                    .all()\n                    .iter()\n                    .filter(|occurrence| occurrence.range == range)\n                    .map(|occurrence| occurrence.site.clone())\n                    .collect::<Vec<_>>();\n                (candidates.len() == 1).then(|| candidates[0].clone())\n            };\n\n            let mut member_bodies = BTreeMap::new();''',
          )
          replace_once(
              session,
              '''                expressions.extend(flow.expressions);\n                bindings.extend(flow.bindings);''',
              '''                for (range, callable) in &flow.call_targets {\n                    if let Some(site) = target_site_for_range(*range) {\n                        let target = SemanticTargetId::Callable(callable.clone());\n                        targets\n                            .entry(site.clone())\n                            .or_insert_with(|| advisory_target_resolution(&site, &target));\n                    }\n                }\n                expressions.extend(flow.expressions);\n                bindings.extend(flow.bindings);''',
          )
          replace_once(
              session,
              '''            expressions.extend(top_level.expressions);\n            bindings.extend(top_level.bindings);''',
              '''            for (range, callable) in &top_level.call_targets {\n                if let Some(site) = target_site_for_range(*range) {\n                    let target = SemanticTargetId::Callable(callable.clone());\n                    targets\n                        .entry(site.clone())\n                        .or_insert_with(|| advisory_target_resolution(&site, &target));\n                }\n            }\n            expressions.extend(top_level.expressions);\n            bindings.extend(top_level.bindings);''',
          )

          test = Path('phalcom-semantic/tests/constructor_factory_probe.rs')
          text = test.read_text()
          marker = '\nfn builtin_annotation_snapshot()'
          if marker not in text:
              raise SystemExit('constructor probe insertion marker missing')
          new_test = r'''

#[test]
fn advisory_inherited_call_publishes_defining_callable_target() {
    let module = ModuleId::core();
    let source: Arc<str> = Arc::from(
        r#"
class Animal {
  speak() {}
}

class Dog is Animal {}

const dog = Dog.new()
dog.speak()
"#,
    );
    let parsed = phalcom_ast::parse(&source, 0);
    assert!(parsed.errors.is_empty(), "parse errors: {:#?}", parsed.errors);
    let snapshot = analyze_single_module(module.clone(), source.clone(), Arc::new(parsed.program)).snapshot;

    let animal = DeclarationId::new(module.clone(), "Animal".into());
    let speak = CallableId::new(
        animal,
        Selector::method("speak", Vec::new()).unwrap(),
        DispatchSide::Instance,
    );
    let selector_offset = source.rfind("speak()").expect("call-site speak") + 1;
    assert_eq!(
        snapshot.editor().target_at(&module, selector_offset),
        Some(SemanticTargetId::Callable(speak)),
        "advisory dispatch must publish the canonical defining callable at the selector occurrence"
    );
}
'''
          test.write_text(text.replace(marker, new_test + marker, 1))
          PY
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Compile semantic and LSP
        run: |
          cargo check -p phalcom-semantic
          cargo check -p phalcom-lsp --lib
      - name: Validate compiler advisory target publication
        run: cargo test -p phalcom-semantic --test semantic advisory_inherited_call_publishes_defining_callable_target -- --nocapture
      - name: Validate inherited LSP hover
        run: cargo test -p phalcom-lsp --test integration inherited_hover_reports_the_defining_owner_not_the_receiver_class -- --nocapture
      - name: Revalidate constructor composition
        run: cargo test -p phalcom-lsp --test integration constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture
      - name: Commit validated advisory target publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-semantic/src/advisory/analyzer.rs \
                  phalcom-semantic/src/advisory/flow.rs \
                  phalcom-semantic/src/session.rs \
                  phalcom-semantic/tests/constructor_factory_probe.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(semantic): publish advisory callable targets'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
