name: LSP retirement regression

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply advisory target publication candidate
        run: python .github/scripts/apply-advisory-target-publication.py
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Compile semantic and LSP
        run: |
          cargo check -p phalcom-semantic
          cargo check -p phalcom-lsp --lib
      - name: Validate compiler advisory target publication
        run: cargo test -p phalcom-semantic --test semantic advisory_inherited_call_publishes_defining_callable_target -- --nocapture
      - name: Validate inherited LSP hover
        run: cargo test -p phalcom-lsp --test integration inherited_hover_reports_the_defining_owner_not_the_receiver_class -- --nocapture
      - name: Revalidate constructor composition
        run: cargo test -p phalcom-lsp --test integration constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture
      - name: Commit validated advisory target publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-semantic/src/advisory/analyzer.rs \
                  phalcom-semantic/src/advisory/flow.rs \
                  phalcom-semantic/src/session.rs \
                  phalcom-semantic/tests/constructor_factory_probe.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(semantic): publish advisory callable targets'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
