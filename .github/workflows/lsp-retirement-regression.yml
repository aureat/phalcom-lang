name: LSP retirement regression

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply semantic unification candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-lsp-retirement-semantic-unification.py')
          text = path.read_text()
          start = text.index('# Method-family lookup uses the same owner traversal.')
          end = text.index('# Pass new callbacks to field analysis and flow contexts.')
          path.write_text(text[:start] + text[end:])
          PY
          python .github/scripts/apply-lsp-retirement-semantic-unification.py
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Compile semantic and LSP
        run: |
          cargo check -p phalcom-semantic
          cargo check -p phalcom-lsp --lib
      - name: Validate inherited allocator semantics
        run: |
          cargo test -p phalcom-semantic --test semantic constructorless_class_inherits_canonical_class_new -- --nocapture
          cargo test -p phalcom-semantic --test semantic constructorless_class_inherits_core_class_new_from_resolved_module -- --nocapture
      - name: Validate constructor factory semantics
        run: |
          cargo test -p phalcom-semantic --test semantic constructor_factory_publishes_target_and_inferred_signature -- --nocapture
          cargo test -p phalcom-semantic --test semantic receiver_query_falls_back_to_authoritative_binding_fact -- --nocapture
      - name: Validate LSP constructor surfaces
        run: |
          cargo test -p phalcom-lsp --test integration stable_runtime_shapes_are_exposed_as_inlay_hints -- --nocapture
          cargo test -p phalcom-lsp --test integration constructor_factory_inference_is_authoritative_across_lsp_features -- --nocapture
      - name: Commit validated semantic unification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-semantic/src/dispatch.rs \
                  phalcom-semantic/src/checker/context.rs \
                  phalcom-semantic/src/advisory/formal.rs \
                  phalcom-semantic/src/advisory/mod.rs \
                  phalcom-semantic/src/advisory/analyzer.rs \
                  phalcom-semantic/src/advisory/flow.rs \
                  phalcom-semantic/src/session.rs \
                  phalcom-semantic/src/editor.rs
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(semantic): unify class-object dispatch and advisory Self'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
