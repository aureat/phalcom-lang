name: LSP retirement regression

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: write

concurrency:
  group: lsp-retirement-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/phalcom-lsp-retirement-target

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compiler-owned callable attachment ranges
        run: python .github/scripts/apply-callable-declaration-attribute-range.py
      - name: Format and diff check
        run: |
          cargo +stable fmt --all
          git diff --check
      - name: Compile semantic and LSP
        run: |
          cargo check -p phalcom-semantic
          cargo check -p phalcom-lsp --lib
      - name: Validate Phaldoc through attached attributes
        run: |
          cargo test -p phalcom-lsp --test integration stage4_hover::phaldoc_adjacency_survives_member_attributes -- --nocapture
          cargo test -p phalcom-lsp --test integration stage4_hover::phaldoc_adjacency_attaches_and_blank_line_breaks_it -- --nocapture
          cargo test -p phalcom-lsp --test integration stage4_hover::selector_keying_gives_each_arity_its_own_doc -- --nocapture
      - name: Revalidate source-index navigation
        run: |
          cargo test -p phalcom-semantic --test semantic source_index -- --nocapture
          cargo test -p phalcom-lsp --test integration receiver_qualified_hover_selects_one_of_repeated_new_members -- --nocapture
      - name: Commit validated callable attachment ranges
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-semantic/src/source_index/scope.rs phalcom-semantic/src/source_index/builder.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(semantic): include member attributes in declaration ranges'
            git push origin HEAD:codex/lsp-single-world-retirement
          fi
