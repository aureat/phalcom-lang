name: LSP retirement regression

on:
  push:
    branches: [codex/lsp-single-world-retirement]

permissions:
  contents: read

concurrency:
  group: lsp-retirement-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/phalcom-lsp-retirement-target

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lsp-single-world-retirement
      - name: Compile semantic and LSP
        run: |
          cargo check -p phalcom-semantic
          cargo check -p phalcom-lsp --lib
      - name: Run semantic retirement regressions
        run: cargo test -p phalcom-semantic --test semantic constructor_factory_probe -- --nocapture
      - name: Run complete LSP integration suite
        run: cargo test -p phalcom-lsp --test integration -- --nocapture
      - name: Run semantic authority boundary
        run: cargo test -p phalcom-lsp --test semantic_boundary -- --nocapture
