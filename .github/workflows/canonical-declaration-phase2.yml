name: Canonical Declaration Phase 2

on:
  push:
    branches:
      - codex/canonical-declaration-knowledge

permissions:
  contents: write

jobs:
  parameter-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-declaration-knowledge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add parameter identity regression
        shell: python
        run: |
          from pathlib import Path
          test = Path('phalcom-semantic/tests/semantic/integration/parameter_identity.rs')
          test.write_text(r'''use std::sync::Arc;

use phalcom_common::selector::{Selector, SelectorSlot};
use phalcom_modules::identity::ModuleId;
use phalcom_semantic::{CallableId, CallableParameterId, DeclarationId, DispatchSide, analyze_single_module};

#[test]
fn callable_parameter_identity_connects_signature_binding_and_source_site() {
    let module = ModuleId::core();
    let source: Arc<str> = Arc::from(
        r#"
class ParameterProbe {
    run(value: Int) -> Int {
        value
    }
}
"#,
    );
    let parsed = phalcom_ast::parse(&source, 0);
    assert!(parsed.errors.is_empty(), "fixture must parse: {:#?}", parsed.errors);

    let result = analyze_single_module(module.clone(), source, Arc::new(parsed.program));
    let owner = DeclarationId::new(module.clone(), "ParameterProbe".into());
    let callable = CallableId::new(
        owner,
        Selector::method("run", [SelectorSlot::Label("value".into())]).expect("selector"),
        DispatchSide::Instance,
    );
    let signature = result
        .snapshot
        .callable_signatures
        .get(&callable)
        .expect("canonical callable signature");
    let parameter = signature.parameters.first().expect("parameter");
    assert_eq!(parameter.id, CallableParameterId::new(callable.clone(), 0));

    let analysis = result
        .snapshot
        .callable_analyses
        .get(&callable)
        .expect("callable analysis");
    let binding = analysis
        .bindings
        .values()
        .find(|binding| binding.parameter.as_ref() == Some(&parameter.id))
        .expect("checker binding keeps canonical parameter identity");

    let module_index = result
        .snapshot
        .source_index
        .modules
        .get(&module)
        .expect("module source index");
    let source_info = module_index
        .structure
        .callable_sources
        .get(&callable)
        .expect("callable source info");
    let parameter_site = source_info
        .parameter_sites
        .get(&parameter.id)
        .expect("canonical parameter source site");
    assert_eq!(binding.range, module_index.structure.site(parameter_site).expect("parameter site").range);

    let attachment = module_index.attachments.get(&callable).expect("formal source attachment");
    assert_eq!(attachment.source_site_for_binding(binding.binding), Some(parameter_site));
}
''')
          mod_path = Path('phalcom-semantic/tests/semantic/integration/mod.rs')
          content = mod_path.read_text()
          if 'mod parameter_identity;' not in content:
              anchor = 'mod imported_resolution;\n'
              if anchor not in content:
                  raise SystemExit('integration module anchor missing')
              content = content.replace(anchor, anchor + 'mod parameter_identity;\n', 1)
              mod_path.write_text(content)
      - name: Verify RED
        shell: bash
        env:
          RUSTFLAGS: ""
        run: |
          set +e
          cargo +stable test -p phalcom-semantic --test semantic semantic::integration::parameter_identity::callable_parameter_identity_connects_signature_binding_and_source_site -- --exact > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "parameter identity regression unexpectedly passed before implementation"
            exit 1
          fi
          grep -Eq 'no field `parameter`|no field `parameter_sites`|unknown field' /tmp/red.log
      - name: Implement canonical parameter identity bridge
        shell: python
        run: |
          from pathlib import Path

          # Canonical source signatures retain exact parameter provenance.
          path = Path('phalcom-semantic/src/checker/declaration_signature.rs')
          text = path.read_text()
          old = '''    let mut semantic = CallableParameterSemantic::new(callable.clone().into(), parameter.name.clone(), declared_type)
          '''
          # Current constructor takes CallableParameterId directly; anchor on the formatted statement instead.
          if old in text:
              raise SystemExit('unexpected legacy parameter constructor anchor')
          old = '''    let mut semantic = CallableParameterSemantic::new(CallableParameterId::new(callable.clone(), index as u32), parameter.name.clone(), declared_type)
              .with_rest(parameter.rest_mode);
          '''
          new = '''    let mut semantic = CallableParameterSemantic::new(CallableParameterId::new(callable.clone(), index as u32), parameter.name.clone(), declared_type)
              .with_rest(parameter.rest_mode)
              .with_source(crate::diagnostic::SemanticSourceSpan::new(ctx.current_module.clone(), parameter.name_range));
          '''
          if old not in text:
              raise SystemExit('declaration parameter fact anchor missing')
          path.write_text(text.replace(old, new, 1))

          # Binding seeds/states retain canonical parameter identity when applicable.
          path = Path('phalcom-semantic/src/checker/binding.rs')
          text = path.read_text()
          text = text.replace('use crate::identity::BindingId;', 'use crate::identity::{BindingId, CallableParameterId};', 1)
          anchor = 'pub struct BindingSeed {\n    pub name: String,\n'
          if anchor not in text:
              raise SystemExit('BindingSeed anchor missing')
          text = text.replace(anchor, 'pub struct BindingSeed {\n    pub name: String,\n    pub parameter: Option<CallableParameterId>,\n', 1)
          path.write_text(text)

          path = Path('phalcom-semantic/src/checker/analysis.rs')
          text = path.read_text()
          text = text.replace(
              'AnalysisIncidentId, BindingId, CallResolutionId, CallableId, DiagnosticCauseId, ExplanationId, ExpressionId, FieldId',
              'AnalysisIncidentId, BindingId, CallResolutionId, CallableId, CallableParameterId, DiagnosticCauseId, ExplanationId, ExpressionId, FieldId',
              1,
          )
          anchor = 'pub struct BindingState {\n    pub binding: BindingId,\n    pub name: String,\n'
          if anchor not in text:
              raise SystemExit('BindingState anchor missing')
          text = text.replace(anchor, 'pub struct BindingState {\n    pub binding: BindingId,\n    pub name: String,\n    pub parameter: Option<CallableParameterId>,\n', 1)
          anchor = '            name: seed.name,\n            range: seed.range,\n'
          if anchor not in text:
              raise SystemExit('BindingState from_seed anchor missing')
          text = text.replace(anchor, '            name: seed.name,\n            parameter: seed.parameter,\n            range: seed.range,\n', 1)
          anchor = '            binding,\n            name: name.into(),\n            range,\n'
          if anchor not in text:
              raise SystemExit('BindingState constructor anchor missing')
          text = text.replace(anchor, '            binding,\n            name: name.into(),\n            parameter: None,\n            range,\n', 1)
          path.write_text(text)

          # Replace callable binding entry points with one identity-aware implementation.
          path = Path('phalcom-semantic/src/checker/context.rs')
          text = path.read_text()
          start = text.index('    pub fn bind_callable_parameter(')
          end = text.index('    pub fn bind_contextual_block_parameter(', start)
          replacement = '''    pub fn bind_callable_parameter(&mut self, name: impl Into<String>, current: TypeKnowledge, range: SourceRange) -> BindingDeclarationResult {
              self.bind_callable_parameter_with_identity(
                  name,
                  current,
                  range,
                  crate::checker::causal::CausalInvalidity::Clean,
                  None,
              )
          }

          pub fn bind_canonical_callable_parameter(
              &mut self,
              parameter: &crate::signature::CallableParameterSemantic,
              fallback_range: SourceRange,
          ) -> BindingDeclarationResult {
              let range = parameter.source.as_ref().map_or(fallback_range, |source| source.range);
              self.bind_callable_parameter_with_identity(
                  parameter.local_name.to_string(),
                  parameter.declared_type.to_knowledge(),
                  range,
                  crate::checker::causal::CausalInvalidity::Clean,
                  Some(parameter.id.clone()),
              )
          }

          pub fn bind_callable_parameter_with_causal(
              &mut self,
              name: impl Into<String>,
              current: TypeKnowledge,
              range: SourceRange,
              causal_invalidity: crate::checker::causal::CausalInvalidity,
          ) -> BindingDeclarationResult {
              self.bind_callable_parameter_with_identity(name, current, range, causal_invalidity, None)
          }

          fn bind_callable_parameter_with_identity(
              &mut self,
              name: impl Into<String>,
              current: TypeKnowledge,
              range: SourceRange,
              causal_invalidity: crate::checker::causal::CausalInvalidity,
              parameter_identity: Option<crate::identity::CallableParameterId>,
          ) -> BindingDeclarationResult {
              let current = current
                  .ty()
                  .map(|ty| TypeKnowledge::assumed(ty, crate::types::evidence::EvidenceOrigin::CallableSignature))
                  .unwrap_or(current);
              let contract = current.ty().map(|ty| BindingContract {
                  ty,
                  origin: BindingContractOrigin::CallableParameter,
                  source: Some(range),
              });
              self.declare_binding(BindingSeed {
                  name: name.into(),
                  parameter: parameter_identity,
                  range,
                  contract,
                  current,
                  denotation: None,
                  causal_invalidity,
                  mutable: false,
              })
          }

          '''
          text = text[:start] + replacement + text[end:]

          # All non-callable BindingSeed constructions explicitly have no callable-parameter identity.
          def add_none_to_binding_seeds(source: str) -> str:
              token = 'BindingSeed {'
              cursor = 0
              out = []
              while True:
                  start = source.find(token, cursor)
                  if start < 0:
                      out.append(source[cursor:])
                      break
                  out.append(source[cursor:start])
                  brace = source.find('{', start)
                  depth = 0
                  end = brace
                  while end < len(source):
                      ch = source[end]
                      if ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end += 1
                              break
                      end += 1
                  block = source[start:end]
                  if 'parameter:' not in block:
                      line_start = source.rfind('\n', 0, start) + 1
                      indent = source[line_start:start]
                      block = block.replace(token, token + '\n' + indent + '    parameter: None,', 1)
                  out.append(block)
                  cursor = end
              return ''.join(out)

          text = add_none_to_binding_seeds(text)
          path.write_text(text)

          path = Path('phalcom-semantic/src/checker/statement.rs')
          path.write_text(add_none_to_binding_seeds(path.read_text()))

          # Body binding now consumes the canonical parameter record rather than re-spelling it.
          path = Path('phalcom-semantic/src/checker/body.rs')
          text = path.read_text()
          old = '            ctx.bind_callable_parameter(parameter.local_name.to_string(), parameter.declared_type.to_knowledge(), body_range);\n'
          new = '            ctx.bind_canonical_callable_parameter(parameter, body_range);\n'
          if old not in text:
              raise SystemExit('body parameter binding anchor missing')
          path.write_text(text.replace(old, new, 1))

          # Source callable metadata publishes parameter-id -> declaration-site attachment.
          path = Path('phalcom-semantic/src/source_index/scope.rs')
          text = path.read_text()
          text = text.replace(
              'use crate::identity::{CallableId, DeclarationId, ModuleId, SemanticTargetId, SourceSiteId};',
              'use crate::identity::{CallableId, CallableParameterId, DeclarationId, ModuleId, SemanticTargetId, SourceSiteId};',
              1,
          )
          anchor = '    pub parameter_name_ranges: std::sync::Arc<[SourceRange]>,\n'
          if anchor not in text:
              raise SystemExit('CallableSourceInfo parameter range anchor missing')
          text = text.replace(anchor, anchor + '    pub parameter_sites: BTreeMap<CallableParameterId, SourceSiteId>,\n', 1)
          path.write_text(text)

          path = Path('phalcom-semantic/src/source_index/builder.rs')
          text = path.read_text()
          text = text.replace(
              'use crate::identity::{CallableId, DeclarationId, DispatchSide, FieldId, ModuleId, SemanticTargetId, SourceOwner, SourceSiteId, SourceSiteLocalId};',
              'use crate::identity::{CallableId, CallableParameterId, DeclarationId, DispatchSide, FieldId, ModuleId, SemanticTargetId, SourceOwner, SourceSiteId, SourceSiteLocalId};',
              1,
          )
          anchor = '                parameter_name_ranges: Arc::from(parameters.iter().map(|parameter| parameter.name_range).collect::<Vec<_>>().into_boxed_slice()),\n'
          if anchor not in text:
              raise SystemExit('CallableSourceInfo builder anchor missing')
          text = text.replace(anchor, anchor + '                parameter_sites: BTreeMap::new(),\n', 1)
          old = '''        let previous_owner = std::mem::replace(&mut self.current_owner, SourceOwner::Callable(callable));
              let scope = self.new_scope(parent, body_range);
              for parameter in parameters {
                  self.declare(scope, parameter.name.clone(), parameter_kind, parameter.name_range, true);
              }
          '''
          new = '''        let previous_owner = std::mem::replace(&mut self.current_owner, SourceOwner::Callable(callable.clone()));
              let scope = self.new_scope(parent, body_range);
              let mut parameter_sites = BTreeMap::new();
              for (index, parameter) in parameters.iter().enumerate() {
                  let site = self.declare(scope, parameter.name.clone(), parameter_kind, parameter.name_range, true);
                  parameter_sites.insert(CallableParameterId::new(callable.clone(), index as u32), site);
              }
              if let Some(source) = self.index.callable_sources.get_mut(&callable) {
                  source.parameter_sites = parameter_sites;
              }
          '''
          if old not in text:
              raise SystemExit('callable parameter declaration loop anchor missing')
          path.write_text(text.replace(old, new, 1))

          # Formal attachment consumes the canonical parameter mapping before legacy local binding matching.
          path = Path('phalcom-semantic/src/source_index/mod.rs')
          text = path.read_text()
          anchor = '        for (offset, state) in states.into_iter().enumerate() {\n'
          if anchor not in text:
              raise SystemExit('formal binding attachment loop anchor missing')
          insertion = '''        for (offset, state) in states.into_iter().enumerate() {
              if let Some(parameter) = &state.parameter {
                  let site = scopes
                      .callable_sources
                      .get(&parameter.callable)
                      .and_then(|source| source.parameter_sites.get(parameter))
                      .cloned();
                  let Some(site) = site else {
                      incidents.push(SourceAttachmentError::MissingBinding {
                          callable: callable.clone(),
                          binding: state.binding,
                      });
                      continue;
                  };
                  formal_bindings.insert(state.binding, site);
                  continue;
              }
          '''
          text = text.replace(anchor, insertion, 1)
          path.write_text(text)
      - name: Format implementation
        run: cargo +stable fmt --all
      - name: Focused parameter identity regression
        env:
          RUSTFLAGS: ""
        run: cargo +stable test -p phalcom-semantic --test semantic semantic::integration::parameter_identity::callable_parameter_identity_connects_signature_binding_and_source_site -- --exact
      - name: Full semantic gate
        env:
          RUSTFLAGS: ""
        run: |
          cargo +stable fmt --all -- --check
          git diff --check
          cargo +stable check -p phalcom-semantic
          cargo +stable test -p phalcom-semantic
      - name: Commit phase 2
        shell: bash
        run: |
          rm .github/workflows/canonical-declaration-phase2.yml
          git config user.name "phalcom-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(semantic): connect parameter declaration and source identity"
          git push origin HEAD:codex/canonical-declaration-knowledge
