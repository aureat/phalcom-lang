name: Agent C4 P3 one-shot patch

on:
  push:
    branches:
      - agent/c4-p3-complex-closure-7

permissions:
  contents: write

jobs:
  patch:
    if: ${{ startsWith(github.event.head_commit.message, 'agent patch:') }}
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/c4-p3-complex-closure-7
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview

      - uses: Swatinem/rust-cache@v2

      - name: Apply data-component trait projection bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('phalcom-core/src/vm/dispatch.rs')
          text = path.read_text()

          old = "    fn trait_method_for_selection(&mut self, receiver: Value, selection: &phalcom_semantic::impls::RequirementSelectionTemplate) -> PhResult<ObjRef> {\n        use phalcom_semantic::impls::RequirementSelectionTemplate;\n"
          new = "\n".join([
              "    fn trait_method_for_selection(",
              "        &mut self,",
              "        receiver: Value,",
              "        selection: &phalcom_semantic::impls::RequirementSelectionTemplate,",
              "        requirement_selector: &phalcom_common::selector::Selector,",
              "    ) -> PhResult<ObjRef> {",
              "        use phalcom_semantic::impls::RequirementSelectionTemplate;",
              "        if let RequirementSelectionTemplate::DataComponent { component, .. } = selection {",
              "            // Semantic evidence has already selected this exact data component.",
              "            // Runtime lookup only materializes the representation-level getter",
              "            // installed by register_data_from_spec; it does not select a witness.",
              "            let selector = self.interner.intern(&requirement_selector.encode());",
              "            return receiver",
              "                .lookup_method(self, selector)",
              "                .ok_or_else(|| {",
              "                    RuntimeError::Internal(format!(",
              "                        \"trait-selected data component {component:?} has no runtime projection getter for `{}`\",",
              "                        requirement_selector.encode()",
              "                    ))",
              "                })",
              "                .map_err(Into::into);",
              "        }",
              "",
          ])
          if text.count(old) != 1:
              raise SystemExit(f'expected one trait selection function prefix, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "                slots[*slot as usize] = Some(self.trait_method_for_selection(receiver, target)?);"
          new = "                slots[*slot as usize] = Some(self.trait_method_for_selection(receiver, target, &requirement.selector)?);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one requirement slot materialization, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "        let method = self.trait_method_for_selection(receiver, &spec.selection.selection)?;"
          new = "        let method = self.trait_method_for_selection(receiver, &spec.selection.selection, &spec.selection.signature.selector)?;"
          if text.count(old) != 1:
              raise SystemExit(f'expected one selected target materialization, found {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- phalcom-core/src/vm/dispatch.rs

      - name: Verify core builds
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' check -p phalcom-core

      - name: Commit exact runtime patch
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-core/src/vm/dispatch.rs
          git commit -m 'execute data component trait witness projections'
          git push origin HEAD:agent/c4-p3-complex-closure-7
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Trait data witness regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_default_executes_abstract_getter_satisfied_by_data_component -- --nocapture
