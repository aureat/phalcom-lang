name: Agent C4 P3 one-shot patch

on:
  push:
    branches:
      - agent/c4-p3-complex-closure-7

permissions:
  contents: write

jobs:
  patch:
    if: ${{ startsWith(github.event.head_commit.message, 'agent patch:') }}
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/c4-p3-complex-closure-7
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview

      - uses: Swatinem/rust-cache@v2

      - name: Restore query comments and remove diagnostic probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          query = Path('phalcom-semantic/src/db/query.rs')
          text = subprocess.check_output(
              ['git', 'show', '903fffc32c42f1df37ffa17dd1ea55a04f4c220d:phalcom-semantic/src/db/query.rs'],
              text=True,
          )

          # Data declarations are valid non-class nominal roots for hierarchy
          # replay. They retain the existing Object root edge semantics.
          old = '    if class_def.is_none() && enum_definition_for(&unit, &class_decl).is_none() {'
          new = '''    if class_def.is_none()
              && enum_definition_for(&unit, &class_decl).is_none()
              && data_definition_for(&unit, &class_decl).is_none()
          {'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one hierarchy admission condition, found {text.count(old)}')
          text = text.replace(old, new, 1)

          # Rebuild only the declaration-surface source/fingerprint block while
          # preserving every comment/doc-comment from the clean parent.
          fn_start = text.index('pub fn query_declaration_surface')
          start = text.index('    let class_def = class_definition_for(&unit, &decl_id);', fn_start)
          end = text.index('\n\n    let Some(declaration_info)', start)
          text = text[:start] + '''    let class_def = class_definition_for(&unit, &decl_id);
              let enum_def = enum_definition_for(&unit, &decl_id);
              let data_def = data_definition_for(&unit, &decl_id);
              if class_def.is_none() && enum_def.is_none() && data_def.is_none() {
                  return query_failure(db, key, format!("source declaration {decl_id:?} was not found in its parsed module"));
              }''' + text[end:]

          start = text.index('    let input_fingerprint = if let Some(class_def) = class_def {', fn_start)
          end = text.index('\n\n    match query_declaration_shell', start)
          text = text[:start] + '''    let input_fingerprint = if let Some(class_def) = class_def {
              crate::db::fingerprint::declaration_surface_source_input_fingerprint(&unit, &decl_id, class_def)
          } else if let Some(enum_def) = enum_def {
              crate::db::fingerprint::declaration_surface_enum_input_fingerprint(&unit, &decl_id, enum_def)
          } else {
              let data_def = data_def.expect("data declaration checked above");
              let mut hasher = DefaultHasher::new();
              2_u8.hash(&mut hasher);
              decl_id.hash(&mut hasher);
              data_def.range.start.hash(&mut hasher);
              data_def.range.end.hash(&mut hasher);
              unit.text.get(data_def.range.start..data_def.range.end).hash(&mut hasher);
              InputFingerprint::new(hasher.finish())
          };''' + text[end:]

          old_comment = '''            // Enum root surfaces are assembled by the enum semantic pass. This
                      // product anchors dependency readiness; body queries consume the
                      // already-published dispatch surface from the workspace session.'''
          new_comment = '''            // Enum and data roots own no class-style primary behavior surface
                      // here. Enum behavior and inherent impl behavior are composed by
                      // their dedicated semantic passes, while data components remain
                      // first-class data witnesses rather than fabricated getters.'''
          if text.count(old_comment) != 1:
              raise SystemExit(f'expected one enum-root surface comment, found {text.count(old_comment)}')
          text = text.replace(old_comment, new_comment, 1)
          query.write_text(text)

          traits = Path('phalcom-core/tests/core/language/traits.rs')
          text = traits.read_text()
          test_start = text.index('fn trait_default_executes_abstract_getter_satisfied_by_data_component()')
          start = text.index('    let person = phalcom_modules::DeclarationId::new', test_start)
          end = text.index('\n    assert_eq!(\n        analyzed.semantic.data_semantics.data_decls.len()', start)
          replacement = '''    let person = phalcom_modules::DeclarationId::new(analyzed.entry.clone(), "Person".into());
              assert!(
                  analyzed.semantic.declarations.form(&person).is_some(),
                  "semantic snapshot must retain the Person declaration"
              );'''
          text = text[:start] + replacement + text[end:]
          traits.write_text(text)
          PY
          git diff --check
          git diff -- phalcom-semantic/src/db/query.rs phalcom-core/tests/core/language/traits.rs

      - name: Verify semantic crate builds
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' check -p phalcom-semantic

      - name: Existing data lowering control
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::data_e2e::data_labeled_tuple_construction_and_access -- --nocapture

      - name: Trait data witness regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_default_executes_abstract_getter_satisfied_by_data_component -- --nocapture

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-c4-p3-patch.yml
          git add phalcom-semantic/src/db/query.rs phalcom-core/tests/core/language/traits.rs
          git diff --cached --check
          git commit -m 'clean up data component trait witness repair'
          git push origin HEAD:agent/c4-p3-complex-closure-7
