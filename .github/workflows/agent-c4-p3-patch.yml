name: Agent C4 P3 one-shot patch

on:
  push:
    branches:
      - agent/c4-p3-complex-closure-7

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'agent patch:')
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/c4-p3-complex-closure-7
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          components: rustc-codegen-cranelift-preview

      - uses: Swatinem/rust-cache@v2

      - name: Apply data-component trait projection bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('phalcom-core/src/vm/dispatch.rs')
          text = path.read_text()

          old_sig = '    fn trait_method_for_selection(&mut self, receiver: Value, selection: &phalcom_semantic::impls::RequirementSelectionTemplate) -> PhResult<ObjRef> {'
          new_sig = '''    fn trait_method_for_selection(
              &mut self,
              receiver: Value,
              selection: &phalcom_semantic::impls::RequirementSelectionTemplate,
              requirement_selector: &phalcom_common::selector::Selector,
          ) -> PhResult<ObjRef> {'''
          if text.count(old_sig) != 1:
              raise SystemExit(f'expected one trait_method_for_selection signature, found {text.count(old_sig)}')
          text = text.replace(old_sig, new_sig, 1)

          use_line = '        use phalcom_semantic::impls::RequirementSelectionTemplate;\n'
          data_bridge = '''        use phalcom_semantic::impls::RequirementSelectionTemplate;
          if let RequirementSelectionTemplate::DataComponent { component, .. } = selection {
              // Semantic evidence has already selected this exact data component.
              // Runtime getter lookup only materializes the representation-level
              // projection handle installed by register_data_from_spec; it does
              // not participate in conformance or witness selection.
              let selector = self.interner.intern(&requirement_selector.encode());
              return receiver
                  .lookup_method(self, selector)
                  .ok_or_else(|| {
                      RuntimeError::Internal(format!(
                          "trait-selected data component {component:?} has no runtime projection getter for `{}`",
                          requirement_selector.encode()
                      ))
                  })
                  .map_err(Into::into);
          }
'''
          if text.count(use_line) != 1:
              raise SystemExit(f'expected one local RequirementSelectionTemplate import, found {text.count(use_line)}')
          text = text.replace(use_line, data_bridge, 1)

          old_arm = '            RequirementSelectionTemplate::DataComponent { .. } => None,'
          new_arm = '            RequirementSelectionTemplate::DataComponent { .. } => unreachable!("data component selection handled above"),'
          if text.count(old_arm) != 1:
              raise SystemExit(f'expected one data component trap arm, found {text.count(old_arm)}')
          text = text.replace(old_arm, new_arm, 1)

          old_slot = '                slots[*slot as usize] = Some(self.trait_method_for_selection(receiver, target)?);'
          new_slot = '                slots[*slot as usize] = Some(self.trait_method_for_selection(receiver, target, &requirement.selector)?);'
          if text.count(old_slot) != 1:
              raise SystemExit(f'expected one conformance slot materialization call, found {text.count(old_slot)}')
          text = text.replace(old_slot, new_slot, 1)

          old_selected = '        let method = self.trait_method_for_selection(receiver, &spec.selection.selection)?;'
          new_selected = '        let method = self.trait_method_for_selection(receiver, &spec.selection.selection, &spec.selection.signature.selector)?;'
          if text.count(old_selected) != 1:
              raise SystemExit(f'expected one selected trait target materialization call, found {text.count(old_selected)}')
          text = text.replace(old_selected, new_selected, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- phalcom-core/src/vm/dispatch.rs

      - name: Verify core builds
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' check -p phalcom-core

      - name: Commit exact runtime patch
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phalcom-core/src/vm/dispatch.rs
          git commit -m 'execute data component trait witness projections'
          git push origin HEAD:agent/c4-p3-complex-closure-7
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Trait data witness regression
        run: cargo +nightly-2026-07-10 --config 'build.rustc-wrapper=""' test -p phalcom-core --test core language::traits::trait_default_executes_abstract_getter_satisfied_by_data_component -- --nocapture
