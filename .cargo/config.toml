[unstable]
feature-unification = true

[resolver]
feature-unification = "workspace"

[build]
# macOS frontend stability: `-Zthreads=8` repeatedly hangs fresh builds here.
# Two workers complete reliably; retain until a newer pinned nightly proves safe.
rustflags = ["-Zunstable-options", "-Ctarget-cpu=native"]
rustc-wrapper = "sccache"
jobs = 8

# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
# core.ph bootstrap and compiler-deopt tests exceed macOS's default Rust test
# worker stack. Keep the workspace gate representative without per-test wrappers.
RUST_MIN_STACK = "33554432"
#RUST_MIN_STACK = "8388608"
