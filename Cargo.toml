[workspace]
members = [
    "phalcom-ast",
    "phalcom-common",
    "phalcom-type-syntax",
    "phalcom-native-meta",
    "phalcom-native-decl",
    "phalcom-native-macros",
    "phalcom-native-surface",
    "phalcom-native-surface-gen",
    "phalcom-core",
    "phalcom-repl",
    "phalcom-lsp",
    "phalcom-modules",
    "phalcom-semantic",
    "phalcom-test-support",
    "phalcom-diagnostics",
    "phalcom-type-meta",
]
resolver = "2"
default-members = [
    "phalcom-ast",
    "phalcom-common",
    "phalcom-type-syntax",
    "phalcom-native-meta",
    "phalcom-native-macros",
    "phalcom-native-surface",
    "phalcom-core",
    "phalcom-repl",
    "phalcom-lsp",
    "phalcom-modules",
    "phalcom-semantic",
    "phalcom-diagnostics",
    "phalcom-type-meta",
]

[profile.test]
# Preserve line-level panic locations while reducing debug-info generation and
# test-binary link work. Incremental artifacts are essential to edit-test loops.
debug = 1
incremental = true

[profile.release]
opt-level = 3          # Maximum optimizations (Default for release)
lto = true             # Enable Link-Time Optimization across all crates
codegen-units = 1      # Reduce parallel code generation units for better optimization
panic = "abort"

[workspace.dependencies]
thiserror = "2.0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rustyline = "16.0.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "registry",
    "std",
] }
indexmap = "2.9.0"
once_cell = "1.21.3"
anyhow = "1.0.98"
# Display-width measurement for the diagnostics caret renderer (IS §1, §3.4).
# Already pulled transitively via `reedline` in `phalcom-repl`; pinned here so
# `phalcom-core` can depend on the same version deliberately. PDR-0014.
unicode-width = "0.2.1"
num-bigint = "0.4"
linkme = "0.3"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing", "printing"] }
quote = "1.0"
proc-macro2 = "1.0"
