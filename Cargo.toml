[workspace]
members = [
    "phalcom-ast",
    "phalcom-common",
    "phalcom-core",
    "phalcom-repl",
    "phalcom-lsp",
]
resolver = "2"
default-members = ["phalcom-core"]

[workspace.dependencies]
thiserror = "2.0.12"
rustyline = "16.0.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "registry",
    "std",
] }
indexmap = "2.9.0"
once_cell = "1.21.3"
anyhow = "1.0.98"
# Display-width measurement for the diagnostics caret renderer (IS §1, §3.4).
# Already pulled transitively via `reedline` in `phalcom-repl`; pinned here so
# `phalcom-core` can depend on the same version deliberately. PDR-0014.
unicode-width = "0.2.1"
