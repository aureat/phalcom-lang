<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phalcom — execution visualizer</title>
<style>
  :root{
    --bg:#fbfaf8;--panel:#fff;--ink:#1a1a1a;--ink-mute:#6b6b6b;--ink-faint:#a8a8a8;
    --rule:#e2ded8;--rule-strong:#cfc9c0;
    --accent:#b8632a;--accent-soft:#f7e9dd;
    --link:#6b3fa0;--link-soft:#ece3f6;
    --f1:#2f6f8f;--f1-soft:#dceaf1;
    --f2:#4a7c46;--f2-soft:#dfeddc;
    --f0:#7a7268;--f0-soft:#eeeae5;
    --warn:#a8721b;--warn-soft:#f8eed8;
    --error:#a32b2b;--error-soft:#f7e0e0;
    --slot-empty:#f4f2ef;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#16171a;--panel:#1d1f23;--ink:#eceae6;--ink-mute:#9a9793;--ink-faint:#62605d;
    --rule:#32353a;--rule-strong:#464a50;
    --accent:#e0904f;--accent-soft:#3a2a1c;
    --link:#b48ee0;--link-soft:#2b2136;
    --f1:#6fb2d2;--f1-soft:#1f333d;
    --f2:#87c07f;--f2-soft:#1e2b1c;
    --f0:#a89e92;--f0-soft:#2a2724;
    --warn:#d9a441;--warn-soft:#33280f;
    --error:#e07070;--error-soft:#3a1f1f;
    --slot-empty:#222429;
  }}
  :root[data-theme="dark"]{--bg:#16171a;--panel:#1d1f23;--ink:#eceae6;--ink-mute:#9a9793;--ink-faint:#62605d;--rule:#32353a;--rule-strong:#464a50;--accent:#e0904f;--accent-soft:#3a2a1c;--link:#b48ee0;--link-soft:#2b2136;--f1:#6fb2d2;--f1-soft:#1f333d;--f2:#87c07f;--f2-soft:#1e2b1c;--f0:#a89e92;--f0-soft:#2a2724;--warn:#d9a441;--warn-soft:#33280f;--error:#e07070;--error-soft:#3a1f1f;--slot-empty:#222429;}
  :root[data-theme="light"]{--bg:#fbfaf8;--panel:#fff;--ink:#1a1a1a;--ink-mute:#6b6b6b;--ink-faint:#a8a8a8;--rule:#e2ded8;--rule-strong:#cfc9c0;--accent:#b8632a;--accent-soft:#f7e9dd;--link:#6b3fa0;--link-soft:#ece3f6;--f1:#2f6f8f;--f1-soft:#dceaf1;--f2:#4a7c46;--f2-soft:#dfeddc;--f0:#7a7268;--f0-soft:#eeeae5;--warn:#a8721b;--warn-soft:#f8eed8;--error:#a32b2b;--error-soft:#f7e0e0;--slot-empty:#f4f2ef;}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 24px 80px}

  /* nav */
  nav{display:flex;gap:6px;margin-bottom:26px;border-bottom:1px solid var(--rule);padding-bottom:0}
  nav button{font:inherit;font-size:13.5px;padding:8px 15px;border:none;background:none;
    color:var(--ink-mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  nav .sp{flex:1}
  nav .tiny{font-size:12px;color:var(--ink-faint);align-self:center}

  h1{font-size:21px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .lede{color:var(--ink-mute);font-size:14px;margin:0 0 20px;max-width:74ch}

  .warnbox{margin:0 0 20px;padding:10px 13px;border-radius:6px;background:var(--warn-soft);
    border:1px solid var(--warn);font-size:12.5px;line-height:1.55}
  .banner{margin:0 0 18px;padding:10px 14px;border-radius:6px;display:none;background:var(--error-soft);
    border:1px solid var(--error);color:var(--error);font-size:13px}
  .banner.on{display:block}

  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
  .panel h2{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .panel h2 .sub{text-transform:none;letter-spacing:0;font-weight:400}

  .top{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media (max-width:1000px){.top{grid-template-columns:1fr}}
  .src,.bc{font-size:12.5px;line-height:1.7}
  .src .line{display:block;padding:1px 8px;border-radius:4px;white-space:pre;color:var(--ink-mute)}
  .src .line.on{background:var(--f1-soft);color:var(--ink);font-weight:500}
  .bc .op{display:grid;grid-template-columns:44px 1fr;padding:1px 8px;border-radius:4px;color:var(--ink-mute);white-space:pre}
  .bc .op.on{background:var(--f1-soft);color:var(--ink);font-weight:500}
  .bc .op .ad{color:var(--ink-faint)}
  .bc .operand{padding:0 3px;border-radius:3px}
  .bc .op.on .operand.lit{background:var(--link-soft);color:var(--link);font-weight:700;box-shadow:inset 0 0 0 1px var(--link)}

  /* machine row: gutter | tape | rail */
  .machine{position:relative;display:grid;grid-template-columns:74px 1fr 210px;gap:0;align-items:stretch}
  @media (max-width:1000px){.machine{grid-template-columns:74px 1fr}}

  /* upvalue connector overlay (UI-SPEC §6) — one SVG spanning the whole
     machine row, since the connector must survive the tape and the rail
     being separate grid columns. Positions only; never redraws a value. */
  .upv-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:5}
  .upv-line{fill:none;stroke-width:2}
  .upv-line.parked{stroke-dasharray:5 4}
  .upv-dot{stroke:none}

  /* host gutter — flat, hatched, bolted down. never a card. */
  .gutter{border:1px solid var(--rule);border-right:none;border-radius:8px 0 0 8px;
    background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink-faint) 16%,transparent) 5px 6px);
    padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .gutter.hot{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 5px,color-mix(in srgb,var(--warn) 34%,transparent) 5px 6px);
    border-color:var(--warn)}
  .gutter .lbl{font-size:9px;line-height:1.25;text-align:center;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  .gutter.hot .lbl{color:var(--warn)}
  .gutter .bars{display:flex;flex-direction:column;gap:3px;width:100%;flex:1;justify-content:flex-end}
  .gutter .bar{height:15px;border-radius:2px;background:color-mix(in srgb,var(--ink-faint) 45%,transparent)}
  .gutter.hot .bar:last-child{background:var(--warn)}
  .gutter .d{font-size:11px;font-weight:700;color:var(--ink-mute)}
  .gutter.hot .d{color:var(--warn)}

  .tapewrap{border:1px solid var(--rule);border-left:none;border-right:none;padding:12px 14px;background:var(--panel)}
  .tape-area{position:relative}
  .lanes{position:relative;margin-bottom:6px}
  .lane{position:relative;height:24px}
  .bracket{position:absolute;top:2px;height:19px;border:1px solid var(--fc);border-bottom:none;
    border-radius:5px 5px 0 0;background:color-mix(in srgb,var(--fc) 9%,transparent);
    display:flex;align-items:center;gap:7px;padding:0 7px;font-size:10px;color:var(--fc);
    white-space:nowrap;overflow:hidden}
  .bracket .nm{font-weight:600}
  .bracket .meta{color:var(--ink-faint)}
  .bracket .meta .hot{color:var(--link);font-weight:700;padding:0 3px;border-radius:3px;
    background:var(--link-soft);box-shadow:inset 0 0 0 1px var(--link)}
  .bracket.blk{border-style:dashed}
  .bracket .home{color:var(--ink-faint);padding:0 3px;border-radius:3px}
  .bracket .home.dead{color:var(--error);font-weight:700;
    background:color-mix(in srgb,var(--error) 15%,transparent);
    box-shadow:inset 0 0 0 1px var(--error)}

  .slots{display:grid}
  .slot{height:42px;border:1px solid var(--rule);border-left:none;display:flex;align-items:center;
    justify-content:center;font-size:12px;background:var(--panel);position:relative;
    transition:background 140ms,border-color 140ms}
  .slot:first-child{border-left:1px solid var(--rule);border-radius:5px 0 0 5px}
  .slot:last-child{border-radius:0 5px 5px 0}
  .slot.beyond{background:var(--slot-empty);color:var(--ink-faint)}
  .slot.nilv{color:var(--ink-faint)}
  .slot.chg-0{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft);z-index:2}
  .slot.chg-1{border-color:color-mix(in srgb,var(--accent) 55%,var(--rule));z-index:1}
  .slot.chg-2{border-color:color-mix(in srgb,var(--accent) 28%,var(--rule))}
  .slot.readfrom{box-shadow:inset 0 0 0 2px var(--link);background:var(--link-soft);z-index:3}
  .slot.upv{box-shadow:inset 0 0 0 2px var(--f2)}

  .idx{display:grid;margin-top:4px}
  .idx div{text-align:center;font-size:9.5px;color:var(--ink-faint)}
  .idx div.named{color:var(--fc);font-weight:600}
  .idx div.hot{color:var(--link);font-weight:700}

  /* park/unpark tween (UI-SPEC §8): decoration on a clone laid over the
     already-correct instant render, never a substitute for it (N7 — the
     underlying state swap is never delayed, only its playback). */
  .tape-tween{position:absolute;inset:0;pointer-events:none;
    transition:transform 400ms cubic-bezier(.16,.84,.44,1),opacity 400ms ease-out}
  .tw-out{transform:translateX(0);opacity:1}
  .tw-out.tw-play{transform:translateX(56px);opacity:0}
  .tw-in{transform:translateX(56px);opacity:0}
  .tw-in.tw-play{transform:translateX(0);opacity:1}
  @media (prefers-reduced-motion:reduce){
    .tape-tween{transition:none}
  }

  /* the hole */
  .hole{border:1.5px dashed var(--ink-faint);border-radius:6px;height:42px;display:flex;
    align-items:center;justify-content:center;color:var(--ink-mute);font-size:12.5px;
    letter-spacing:.03em;background:repeating-linear-gradient(90deg,transparent 0 8px,color-mix(in srgb,var(--ink-faint) 8%,transparent) 8px 9px)}

  /* cells */
  .cells{margin-top:10px;min-height:34px}
  .cell{display:inline-flex;align-items:center;gap:7px;padding:3px 9px;border-radius:5px;
    border:1px solid var(--f2);background:color-mix(in srgb,var(--f2) 9%,transparent);
    font-size:11.5px;color:var(--f2);margin-right:8px}
  .cell .k{font-weight:700}
  .cell .arrow{color:var(--ink-faint)}
  .cell.closed{border-style:solid;opacity:.85}
  .cell.stretched{border-style:dashed}
  .cell.dangling{border-color:var(--error);color:var(--error);
    background:color-mix(in srgb,var(--error) 10%,transparent)}

  /* fiber rail */
  .rail{border:1px solid var(--rule);border-left:none;border-radius:0 8px 8px 0;padding:12px 12px;
    background:var(--panel);display:flex;flex-direction:column;gap:9px}
  .fcard{border:1px solid var(--fc);border-radius:7px;padding:7px 9px;background:var(--panel);
    box-shadow:0 1px 3px rgba(0,0,0,.13),0 3px 8px rgba(0,0,0,.07)}
  .fcard .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;
    color:var(--fc);font-weight:700;margin-bottom:5px}
  .fcard .hd .st{font-weight:500;font-size:10px;color:var(--ink-mute)}
  .comp{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
  .comp div{height:16px;border:1px solid color-mix(in srgb,var(--fc) 45%,transparent);border-radius:2px;
    font-size:7.5px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.02em}
  .comp div.full{background:color-mix(in srgb,var(--fc) 30%,transparent);color:var(--fc);font-weight:700}
  .fcard.running{outline:2px solid color-mix(in srgb,var(--fc) 40%,transparent);outline-offset:1px}
  .fcard.failed{border-color:var(--error)}
  .fcard.failed .hd{color:var(--error)}
  .railh{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin-top:2px}
  .chain{font-size:11px;color:var(--ink-mute);line-height:1.7}
  .chain .e{font-weight:600}
  .chain .try{border-bottom:2px double var(--ink-mute)}
  .hopper{font-size:10.5px;color:var(--ink-faint)}
  .fres{margin-top:5px;font-size:10px;color:var(--ink-mute)}
  .fres.err{color:var(--error);font-weight:600}
  .chain .e.try{border-bottom:2px double currentColor}
  .chain .e.hot{color:var(--error)}
  .chain .halt{color:var(--f2);font-size:10px;margin:3px 0 0;font-weight:600}
  .chain .cross{color:var(--error);font-size:10px;margin:3px 0 0;font-weight:600}
  .pinned{font-size:10.5px;color:var(--ink-mute);padding:5px 7px;border-radius:5px;
    border:1px dashed var(--rule-strong);background:color-mix(in srgb,var(--ink-faint) 6%,transparent)}
  .pinned b{color:var(--ink);font-size:12px}

  .resolve{margin-top:12px;padding:9px 12px;border-radius:6px;border:1px dashed var(--link);
    background:var(--link-soft);font-size:12.5px;display:none;align-items:center;gap:8px;flex-wrap:wrap}
  .resolve.on{display:flex}
  .resolve .chip{padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--link);
    color:var(--link);font-weight:600}
  .resolve .eq{color:var(--ink-mute)}
  .resolve .why{width:100%;color:var(--ink-mute);font-size:11.5px}

  .callout{margin-top:14px;min-height:36px;display:flex;gap:10px;align-items:flex-start}
  .callout .leader{width:3px;align-self:stretch;background:var(--accent);border-radius:2px;flex:none}
  .callout .txt{font-size:13.5px;padding-top:1px}
  .callout.empty{opacity:0}
  .callout.err .leader{background:var(--error)}
  .callout.err .txt{color:var(--error)}

  .transport{margin-top:16px;display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
  button.tb{font:inherit;font-size:13px;padding:5px 10px;border-radius:5px;border:1px solid var(--rule-strong);
    background:transparent;color:var(--ink);cursor:pointer}
  button.tb:hover:not(:disabled){border-color:var(--ink-mute)}
  button.tb:disabled{opacity:.32;cursor:default}
  .transport.locked{opacity:.55}
  .transport.locked .track input{cursor:not-allowed}
  .track{flex:1;position:relative;height:22px;display:flex;align-items:center}
  .track input{width:100%;accent-color:var(--f1)}
  .track .ticks{position:absolute;left:0;right:0;top:1px;height:5px;pointer-events:none}
  .track .tick{position:absolute;width:2px;height:5px;background:var(--accent);border-radius:1px}
  .counter{font-size:11.5px;color:var(--ink-mute);min-width:92px;text-align:right}
  .hint{margin-top:9px;font-size:11.5px;color:var(--ink-faint)}

  /* gate */
  .gate{margin:0 0 18px;padding:15px 17px;border-radius:8px;border:1.5px solid var(--link);
    background:var(--link-soft)}
  .gate h3{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--link)}
  .gate .q{font-size:15px;margin-bottom:11px}
  .gate .opts{display:flex;flex-direction:column;gap:7px;max-width:640px}
  .gate .opt{text-align:left;font:inherit;font-size:13.5px;padding:8px 12px;border-radius:6px;
    border:1px solid var(--rule-strong);background:var(--panel);color:var(--ink);cursor:pointer}
  .gate .opt:hover{border-color:var(--link)}
  .gate .opt.right{border-color:var(--f2);background:color-mix(in srgb,var(--f2) 12%,transparent)}
  .gate .opt.wrong{border-color:var(--error);background:color-mix(in srgb,var(--error) 10%,transparent)}
  .gate .because{margin-top:11px;font-size:13px;color:var(--ink-mute);display:none}
  .gate .because.on{display:block}

  .takeaway{margin-top:26px;padding:15px 18px;border-radius:8px;border:1px solid var(--rule);
    background:var(--panel)}
  .takeaway h3{margin:0 0 7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .takeaway p{margin:0 0 9px;font-size:13.5px}
  .takeaway p:last-child{margin-bottom:0}
  .takeaway .grip{font-size:15px;font-weight:500;border-left:3px solid var(--accent);padding-left:12px}
  .fwd{margin-top:11px;font-size:12.5px;color:var(--ink-faint)}

  .variants{display:flex;gap:7px;margin-bottom:14px}
  .variants button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:6px;
    border:1px solid var(--rule-strong);background:transparent;color:var(--ink-mute);cursor:pointer}
  .variants button.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);font-weight:600}

  table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:12px}
  table.cmp th,table.cmp td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule)}
  table.cmp th{color:var(--ink-faint);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap">

<nav id="nav"></nav>

<h1 id="title"></h1>
<p class="lede" id="lede"></p>
<div class="warnbox" id="warnbox"></div>
<div class="banner" id="banner"></div>

<div class="variants" id="variants"></div>
<div class="gate" id="gate" style="display:none"></div>

<div class="top">
  <div class="panel"><h2>Source</h2><div class="src mono" id="src"></div></div>
  <div class="panel"><h2>Bytecode <span class="sub mono" id="chunkname">—</span></h2><div class="bc mono" id="bc"></div></div>
</div>

<div class="machine" id="machine">
  <svg class="upv-svg" id="upvsvg"></svg>
  <div class="gutter" id="gutter"></div>
  <div class="tapewrap">
    <div class="tape-area" id="tapearea">
      <div class="lanes" id="lanes"></div>
      <div id="tapebody"></div>
      <div class="idx" id="idx"></div>
    </div>
    <div class="cells" id="cells"></div>
    <div class="resolve" id="resolve"></div>
  </div>
  <div class="rail" id="rail"></div>
</div>

<div class="callout" id="callout"><div class="leader"></div><div class="txt"></div></div>

<div class="transport" id="transport">
  <button class="tb" id="first">⏮</button><button class="tb" id="prev">◀</button>
  <button class="tb" id="play" title="play / pause (space)">▶</button>
  <button class="tb" id="next">▶|</button><button class="tb" id="last">⏭</button>
  <div class="track"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" value="0"></div>
  <div class="counter mono" id="counter"></div>
</div>
<div class="hint">← → step · shift+← → jump to switch · space play/pause · 1–5 example · Home/End · T theme</div>

<div class="takeaway" id="takeaway"></div>

</div>

<script src="trace-data.js"></script>
<script>
"use strict";

/* SLOTS, esc, EXAMPLES, and the trace-application engine (blankState/
   cloneState/apply/buildStates/invariants) moved to trace-data.js so
   tools/viz/triptych.html can reuse the same trace data — same DOM-
   independent code check.mjs already replays, no re-authoring (UI-SPEC §8). */

/* =========================== render ====================================== */
let CUR='e1', VAR=0, cursor=0, STATES=[], EVENTS=[], CHUNKS={}, SRC=[], GATED=true;
const $ = id => document.getElementById(id);
const HUE = { 0:'--f0', 1:'--f1', 2:'--f2' };
const hueOf = id => `var(${HUE[id] ?? '--f1'})`;

function ex(){ return EXAMPLES[CUR]; }
function activeSub(){ const e=ex(); return e.sub ? e.sub[VAR] : e; }

function load(id, v){
  CUR=id; VAR=v??0;
  const e=ex(), sub=activeSub();
  SRC=sub.source; CHUNKS=sub.chunks; EVENTS=sub.events;
  STATES=buildStates(EVENTS);
  cursor=0; GATED = !!e.gate;

  $('nav').innerHTML = Object.entries(EXAMPLES).map(([k,x])=>
    `<button class="${k===CUR?'on':''}" data-ex="${k}">${x.tab}</button>`).join('')
    + '<span class="sp"></span><span class="tiny">Phalcom execution visualizer</span>';
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.ex,0));

  $('title').textContent = e.title;
  $('lede').innerHTML = e.lede;
  $('warnbox').innerHTML = '<b>Fidelity note.</b> The opcode vocabulary is real (<span class="mono">bytecode.rs</span>) and module-level sequences were checked with <span class="mono">phalcom disasm</span>. '
    + 'Block and method chunk <i>sequences</i> are <b>reconstructed</b> — <span class="mono">disasm</span> does not recurse into nested chunks, so these were written by hand and are marked INFERRED. '
    + 'The mechanisms shown are verified: <span class="mono">stack_offset + slot</span> (<span class="mono">dispatch.rs:721</span>), the four moved fields, <span class="mono">Upvalue::Open { fiber, slot }</span> (<span class="mono">heap/upvalue.rs:34</span>), '
    + '<span class="mono">native_reentry_depth == 0</span> (<span class="mono">vm/mod.rs:97</span>).';

  $('variants').innerHTML = e.variants ? e.variants.map((t,i)=>
    `<button class="${i===VAR?'on':''}" data-v="${i}">${esc(t)}</button>`).join('') : '';
  $('variants').querySelectorAll('button').forEach(b=>b.onclick=()=>load(CUR,+b.dataset.v));

  renderGate();
  $('takeaway').innerHTML = `<h3>Takeaway</h3><p class="grip">${e.takeawayGrip}</p>`
    + e.takeaway.map(t=>`<p>${t}</p>`).join('')
    + (e.fwd?`<div class="fwd">${e.fwd}</div>`:'')
    + (e.sub&&VAR===1?`<table class="cmp"><tr><th>Program</th><th>Loop lowering</th><th>Gutter</th><th>Yield</th></tr>
       <tr><td class="mono">while</td><td>Jump / Loop, one chunk, no frame</td><td class="mono">1</td><td>legal</td></tr>
       <tr><td class="mono">each</td><td>Phalcom method, then <span class="mono">Block#call</span> → <span class="mono">run_until</span></td><td class="mono">2</td><td class="mono">raises</td></tr></table>`:'');

  const probs = invariants(STATES, EVENTS);
  $('banner').className = probs.length ? 'banner on' : 'banner';
  if (probs.length) $('banner').innerHTML =
    '<b>Invariant violation — this trace draws an impossible machine:</b><br>'+probs.map(p=>'· '+p).join('<br>');

  $('scrub').max = EVENTS.length;
  $('ticks').innerHTML = EVENTS.map((e,i)=> e.switch&&e.switch.phase==='hole'
    ? `<div class="tick" style="left:calc(${i+1}/${EVENTS.length}*100% - 1px)"></div>`:'').join('');
  render();
}

// R-GATE: an unanswered gate locks the transport, not just advises. Locking
// only the controls (not `go`/keys) would leave a keyboard route past the
// prediction, so `go` itself also clamps to cursor 0 while GATED (see below).
function updateTransportLock(){
  const locked = GATED && !!ex().gate;
  $('transport').classList.toggle('locked', locked);
  ['first','prev','play','next','last','scrub'].forEach(id => $(id).disabled = locked);
}

function renderGate(){
  const g = ex().gate;
  updateTransportLock();
  if (!g || !GATED){ $('gate').style.display='none'; return; }
  $('gate').style.display='block';
  $('gate').innerHTML = `<h3>Predict</h3><div class="q">${g.q}</div><div class="opts">`
    + g.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join('')
    + `</div><div class="because" id="because">${g.because}</div>`;
  $('gate').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    g.opts.forEach((o,i)=>{
      const el=$('gate').querySelector(`[data-i="${i}"]`);
      if (o.ok) el.classList.add('right'); else if (+b.dataset.i===i) el.classList.add('wrong');
      el.disabled=true;
    });
    $('because').classList.add('on');
    GATED=false;
    updateTransportLock();
    // Collapse the unchosen options once answered. The gate deliberately sits
    // above the player so you commit before seeing — but left expanded it pushes
    // the machine below the fold, which costs the 5-second coarse read (R-ZOOM).
    $('gate').querySelectorAll('.opt').forEach(el=>{
      if(!el.classList.contains('right')&&!el.classList.contains('wrong')) el.style.display='none';
    });
  });
}

function decayFor(n){ for(let b=0;b<=2;b++){const i=cursor-b; if(i>=1&&STATES[i].changed.includes(n)) return b;} return -1; }

function render(){
  const st = STATES[cursor];
  const top = st.frames.length ? st.frames[st.frames.length-1] : null;
  // No frames means no current instruction — during the hole the VM is not
  // executing anything, and the bytecode pane says so rather than showing a
  // stale chunk.
  const chunkName = top ? top.name : null;
  const chunk = chunkName ? CHUNKS[chunkName] : null;
  const fc = hueOf(st.current);

  $('src').innerHTML = SRC.map((l,i)=>
    `<span class="line${i===st.line&&cursor>0?' on':''}">${esc(l)||' '}</span>`).join('');

  $('chunkname').innerHTML = chunkName ? esc(chunkName)+' <span style="color:var(--ink-faint)">· INFERRED</span>' : '—';
  $('bc').innerHTML = !chunk ? '<span style="color:var(--ink-faint)">no frame — nothing is executing</span>'
    : chunk.code.map((o,i)=>{
        const on = cursor>0 && i===st.ip;
        const opd = o.a ? `<span class="operand${o.lit?' lit':''}">${esc(o.a)}</span>` : '';
        return `<span class="op${on?' on':''}"><span class="ad">${String(i).padStart(4,'0')}</span><span>${o.t.padEnd(13,' ')}${opd}</span></span>`;
      }).join('');

  // gutter
  const g=$('gutter'), hot = st.hostDepth>1;
  g.className = 'gutter'+(hot?' hot':'');
  g.innerHTML = `<div class="lbl">machine<br>stack</div><div class="bars">`
    + Array.from({length:st.hostDepth},()=>'<div class="bar"></div>').join('')
    + `</div><div class="d mono">d=${st.hostDepth}</div><div class="lbl">cannot<br>park</div>`;

  // tape / hole
  const body=$('tapebody'), lanes=$('lanes'), idx=$('idx');
  if (st.hole){
    lanes.innerHTML='';
    body.innerHTML = `<div class="hole">VM holds nothing — both fibers’ state is in their objects</div>`;
    idx.innerHTML='';
  } else {
    lanes.innerHTML='';
    for (let d=Math.max(st.frames.length,1)-1; d>=0; d--){
      const lane=document.createElement('div'); lane.className='lane';
      const f=st.frames[d];
      if (f){
        const span=Math.max(1, st.tape.length-f.offset);
        const b=document.createElement('div');
        b.className='bracket'+(f.kind==='blk'?' blk':'');
        b.style.setProperty('--fc', fc);
        b.style.left=`calc(${f.offset} * (100% / ${SLOTS}))`;
        b.style.width=`calc(${span} * (100% / ${SLOTS}))`;
        const isTop = d===st.frames.length-1;
        // Metadata degrades to a compact form rather than vanishing. A narrow
        // bracket is exactly when generations matter most (E4's tape is 2 slots
        // wide), so suppressing them by width hides the lesson.
        const wide = span>=3;
        const meta = wide
          ? `<span class="meta mono">offset=<span class="${st.readfrom!==null&&isTop?'hot':''}">${f.offset}</span> · gen=${f.gen}</span>`
          : `<span class="meta mono">gen=${f.gen}</span>`;
        // A block frame carries a home_frame_token; a method frame does not, and
        // that difference IS non-local return. Deadness is DERIVED, not scripted:
        // the token's index has been reused by a later activation.
        const hd = f.home && (!st.frames[f.home.index] || st.frames[f.home.index].gen !== f.home.gen);
        const home = f.home
          ? `<span class="home mono${hd?' dead':''}">${wide?`home ▸ f${f.home.index} gen${f.home.gen}`:`▸f${f.home.index}g${f.home.gen}`}${hd?' ✗ DEAD':''}</span>`
          : '';
        b.title=`${f.name} — stack_offset=${f.offset}, generation=${f.gen}`
          + (f.home?`, home_frame_token = (index ${f.home.index}, generation ${f.home.gen})${hd?' — DEAD':''}`:'');
        b.innerHTML=`<span class="nm mono">${esc(f.name)}</span>${meta}${home}`;
        lane.appendChild(b);
      }
      lanes.appendChild(lane);
    }
    const sl=document.createElement('div'); sl.className='slots';
    sl.style.gridTemplateColumns=`repeat(${SLOTS},1fr)`;
    for(let n=0;n<SLOTS;n++){
      const el=document.createElement('div');
      const val=st.tape[n], beyond=n>=st.tape.length;
      el.className='slot'+(beyond?' beyond':'')+(val==='·'?' nilv':'');
      el.dataset.slot=n;
      const d=decayFor(n); if(d>=0&&!beyond) el.classList.add('chg-'+d);
      if(st.readfrom===n) el.classList.add('readfrom');
      if(st.cells.some(c=>!c.closed&&c.slot===n&&c.fiber===st.current)) el.classList.add('upv');
      el.innerHTML = beyond?'':`<span class="mono">${esc(val)}</span>`;
      if(top&&!beyond){ const r=n-top.offset; if(r>=0&&top.locals?.[r]) el.title=`${top.locals[r]} — ${top.name} local ${r} (absolute slot ${n})`; }
      sl.appendChild(el);
    }
    body.innerHTML=''; body.appendChild(sl);
    idx.style.gridTemplateColumns=`repeat(${SLOTS},1fr)`;
    idx.innerHTML='';
    for(let n=0;n<SLOTS;n++){
      const d=document.createElement('div'); d.className='mono';
      let lab=String(n), named=false;
      if(top){const r=n-top.offset; if(r>=0&&top.locals?.[r]){lab=top.locals[r];named=true;}}
      if(named){d.classList.add('named'); d.style.setProperty('--fc',fc);}
      if(st.readfrom===n) d.classList.add('hot');
      d.textContent=lab; idx.appendChild(d);
    }
  }

  // cells
  $('cells').innerHTML = !st.cells.length ? '' : st.cells.map((c,i)=>{
    if (c.closed) return `<span class="cell closed mono"><span class="k">cell ${c.name}</span><span class="arrow">holds</span>${esc(c.value)} <span class="arrow">· closed</span></span>`;
    const live = c.fiber===st.current && !st.hole;
    const cls = live ? 'cell' : 'cell stretched';
    const where = live ? `slot ${c.slot} <span class="arrow">(live tape)</span>`
                       : `slot ${c.slot} <span class="arrow">of</span> ${esc(st.fibers[c.fiber]?.name||('F'+c.fiber))} <span class="arrow">(parked)</span>`;
    return `<span class="${cls} mono" id="cellchip-${i}"><span class="k">cell ${c.name}</span><span class="arrow">→</span>${where}</span>`;
  }).join('');

  // rail
  const ids = Object.keys(st.fibers).map(Number).sort();
  $('rail').innerHTML = ids.map(id=>{
    const f=st.fibers[id], running = id===st.current && !st.hole && f.status==='running';
    // compartments are full exactly when this fiber is parked — a *running*
    // fiber's card is empty, because its buffers are in the VM.
    const comp = ['frames','stack','upvals','chk'].map(l=>
      `<div class="${f.parked?'full':''}">${l}</div>`).join('');
    const res = f.result!=null
      ? `<div class="fres mono${f.status==='failed'?' err':''}">result: ${esc(f.result)}</div>` : '';
    return `<div class="fcard ${running?'running':''} ${f.status==='failed'?'failed':''}" data-fiber="${id}" style="--fc:${hueOf(id)}">
      <div class="hd"><span>${esc(f.name)}</span><span class="st">${f.status}</span></div>
      <div class="comp">${comp}</div>${res}</div>`;
  }).join('')
  + `<div class="railh">resumer chain</div><div class="chain mono">`
  + (ids.every(i=>st.fibers[i].resumer===null)
     ? '<span style="color:var(--ink-faint)">—</span>'
     : ids.filter(i=>st.fibers[i].resumer!==null).map(i=>{
         const f=st.fibers[i], mode=f.mode||'call';
         const halting = st.unwind && mode==='try';
         return `${esc(st.fibers[f.resumer].name)} <span class="e ${mode}${st.unwind?' hot':''}">─${mode}─▶</span> ${esc(f.name)}`
           + (halting?`<div class="halt">unwind stops here — the fiber floor</div>`:'')
           + (st.unwind&&mode==='call'?`<div class="cross">unwind crosses into the resumer</div>`:'');
       }).join('<br>'))
  + `</div><div class="railh">spawn hopper</div><div class="hopper mono">${st.hopper.length?st.hopper.join(' '):'empty'}</div>`
  // The pinned half of the partition, made visible. This readout must NOT move
  // when the tape does — that is the entire claim "movable is position, pinned
  // is identity", and E4 reads this counter to detect a dead frame.
  + `<div class="railh">vm · pinned</div><div class="pinned mono">next_frame_generation = <b>${st.gen}</b></div>`;

  // resolution strip
  const rz=$('resolve');
  if (st.readfrom!==null && top && !st.hole){
    const rel=st.readfrom-top.offset;
    if (rel>=0){
      rz.className='resolve on';
      rz.innerHTML=`<span class="mono chip">GetLocal ${rel}</span><span class="eq">compile-time constant</span>`
        +`<span class="eq">→</span><span class="mono chip">stack_offset ${top.offset}</span><span class="eq">+</span>`
        +`<span class="mono chip">${rel}</span><span class="eq">=</span><span class="mono chip">slot ${st.readfrom}</span>`
        +`<span class="why">One addition — <span class="mono">dispatch.rs:721</span>. No lookup, no hash. `
        +`The name <span class="mono">${esc(top.locals?.[rel]??'?')}</span> does not exist at runtime.</span>`;
    } else {
      rz.className='resolve on';
      rz.innerHTML=`<span class="mono chip">GetUpvalue</span><span class="eq">→</span>`
        +`<span class="mono chip">slot ${st.readfrom}</span>`
        +`<span class="why">This frame's base is ${top.offset}; the slot is ${st.readfrom}. `
        +`<b><span class="mono">stack_offset + slot</span> cannot reach it</b> — which is exactly why a cell exists.</span>`;
    }
  } else rz.className='resolve';

  // callout
  const co=$('callout');
  const ev = cursor>0 ? EVENTS[cursor-1] : null;
  const note = ev?.note;
  co.className='callout'+(note?'':' empty')+(st.error?' err':'');
  co.querySelector('.txt').innerHTML = st.error
    ? `<b>${esc(st.error.kind)}</b> — ${esc(st.error.msg)}<br>${note||''}` : (note||'');

  $('counter').textContent=`event ${cursor} / ${EVENTS.length}`;
  $('scrub').value=cursor;
  $('prev').disabled=$('first').disabled=cursor===0;
  $('next').disabled=$('last').disabled=cursor===EVENTS.length;

  renderConnectors(st);
}

// Upvalue cells are heap objects, not one of the four fields a switch moves
// (§6). A cell's connector is drawn fresh every render from current DOM
// geometry — never tweened, never cached across cursors — so it is correct
// for a still frame by construction (R-STATIC) and cannot visually break
// across a park: at every cursor it either reaches the live tape slot or
// the owning fiber's card, with no state in between (N7).
function renderConnectors(st){
  const svg = $('upvsvg'), machine = $('machine');
  if (!svg || !machine || !st.cells.length){ if(svg) svg.innerHTML=''; return; }
  const mRect = machine.getBoundingClientRect();
  svg.setAttribute('width', mRect.width);
  svg.setAttribute('height', mRect.height);
  svg.setAttribute('viewBox', `0 0 ${mRect.width} ${mRect.height}`);
  let out = '';
  st.cells.forEach((c,i) => {
    if (c.closed) return; // closed: value retracted into the cell, no line (§6)
    const chip = document.getElementById('cellchip-'+i);
    if (!chip) return;
    const cRect = chip.getBoundingClientRect();
    const cx = cRect.left + cRect.width/2 - mRect.left, cy = cRect.top - mRect.top;
    const live = c.fiber===st.current && !st.hole;
    let tx, ty;
    if (live) {
      const slotEl = document.querySelector(`.slot[data-slot="${c.slot}"]`);
      if (!slotEl) return;
      const sRect = slotEl.getBoundingClientRect();
      tx = sRect.left + sRect.width/2 - mRect.left; ty = sRect.bottom - mRect.top;
    } else {
      // Parked (including the hole): the tape moved out from under the cell
      // into the owning fiber's object, so the connector stretches into that
      // fiber's card — the single rendered fact behind Upvalue::Open{fiber,slot}.
      const card = document.querySelector(`.fcard[data-fiber="${c.fiber}"]`);
      if (!card) return;
      const kRect = card.getBoundingClientRect();
      tx = kRect.left + 16 - mRect.left; ty = kRect.top + kRect.height/2 - mRect.top;
    }
    const midY = (cy + ty) / 2;
    const hue = hueOf(c.fiber);
    out += `<path class="upv-line${live?'':' parked'}" style="stroke:${hue}" d="M ${cx} ${cy} C ${cx} ${midY}, ${tx} ${midY}, ${tx} ${ty}"/>`;
    out += `<circle class="upv-dot" cx="${cx}" cy="${cy}" r="3" style="fill:${hue}"/>`;
    out += `<circle class="upv-dot" cx="${tx}" cy="${ty}" r="3" style="fill:${hue}"/>`;
  });
  svg.innerHTML = out;
}

// Cursor 0 is where the gate lives; clamping here (not just disabling the
// buttons) closes the keyboard/scrub-drag route past an unanswered prediction.
const go = n => { if (GATED && ex().gate) n = 0; cursor=Math.max(0,Math.min(EVENTS.length,n)); render(); };

const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// Beats stay discrete cursor positions — `render()` always draws the correct
// state instantly, exactly as `go()` does. `step()` only additionally lays a
// clone of the tape over that instant render and animates the clone's
// position (never its content) on top, so a single step across a park/unpark
// edge *reads* as motion (UI-SPEC §8) without ever delaying or interpolating
// state (N7). Only single-step navigation (prev/next, plain arrow keys,
// autoplay) goes through here; scrub/jump/first/last stay on `go()` so fast
// scrubbing shows no smearing or intermediate frame.
function playTapeTween(clone, mode){
  const host = $('tapearea');
  if (!host || !clone) return;
  clone.removeAttribute('id');
  clone.className = 'tape-tween ' + (mode==='out' ? 'tw-out' : 'tw-in');
  host.appendChild(clone);
  void clone.offsetWidth; // force layout so the starting transform paints before...
  clone.classList.add('tw-play'); // ...this class flips it, which is what the transition animates
  setTimeout(() => clone.remove(), 450);
}

function step(delta){
  let target = cursor + delta;
  if (GATED && ex().gate) target = 0;
  target = Math.max(0, Math.min(EVENTS.length, target));
  if (target === cursor){ go(target); return; }
  const fromHole = STATES[cursor].hole, toHole = STATES[target].hole;
  const tweenOut = !reducedMotion() && !fromHole && toHole;   // take: tape exits toward the card
  const tweenIn  = !reducedMotion() &&  fromHole && !toHole;  // install: tape enters from the card
  const tapearea = $('tapearea');
  const outClone = tweenOut && tapearea ? tapearea.cloneNode(true) : null;
  go(target);
  if (outClone) playTapeTween(outClone, 'out');
  else if (tweenIn && tapearea) playTapeTween(tapearea.cloneNode(true), 'in');
}
function jumpSwitch(dir){
  let i=cursor+dir;
  while(i>0&&i<=EVENTS.length){
    const e=EVENTS[i-1];
    if(e.switch&&e.switch.phase==='hole'){go(i);return;}
    i+=dir;
  }
  go(dir>0?EVENTS.length:0);
}

$('play').onclick=()=>togglePlay();
$('prev').onclick=()=>step(-1); $('next').onclick=()=>step(1);
$('first').onclick=()=>go(0); $('last').onclick=()=>go(EVENTS.length);
$('scrub').oninput=e=>go(+e.target.value);
// Autoplay is deliberately secondary (R-MANUAL): a viewer who cannot stop cannot
// predict. It stops at the end and at any raised error.
let PLAY=null;
function togglePlay(){
  if(PLAY){ clearInterval(PLAY); PLAY=null; $('play').textContent='▶'; return; }
  if(GATED && ex().gate) return;
  $('play').textContent='▮';
  PLAY=setInterval(()=>{
    if(cursor>=EVENTS.length || STATES[cursor].error){ togglePlay(); return; }
    step(1);
  }, 900);
}

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'){ e.shiftKey?jumpSwitch(1):step(1); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ e.shiftKey?jumpSwitch(-1):step(-1); e.preventDefault(); }
  if(e.key==='Home'){go(0);e.preventDefault()}
  if(e.key==='End'){go(EVENTS.length);e.preventDefault()}
  if(e.key===' '){ togglePlay(); e.preventDefault(); }
  if(/^[1-9]$/.test(e.key)){
    const k=Object.keys(EXAMPLES)[+e.key-1];
    if(k){ if(PLAY) togglePlay(); load(k,0); e.preventDefault(); }
  }
  if(e.key.toLowerCase()==='t'){
    const c=document.documentElement.getAttribute('data-theme');
    const dark=c?c==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  }
});

load('e1',0);
</script>
</body>
</html>
